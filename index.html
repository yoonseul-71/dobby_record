<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DOHYEON ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root {
  --page: #f1f3f6; --page-fg: #12161c; --page-muted: #566170;
  --panel: #ffffff; --surface: #ffffff; --line: #222222; /* 탭 및 카드 테두리를 검은색으로 고정 */
  --accent: #2a56d6; --accent-ink: #ffffff; --soft: #e4ebfc; --soft-ink: #1f3fa6;
  --win: #16794c; --win-bg: #dff2e6; --loss: #b3282d; --loss-bg: #fae3e3; --neutral-bg: #e6e9ee;
  --pink: #d65a9e; --pink-bg: #fbe3f0; --pink-ink: #7d1f55;
  --yellow: #d9a200; --yellow-bg: #fdf0b8; --yellow-ink: #5a4400;
  --sky: #4a9be8; --sky-bg: #dcecfd; --sky-ink: #0f4a86;
  --violet: #9b6fe0; --violet-bg: #eadfff; --violet-ink: #4a2a8c;
  
  --font-body: "Noto Sans KR", system-ui, sans-serif;
  --font-title: "Gowun Dodum", sans-serif; /* 둥글고 반듯한 감성의 폰트 */
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--page-fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; padding: 28px 16px 56px; }

.wrap { max-width: 1090px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
a { color: inherit; text-decoration: none; }

header.top { display: flex; justify-content: space-between; align-items: flex-start; }
h1 { margin: 0; font-family: var(--font-body); font-weight: 800; font-size: 48px; line-height: 1; letter-spacing: -0.01em; text-transform: uppercase; font-style: normal; } /* 영어 제목 기울기 제거 및 반듯하게 */

/* 스티커 탭 (검은색 테두리 적용) */
nav.bar { display: flex; align-items: flex-end; gap: 6px; border-bottom: 2px solid var(--line); padding-left: 10px; }
nav.bar a {
  position: relative; display: inline-flex; align-items: center; padding: 8px 22px;
  border-radius: 8px 8px 0 0; font-weight: 700; font-size: 15px;
  background: var(--note); color: var(--note-ink); border: 2px solid var(--line); border-bottom: 0;
  box-shadow: 0 -2px 5px rgba(0,0,0,0.05); transform: translateY(2px);
}
nav.bar a[data-cat="record"] { --note: var(--pink-bg); --note-ink: var(--pink-ink); }
nav.bar a[data-cat="scrim"] { --note: var(--yellow-bg); --note-ink: var(--yellow-ink); }
nav.bar a[data-cat="mc"] { --note: var(--sky-bg); --note-ink: var(--sky-ink); }
nav.bar a[data-cat="chong"] { --note: var(--violet-bg); --note-ink: var(--violet-ink); }
nav.bar a[aria-current="page"] {
  z-index: 1; transform: none; padding-top: 11px; padding-bottom: 9px; margin-bottom: -1px;
  border-color: var(--line); border-bottom: 2px solid var(--panel); background: var(--panel); color: var(--page-fg);
}

.panel { background: var(--panel); border-radius: 0 0 12px 12px; padding: 24px; border: 2px solid var(--line); border-top: 0; }
.block { display: flex; flex-direction: column; gap: 20px; }
.subnav { display: flex; gap: 8px; flex-wrap: wrap; }
.subnav a { padding: 5px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--page-fg); font-size: 13px; cursor: pointer; }
.subnav a[aria-current="page"] { background: var(--soft); border-color: var(--accent); color: var(--soft-ink); font-weight: 700; }
.subnav .n { opacity: 0.7; margin-left: 4px; }

h2 { margin: 0; font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

.stats { display: flex; gap: 32px; align-items: flex-end; }
.stat .k { font-size: 12px; color: var(--page-muted); display: block; }
.stat .v { font-size: 22px; font-weight: 700; }

.toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.filters { display: flex; gap: 6px; align-items: center; }
.chip { font: inherit; font-size: 13px; padding: 4px 14px; border-radius: 999px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); color: var(--page-fg); }
.chip[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--soft-ink); font-weight: 700; }

.month { border: 2px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); margin-bottom: 16px; }
.month summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: #eef3fc; color: #1a365d; font-weight: bold; }
.month summary::-webkit-details-marker { display: none; }
.month .m-title { font-size: 16px; color: #2b6cb0; }
.month .m-meta { font-size: 13px; opacity: 0.8; font-weight: normal; }
.month .seg { margin-left: 10px; display: inline-flex; border: 1px solid #cbd5e0; border-radius: 999px; overflow: hidden; }
.month .seg button { font: inherit; font-size: 11px; padding: 2px 10px; border: 0; background: transparent; cursor: pointer; }
.month .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: bold; }
.month .rate-box { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.month .bar { width: 100px; height: 8px; border-radius: 4px; background: var(--loss-bg); overflow: hidden; }
.month .bar b { display: block; height: 100%; background: var(--win); }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 700px; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--page-muted); font-weight: 500; }
tbody tr:hover { background: rgba(0,0,0,0.02); }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.pill.w { background: var(--win-bg); color: var(--win); }
.pill.l { background: var(--loss-bg); color: var(--loss); }

/* 카드 스타일 (검은색 테두리 적용) */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 15px; }
.card { display: flex; flex-direction: column; justify-content: space-between; min-height: 130px; padding: 20px; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; text-decoration: none; color: var(--page-fg); transition: border-color 0.15s, transform 0.15s; position: relative; overflow: hidden; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); }

/* 마크서버 카드: 코창서버(작은글씨), 북해빙궁(0.5배 키우고 파란색)[cite: 20, 22] */
.card-mc .server-name { font-size: 12px; font-weight: 500; color: var(--page-muted); }
.card-mc .guild-name { font-size: 21px; font-weight: 800; color: #2a56d6; margin-top: 2px; }

/* 총겜동 카드: 둥글고 반듯한 폰트 */
.card-chong .ep-no { font-family: var(--font-title); font-weight: 800; font-size: 28px; color: var(--violet); line-height: 1; }
.card-chong .ep-title { font-family: var(--font-title); font-size: 17px; font-weight: 700; color: #000; margin-top: 6px; }

/* 롤 멸망전 카드: 도이온2 0.5배 축소 및 둥근 서체, 노란색 포인트, 우측 상단 북마크 */
.card-scrim .scrim-no { font-family: var(--font-title); font-weight: 800; font-size: 22px; color: #d99b00; line-height: 1; }
.card-scrim .scrim-title { font-family: var(--font-title); font-size: 17px; font-weight: 700; color: #000; margin-top: 6px; }
.card-badge { position: absolute; top: 0; right: 0; background: var(--yellow-bg); color: var(--yellow-ink); font-size: 11px; font-weight: bold; padding: 4px 10px; border-bottom-left-radius: 8px; border: 1.5px solid var(--yellow); border-top: 0; border-right: 0; }

.card-more { align-self: flex-end; font-size: 12px; color: var(--page-muted); font-weight: 500; margin-top: auto; padding-top: 10px; }
.card-admin-btns { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; z-index: 2; }

/* 롤 멸망전 상세페이지 표 스타일 (2번 사진 반영)[cite: 23] */
.scrim-detail-table { width: 100%; border-collapse: collapse; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 15px; background: #fff; }
.scrim-detail-table th, .scrim-detail-table td { border: 1px solid #dcdcdc; padding: 12px; text-align: left; }
.scrim-detail-table .team-header { background: #e8f0fe; font-weight: bold; font-size: 15px; color: #1a73e8; }
.scrim-detail-table .pos-cell { background: #f9f9f9; text-align: center; font-weight: bold; color: #555; width: 60px; }
.scrim-detail-table .player-info { font-weight: bold; font-size: 14px; }
.scrim-detail-table .champion-info { font-size: 13px; color: #555; margin-top: 2px; }

/* 마크서버 타임라인 (링크 화살표만 파란색, 옆 글씨는 검정 통일)[cite: 24] */
.ep-detail-wrap { display: flex; flex-direction: column; gap: 20px; margin-top: 15px; }
.ep-box { border: 2px solid var(--line); border-radius: 12px; padding: 20px; background: var(--surface); }
.ep-box-title { font-family: var(--font-title); font-size: 16px; font-weight: bold; color: var(--page-fg); margin-bottom: 12px; border-bottom: 1.5px solid var(--line); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.timeline-clean { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.timeline-clean li { font-size: 14px; display: flex; align-items: center; gap: 6px; color: #000; }
.timeline-clean a { color: #000; text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
.timeline-clean a:hover { text-decoration: underline; }
.timeline-clean .arrow { color: var(--accent); font-weight: bold; } /* 화살표만 파란색 */

.back-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--page-muted); margin-bottom: 10px; cursor: pointer; text-decoration: none; }
.day-tabs { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
.day-tab-btn { padding: 6px 14px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); font-weight: bold; cursor: pointer; font-size: 13px; }
.day-tab-btn[aria-selected="true"] { background: var(--sky-bg); border-color: var(--sky); color: var(--sky-ink); }

/* 모달 */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
.light-modal { background: var(--panel); color: var(--page-fg); border-radius: 12px; width: 100%; max-width: 580px; max-height: 90vh; overflow-y: auto; padding: 24px; border: 2px solid var(--line); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
.light-modal h3 { margin-top: 0; font-size: 18px; border-bottom: 1.5px solid var(--line); padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.light-modal .close-btn { cursor: pointer; border: 0; background: transparent; font-size: 20px; }
.light-modal label { display: block; font-size: 12px; font-weight: bold; color: var(--page-muted); margin-bottom: 6px; }
.light-modal input, .light-modal select, .light-modal textarea { width: 100%; font: inherit; padding: 10px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface); color: var(--page-fg); margin-bottom: 14px; }
.light-modal .btn-group { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
.light-modal .btn-save { background: var(--accent); color: var(--accent-ink); border: 0; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
.light-modal .btn-cancel { background: var(--neutral-bg); color: var(--page-fg); border: 0; padding: 10px 16px; border-radius: 6px; cursor: pointer; }

#admin-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #18181b; color: #fff; padding: 10px 24px; display: none; justify-content: space-between; align-items: center; z-index: 999; font-weight: bold; }
#admin-bar button { background: #ef4444; color: #fff; border: 0; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
.btn-btn { font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 6px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); }
.btn-accent { background: var(--accent); color: #fff; border: 0; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>DOHYEON ARCHIVE</h1>
  </header>

  <div class="sheet">
    <nav class="bar" id="mainNav">
      <a href="#record" data-cat="record">전적</a>
      <a href="#scrim" data-cat="scrim">롤 멸망전</a>
      <a href="#mc" data-cat="mc">마크서버</a>
      <a href="#chong" data-cat="chong">총겜동</a>
    </nav>
    <div class="panel">
      <main id="view"></main>
    </div>
  </div>
</div>

<div id="admin-bar">
  <span>⚡ 관리자 모드 활성화 (Alt+A)</span>
  <button onclick="logoutAdmin()">관리자 종료</button>
</div>

<!-- 상세 정보 모달 -->
<div class="modal-overlay" id="detailModal">
  <div class="light-modal">
    <h3><span id="mTitle">상세 전적</span><button class="close-btn" onclick="closeModal('detailModal')">✕</button></h3>
    <div id="modalContent"></div>
  </div>
</div>

<!-- 관리자 편집 폼 모달 -->
<div class="modal-overlay" id="adminFormModal">
  <div class="light-modal">
    <h3><span id="adminFormTitle">항목 편집</span><button class="close-btn" onclick="closeModal('adminFormModal')">✕</button></h3>
    <form id="adminForm" onsubmit="handleAdminFormSubmit(event)">
      <input type="hidden" id="afTarget">
      <input type="hidden" id="afIdx" value="-1">
      <div id="afFields"></div>
      <div class="btn-group">
        <button type="button" class="btn-cancel" onclick="closeModal('adminFormModal')">취소</button>
        <button type="submit" class="btn-save">저장하기</button>
      </div>
    </form>
  </div>
</div>

<script>
const GAME_MODES = {
  "발로란트": ["전체", "내전", "랜드", "CK"],
  "롤": ["전체", "랜드", "CK"],
  "배그": ["전체", "킬내기", "랜드", "공장"]
};

const DEFAULT_SETS = [
  {
    date: "2026-05-23", game: "발로란트", mode: "내전", balance: "상대A", set: "1세트", result: "W",
    allMembersText: "도현 (제트)\n멤버1 (소바)\n멤버2 (케이오)\n멤버3 (페이드)\n멤버4 (킬조이)"
  }
];

const DEFAULT_MC = [
  { 
    id: "mc-1", serverName: "코창서버", guildName: "북해빙궁", 
    days: [
      { 
        dayTitle: "1일차", dateStr: "2026-05-20",
        sections: [
          { title: "모험 및 탐색", timelines: [{text: "서버 첫 입장 및 스폰 확인", url: "https://youtube.com"}, {text: "마을 정찰", url: ""}] },
          { title: "광질 및 파밍", timelines: [{text: "철 광석 채굴", url: "https://youtube.com"}] }
        ] 
      }
    ] 
  }
];

const DEFAULT_CHONG = [
  { ep: 0, title: "FPS 동아리: 총겜동", desc: "총겜동의 시작을 알린 첫 방송.", timeline: [{text: "오프닝 방송 시작", url: "https://youtube.com"}, {text: "동아리 소개", url: ""}] }
];

const DEFAULT_SCRIM = [
  { 
    id: "do2", no: "도이온2", badge: "2025 시즌2 멸망전", title: "도이온2 멸망전", 
    matches: [
      {
        matchType: "스크림", date: "2025-11-15", result: "W",
        positions: [
          { pos: "탑", p1: "예시1 E 40", c1: "그웬", p2: "예시11 P 22", c2: "잭스" },
          { pos: "정글", p1: "예시2 E 12", c1: "리 신", p2: "예시12 E 5", c2: "비에고" },
          { pos: "미드", p1: "도현 P 33", c1: "아리", p2: "예시13 S 14", c2: "신드라" },
          { pos: "원딜", p1: "예시4 E 25", c1: "자야", p2: "예시14 P 40", c2: "애쉬" },
          { pos: "서포터", p1: "예시5 E 30", c1: "레오나", p2: "예시15 G 30", c2: "카르마" }
        ]
      }
    ]
  }
];

function loadFreshData() {
  if (!localStorage.getItem("dohyeon_mc")) localStorage.setItem("dohyeon_mc", JSON.stringify(DEFAULT_MC));
  if (!localStorage.getItem("dohyeon_chong")) localStorage.setItem("dohyeon_chong", JSON.stringify(DEFAULT_CHONG));
  if (!localStorage.getItem("dohyeon_scrim")) localStorage.setItem("dohyeon_scrim", JSON.stringify(DEFAULT_SCRIM));
  if (!localStorage.getItem("dohyeon_sets")) localStorage.setItem("dohyeon_sets", JSON.stringify(DEFAULT_SETS));
}
loadFreshData();

let MC_SERVERS = JSON.parse(localStorage.getItem("dohyeon_mc"));
let CHONG_EPS = JSON.parse(localStorage.getItem("dohyeon_chong"));
let SCRIM_CARDS = JSON.parse(localStorage.getItem("dohyeon_scrim"));
let setsData = JSON.parse(localStorage.getItem("dohyeon_sets"));

function saveData() {
  localStorage.setItem("dohyeon_sets", JSON.stringify(setsData));
  localStorage.setItem("dohyeon_mc", JSON.stringify(MC_SERVERS));
  localStorage.setItem("dohyeon_chong", JSON.stringify(CHONG_EPS));
  localStorage.setItem("dohyeon_scrim", JSON.stringify(SCRIM_CARDS));
}

let isAdmin = false;
let S = { game: "발로란트", mode: "전체", monthOrder: {} };

window.addEventListener("keydown", e => {
  if (e.altKey && e.code === "KeyA") {
    e.preventDefault();
    const pw = prompt("관리자 비밀코드를 입력하세요:");
    if (pw === "1520711") {
      isAdmin = true;
      document.getElementById("admin-bar").style.display = "flex";
      alert("관리자 모드가 활성화되었습니다!");
      render();
    } else if (pw !== null) alert("비밀코드가 올바르지 않습니다.");
  }
});

function logoutAdmin() {
  isAdmin = false;
  document.getElementById("admin-bar").style.display = "none";
  render();
}

function closeModal(id) { document.getElementById(id).style.display = "none"; }

function openAdminModal(target, idx = -1) {
  document.getElementById("afTarget").value = target;
  document.getElementById("afIdx").value = idx;
  const container = document.getElementById("afFields");
  container.innerHTML = "";

  if (target === "scrim") {
    const s = idx >= 0 ? SCRIM_CARDS[idx] : {};
    document.getElementById("adminFormTitle").textContent = idx >= 0 ? "롤 멸망전 카드 수정" : "새 롤 멸망전 카드 추가";
    container.innerHTML = `
      <label>팀명 / 타이틀 (노란색 글씨)</label><input type="text" id="afScrimNo" value="${s.no||''}" required>
      <label>우측 상단 북마크 시즌 설명</label><input type="text" id="afScrimBadge" value="${s.badge||''}" required>
      <label>전체 타이틀</label><input type="text" id="afScrimTitle" value="${s.title||''}" required>
    `;
  } else if (target === "chong") {
    const e = idx >= 0 ? CHONG_EPS[idx] : {};
    document.getElementById("adminFormTitle").textContent = idx >= 0 ? "총겜동 에피소드 수정" : "새 총겜동 에피소드 추가";
    container.innerHTML = `
      <label>에피소드 번호 (숫자)</label><input type="number" id="afEpNo" value="${e.ep??CHONG_EPS.length}">
      <label>에피소드 제목</label><input type="text" id="afEpTitle" value="${e.title||''}" required>
      <label>상세 설명</label><textarea id="afEpDesc" rows="3">${e.desc||''}</textarea>
      <label>타임라인 항목들 (형식: 내용 | 링크주소)</label>
      <textarea id="afChongTimeline" rows="4">${(e.timeline||[]).map(t => t.url ? `${t.text} | ${t.url}` : t.text).join('\n')}</textarea>
    `;
  } else if (target === "mc") {
    const m = idx >= 0 ? MC_SERVERS[idx] : {};
    document.getElementById("adminFormTitle").textContent = idx >= 0 ? "마크서버 수정" : "새 마크서버 추가";
    container.innerHTML = `
      <label>서버명 (상단 작은 글씨)</label><input type="text" id="afMcServer" value="${m.serverName||''}" required>
      <label>길드명 / 메인타이틀 (파란 큰 글씨)</label><input type="text" id="afMcGuild" value="${m.guildName||''}" required>
    `;
  }
  document.getElementById("adminFormModal").style.display = "flex";
}

function handleAdminFormSubmit(e) {
  e.preventDefault();
  const target = document.getElementById("afTarget").value;
  const idx = parseInt(document.getElementById("afIdx").value);

  if (target === "scrim") {
    const item = {
      id: "scrim-" + Date.now(),
      no: document.getElementById("afScrimNo").value,
      badge: document.getElementById("afScrimBadge").value,
      title: document.getElementById("afScrimTitle").value,
      matches: [{ matchType: "스크림", date: "2025-11-15", result: "W", positions: [{pos:"탑", p1:"도현 P", c1:"아리", p2:"상대탑", c2:"잭스"}] }]
    };
    if (idx >= 0) SCRIM_CARDS[idx] = { ...SCRIM_CARDS[idx], ...item };
    else SCRIM_CARDS.push(item);
  } else if (target === "chong") {
    const rawLines = document.getElementById("afChongTimeline").value.split("\n");
    const timelineArr = rawLines.map(line => {
      const parts = line.split("|");
      return { text: parts[0].trim(), url: parts[1] ? parts[1].trim() : "" };
    }).filter(t => t.text);

    const item = {
      ep: parseInt(document.getElementById("afEpNo").value),
      title: document.getElementById("afEpTitle").value,
      desc: document.getElementById("afEpDesc").value,
      timeline: timelineArr.length ? timelineArr : [{text: "오프닝 방송", url: ""}]
    };
    if (idx >= 0) CHONG_EPS[idx] = { ...CHONG_EPS[idx], ...item };
    else CHONG_EPS.push(item);
  } else if (target === "mc") {
    const item = {
      id: "mc-" + Date.now(),
      serverName: document.getElementById("afMcServer").value,
      guildName: document.getElementById("afMcGuild").value,
      days: [{ dayTitle: "1일차", dateStr: "2026-05-20", sections: [{ title: "모험", timelines: [{text: "입장", url: ""}] }] }]
    };
    if (idx >= 0) MC_SERVERS[idx] = { ...MC_SERVERS[idx], serverName: item.serverName, guildName: item.guildName };
    else MC_SERVERS.push(item);
  }

  saveData();
  closeModal("adminFormModal");
  render();
}

function deleteItem(target, idx) {
  if (!confirm("정말 삭제하시겠습니까?")) return;
  if (target === "scrim") SCRIM_CARDS.splice(idx, 1);
  else if (target === "chong") CHONG_EPS.splice(idx, 1);
  else if (target === "mc") MC_SERVERS.splice(idx, 1);
  saveData();
  render();
}

function renderRecords() {
  return `
    <div class="block">
      <h2>전체 전적</h2>
      <div style="padding:20px; text-align:center; color:var(--page-muted);">전적 데이터 목록</div>
    </div>`;
}

// 롤 멸망전 탭 (2번 사진 스타일 표 구조 반영)[cite: 23]
function renderScrims(subId) {
  if (subId) {
    const card = SCRIM_CARDS.find(c => c.id === subId) || SCRIM_CARDS[0];
    return `
      <div class="block">
        <a class="back-btn" onclick="location.hash='#scrim'">← 멸망전 목록으로</a>
        <h2>${card.title} 상세 전적</h2>
        ${(card.matches || []).map(m => `
          <div style="margin-bottom:30px;">
            <div style="font-weight:bold; margin-bottom:8px; font-family:var(--font-title);">[${m.matchType}] 날짜: ${m.date} | 결과: <span class="pill ${m.result==='W'?'w':'l'}">${m.result==='W'?'승':'패'}</span></div>
            <table class="scrim-detail-table">
              <tbody>
                <tr class="team-header">
                  <th colspan="2" style="width:45%;">도현 팀</th>
                  <th style="width:10%; text-align:center;">포지션</th>
                  <th colspan="2" style="width:45%; text-align:right;">상대 팀</th>
                </tr>
                ${m.positions.map(pos => `
                  <tr>
                    <td colspan="2">
                      <div class="player-info">${pos.p1}</div>
                      <div class="champion-info">${pos.c1}</div>
                    </td>
                    <td class="pos-cell">${pos.pos}</td>
                    <td colspan="2" style="text-align:right;">
                      <div class="player-info">${pos.p2}</div>
                      <div class="champion-info">${pos.c2}</div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `).join('')}
      </div>`;
  }

  return `
    <div class="block">
      <div class="toolbar">
        <h2>롤 멸망전</h2>
        ${isAdmin ? `<button class="btn-accent" onclick="openAdminModal('scrim')">+ 새 멸망전 카드 추가</button>` : ''}
      </div>
      <div class="cards">
        ${SCRIM_CARDS.map((c, idx) => `
          <div class="card card-scrim">
            ${c.badge ? `<div class="card-badge">${c.badge}</div>` : ''}
            ${isAdmin ? `<div class="card-admin-btns"><button class="btn-btn" onclick="openAdminModal('scrim', ${idx})">수정</button><button class="btn-btn" style="color:red;" onclick="deleteItem('scrim', ${idx})">삭제</button></div>` : ''}
            <a href="#scrim-${c.id}" style="text-decoration:none; color:inherit; display:flex; flex-direction:column; height:100%;">
              <div>
                <div class="scrim-no">${c.no}</div>
                <div class="scrim-title">${c.title}</div>
              </div>
              <div class="card-more">상세보기 →</div>
            </a>
          </div>
        `).join('')}
      </div>
    </div>`;
}

// 마크서버 탭 (모험일지 글씨 제거, 링크 화살표만 파란색)[cite: 24]
function renderMinecraft(subId, dayIndex = 0) {
  if (subId) {
    const srv = MC_SERVERS.find(s => s.id === subId) || MC_SERVERS[0];
    const curDay = srv.days[dayIndex] || srv.days[0];

    return `
      <div class="block">
        <a class="back-btn" onclick="location.hash='#mc'">← 마크서버 목록으로</a>
        <h2>${srv.serverName} (${srv.guildName})</h2>
        <div class="day-tabs">
          ${srv.days.map((d, idx) => `
            <button class="day-tab-btn" onclick="location.hash='#mc-${srv.id}-d${idx}'" ${idx === dayIndex ? 'aria-selected="true"' : ''}>
              ${d.dayTitle} <span style="font-size:11px; opacity:0.7;">(${d.dateStr})</span>
            </button>
          `).join('')}
        </div>
        <div class="ep-detail-wrap">
          ${curDay.sections.map(sec => `
            <div class="ep-box">
              <div class="ep-box-title">${sec.title}</div>
              <ul class="timeline-clean">
                ${sec.timelines.map(item => `
                  <li>
                    ${item.url ? `<a href="${item.url}" target="_blank"><span class="arrow">↗</span> ${item.text}</a>` : `<span>${item.text}</span>`}
                  </li>
                `).join('')}
              </ul>
            </div>
          `).join('')}
        </div>
      </div>`;
  }

  return `
    <div class="block">
      <div class="toolbar">
        <h2>마크서버</h2>
        ${isAdmin ? `<button class="btn-accent" onclick="openAdminModal('mc')">+ 새 마크서버 추가</button>` : ''}
      </div>
      <div class="cards">
        ${MC_SERVERS.map((s, idx) => `
          <div class="card card-mc">
            ${isAdmin ? `<div class="card-admin-btns"><button class="btn-btn" onclick="openAdminModal('mc', ${idx})">수정</button><button class="btn-btn" style="color:red;" onclick="deleteItem('mc', ${idx})">삭제</button></div>` : ''}
            <a href="#mc-${s.id}-d0" style="text-decoration:none; color:inherit; display:flex; flex-direction:column; height:100%;">
              <div>
                <div class="server-name">${s.serverName}</div>
                <div class="guild-name">${s.guildName}</div>
              </div>
              <div class="card-more">상세보기 →</div>
            </a>
          </div>
        `).join('')}
      </div>
    </div>`;
}

// 총겜동 탭
function renderChong(subEp) {
  if (subEp !== null && subEp !== undefined && subEp !== "") {
    const epObj = CHONG_EPS.find(e => e.ep === parseInt(subEp)) || CHONG_EPS[0];
    return `
      <div class="block">
        <a class="back-btn" onclick="location.hash='#chong'">← 총겜동 목록으로</a>
        <div>
          <h2>EP.${epObj.ep} ${epObj.title}</h2>
          <p style="font-size:13px; color:var(--page-muted); margin:4px 0 0 0;">${epObj.desc}</p>
        </div>
        <div class="ep-detail-wrap">
          <div class="ep-box">
            <div class="ep-box-title">방송 타임라인</div>
            <ul class="timeline-clean">
              ${epObj.timeline.map(item => `
                <li>
                  ${item.url ? `<a href="${item.url}" target="_blank"><span class="arrow">↗</span> ${item.text}</a>` : `<span>${item.text}</span>`}
                </li>
              `).join('')}
            </ul>
          </div>
        </div>
      </div>`;
  }

  return `
    <div class="block">
      <div class="toolbar">
        <h2>총겜동</h2>
        ${isAdmin ? `<button class="btn-accent" onclick="openAdminModal('chong')">+ 새 에피소드 추가</button>` : ''}
      </div>
      <div class="cards">
        ${CHONG_EPS.map((e, idx) => `
          <div class="card card-chong">
            ${isAdmin ? `<div class="card-admin-btns"><button class="btn-btn" onclick="openAdminModal('chong', ${idx})">수정</button><button class="btn-btn" style="color:red;" onclick="deleteItem('chong', ${idx})">삭제</button></div>` : ''}
            <a href="#chong-ep${e.ep}" style="text-decoration:none; color:inherit; display:flex; flex-direction:column; height:100%;">
              <div>
                <div class="ep-no">EP.${e.ep}</div>
                <div class="ep-title">${e.title}</div>
              </div>
              <div class="card-more">EP.${e.ep} 보기 →</div>
            </a>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function render() {
  const hash = location.hash.slice(1) || "record";
  const cat = hash.split("-")[0];

  document.querySelectorAll("#mainNav a").forEach(a => {
    if (a.dataset.cat === cat) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });

  const view = document.getElementById("view");
  if (cat === "record") view.innerHTML = renderRecords();
  else if (cat === "scrim") {
    const match = hash.match(/^scrim-(.+)$/);
    view.innerHTML = renderScrims(match ? match[1] : null);
  } else if (cat === "mc") {
    const match = hash.match(/^mc-([a-z0-9-]+)-d(\d+)$/);
    if (match) view.innerHTML = renderMinecraft(match[1], parseInt(match[2]));
    else view.innerHTML = renderMinecraft(hash.startsWith("mc-") ? hash : null, 0);
  } else if (cat === "chong") {
    const epMatch = hash.match(/^chong-ep(\d+)$/);
    view.innerHTML = renderChong(epMatch ? epMatch[1] : null);
  } else view.innerHTML = renderRecords();
}

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
