<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOOP DOHYEON - 전적 검색 & 롤 멸망전</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-base">

    <div>
        <!-- 상단 헤더 -->
        <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                <!-- 타이틀 및 서브타이틀 -->
                <div class="flex items-center space-x-3">
                    <div class="bg-amber-500/10 border border-amber-500/30 p-2.5 rounded-xl text-amber-400">
                        <i class="fa-solid fa-trophy text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white flex items-center gap-2">
                            SOOP DOHYEON
                        </h1>
                        <p class="text-xs text-slate-400 font-medium">전적 검색 & 롤 멸망전</p>
                    </div>
                </div>

                <!-- 메인 탭 & 관리자 모드 버튼 -->
                <div class="flex items-center space-x-3">
                    <nav class="flex space-x-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800">
                        <button id="nav-btn-history" onclick="switchMainTab('history')" class="px-4 py-2 rounded-lg text-sm font-bold transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-500/20">
                            게임 전적 검색
                        </button>
                        <button id="nav-btn-mwj" onclick="switchMainTab('mwj')" class="px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-400 hover:text-white hover:bg-slate-800/50">
                            롤 멸망전
                        </button>
                    </nav>
                    <button onclick="toggleAdminMode()" id="admin-mode-btn" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl border border-slate-700 transition-all">
                        <i class="fa-solid fa-lock mr-1"></i>관리자 OFF
                    </button>
                </div>
            </div>
        </header>

        <!-- 메인 컨텐츠 영역 -->
        <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

            <!-- ========================================== -->
            <!-- 1. 게임 전적 검색 섹션 -->
            <!-- ========================================== -->
            <section id="section-history" class="space-y-6">
                
                <!-- 상단 검색 및 필터 바 -->
                <div class="bg-slate-900/80 backdrop-blur border border-slate-800 p-4 rounded-2xl flex flex-col gap-4 shadow-xl">
                    
                    <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
                        <div class="flex space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800 w-full md:w-auto">
                            <button id="game-tab-val" onclick="switchGameTab('val')" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-xs sm:text-sm font-bold bg-rose-600 text-white transition-all">
                                VALORANT
                            </button>
                            <button id="game-tab-lol" onclick="switchGameTab('lol')" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-xs sm:text-sm font-bold text-slate-400 hover:text-white transition-all">
                                LEAGUE OF LEGENDS
                            </button>
                            <button id="game-tab-pubg" onclick="switchGameTab('pubg')" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-xs sm:text-sm font-bold text-slate-400 hover:text-white transition-all">
                                PUBG
                            </button>
                        </div>

                        <div class="flex gap-2 w-full md:w-auto">
                            <button onclick="openAddRecordModal()" id="add-record-btn" class="hidden px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition-all flex items-center gap-1 whitespace-nowrap">
                                <i class="fa-solid fa-plus"></i> 기록 추가
                            </button>
                            <div class="relative flex-1 md:w-64">
                                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                                <input type="text" id="search-input" onkeyup="filterRecords()" placeholder="스트리머, 챔프/요원, 날짜..." class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-sm rounded-xl pl-9 pr-4 py-2 outline-none focus:border-indigo-500">
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-wrap items-center gap-3 pt-2 border-t border-slate-800/60 text-xs sm:text-sm">
                        <div class="flex items-center gap-1.5">
                            <span class="text-slate-400 font-medium">연도:</span>
                            <select id="year-filter" onchange="filterRecords()" class="bg-slate-950 border border-slate-800 text-slate-200 rounded-lg px-2.5 py-1.5 outline-none focus:border-indigo-500">
                                <option value="ALL">전체 연도</option>
                                <option value="2024">2024년</option>
                                <option value="2025" selected>2025년</option>
                                <option value="2026">2026년</option>
                                <option value="2027">2027년</option>
                                <option value="2028">2028년</option>
                            </select>
                        </div>

                        <div class="flex items-center gap-1.5">
                            <span class="text-slate-400 font-medium">월:</span>
                            <select id="month-filter" onchange="filterRecords()" class="bg-slate-950 border border-slate-800 text-slate-200 rounded-lg px-2.5 py-1.5 outline-none focus:border-indigo-500">
                                <option value="ALL">전체 월</option>
                                <option value="01">1월</option> <option value="02">2월</option> <option value="03">3월</option>
                                <option value="04">4월</option> <option value="05">5월</option> <option value="06">6월</option>
                                <option value="07">7월</option> <option value="08">8월</option> <option value="09">9월</option>
                                <option value="10">10월</option> <option value="11">11월</option> <option value="12">12월</option>
                            </select>
                        </div>

                        <div class="flex items-center gap-1.5">
                            <span class="text-slate-400 font-medium">유형:</span>
                            <select id="type-filter" onchange="filterRecords()" class="bg-slate-950 border border-slate-800 text-slate-200 rounded-lg px-2.5 py-1.5 outline-none focus:border-indigo-500">
                                <option value="ALL">전체 유형</option>
                                <option value="내전">내전</option>
                                <option value="CK">CK</option>
                                <option value="랜드">랜드</option>
                                <option value="킬내기">킬내기</option>
                                <option value="총겜동">총겜동</option>
                                <option value="자유입력">자유입력</option>
                            </select>
                        </div>
                    </div>

                </div>

                <!-- 전적 리스트 출력 구역 -->
                <div id="record-list" class="space-y-3"></div>
            </section>

            <!-- ========================================== -->
            <!-- 2. 롤 멸망전 섹션 -->
            <!-- ========================================== -->
            <section id="section-mwj" class="space-y-6 hidden">
                
                <div id="mwj-main-view">
                    <div class="mb-6 flex justify-between items-end">
                        <div>
                            <h2 class="text-xl font-bold text-white mb-1">참여 멸망전 목록</h2>
                            <p class="text-sm text-slate-400">팀 카드를 클릭하면 상세 아카이브를 확인할 수 있습니다.</p>
                        </div>
                        <button onclick="openAddTeamModal()" id="add-mwj-btn" class="hidden px-3.5 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold rounded-xl transition-all">
                            <i class="fa-solid fa-plus mr-1"></i>멸망전 팀 추가
                        </button>
                    </div>

                    <div id="mwj-teams-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </div>

                <!-- 멸망전 상세 아카이브 뷰 -->
                <div id="mwj-detail-view" class="space-y-6 hidden">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-2xl gap-3">
                        <div class="flex items-center space-x-4">
                            <button onclick="closeMwjDetail()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold rounded-xl transition-all">
                                <i class="fa-solid fa-arrow-left mr-1.5"></i>목록으로
                            </button>
                            <div>
                                <h2 id="detail-team-title" class="text-lg font-bold text-white">멸망전 상세 아카이브</h2>
                                <span class="text-xs text-amber-400 font-medium">상세 경기 기록</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 w-full sm:w-auto justify-between">
                            <!-- 스크림 / 대회 탭 -->
                            <div class="flex space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
                                <button id="mwj-subtab-scream" onclick="switchMwjSubTab('스크림')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-600 text-white transition-all">스크림</button>
                                <button id="mwj-subtab-match" onclick="switchMwjSubTab('대회')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all">대회</button>
                            </div>
                            <button onclick="openAddMwjMatchModal()" id="add-mwj-match-btn" class="hidden px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition-all whitespace-nowrap">
                                <i class="fa-solid fa-plus mr-1"></i>경기 추가
                            </button>
                        </div>
                    </div>

                    <!-- 경기별 상세 리스트 구역 -->
                    <div id="mwj-matches-container" class="space-y-6"></div>
                </div>

            </section>

        </main>
    </div>

    <!-- 하단 푸터 -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 px-4 sm:px-6 lg:px-8 mt-12">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center text-xs text-slate-500 gap-2">
            <div>본 사이트는 비공식 전적 정리 사이트이므로 일부 누락이나 오류가 있을 수 있습니다.</div>
            <div class="font-semibold text-slate-400">made by 윤슬ツ</div>
        </div>
    </footer>

    <!-- 게임 전적 추가/수정 모달 -->
    <div id="add-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
            <h3 class="text-lg font-bold text-white"><span id="modal-game-title">VALORANT</span> 전적 <span id="modal-mode-label">추가</span></h3>
            <input type="hidden" id="edit-record-id">
            <div class="space-y-3 text-sm">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1">유형</label>
                        <select id="m-type" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                            <option value="내전">내전</option>
                            <option value="CK">CK</option>
                            <option value="랜드">랜드</option>
                            <option value="킬내기">킬내기</option>
                            <option value="총겜동">총겜동</option>
                            <option value="자유입력">자유입력</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1">날짜 (YYYY.MM.DD)</label>
                        <input type="text" id="m-date" placeholder="2025.11.21" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                    </div>
                </div>
                <div>
                    <label class="text-slate-400 block mb-1">밸런스 (상대 스트리머 등)</label>
                    <input type="text" id="m-balance" placeholder="예: 도현팀 vs 이상호팀" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                </div>
                <div id="m-game-specific-fields" class="space-y-3"></div>
                <div>
                    <label class="text-slate-400 block mb-1">전체 멤버 (선택 사항)</label>
                    <textarea id="m-members" rows="3" placeholder="도현&#10;킴성태..." class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5 custom-scrollbar"></textarea>
                </div>
                <div>
                    <label class="text-slate-400 block mb-1">승패 여부</label>
                    <select id="m-result" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                        <option value="WIN">WIN (승리)</option>
                        <option value="LOSE">LOSE (패배)</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                <button onclick="closeAddRecordModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl transition-all text-xs">취소</button>
                <button onclick="saveNewRecord()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition-all text-xs">저장하기</button>
            </div>
        </div>
    </div>

    <!-- 멸망전 팀 추가/수정 모달 -->
    <div id="mwj-team-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white">멸망전 팀 관리</h3>
            <input type="hidden" id="edit-team-id">
            <div class="space-y-3 text-sm">
                <div><label class="text-slate-400 block mb-1">팀 이름</label><input type="text" id="t-name" placeholder="도현팀" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                <div>
                    <label class="text-slate-400 block mb-1">팀 로고 이미지 선택</label>
                    <input type="file" id="t-logo-file" accept="image/*" onchange="previewLogoImage(event)" class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:bg-slate-800 file:text-slate-200 cursor-pointer">
                    <div id="t-logo-preview-box" class="mt-2 hidden flex items-center gap-3 bg-slate-950 p-2 rounded-xl border border-slate-800">
                        <img id="t-logo-preview" src="" alt="미리보기" class="w-10 h-10 rounded-lg object-cover">
                        <span class="text-xs text-emerald-400 font-semibold">선택됨</span>
                    </div>
                </div>
                <div><label class="text-slate-400 block mb-1">기본 텍스트 로고 (2~3자)</label><input type="text" id="t-logo" placeholder="DH" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                <div><label class="text-slate-400 block mb-1">시즌 및 성적</label><input type="text" id="t-desc" placeholder="준우승 🥈" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                <div><label class="text-slate-400 block mb-1">기간</label><input type="text" id="t-period" placeholder="2025.11.10 ~ 11.25" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
            </div>
            <div class="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                <button onclick="closeAddTeamModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl transition-all text-xs">취소</button>
                <button onclick="saveTeam()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl transition-all text-xs">저장하기</button>
            </div>
        </div>
    </div>

    <!-- 멸망전 경기 추가/수정 모달 -->
    <div id="mwj-match-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xl w-full p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
            <h3 class="text-lg font-bold text-white">멸망전 경기 기록 <span id="mwj-match-mode-label">추가</span></h3>
            <input type="hidden" id="edit-mwj-match-id">
            <div class="space-y-3 text-sm">
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1">분류</label>
                        <select id="mm-type" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                            <option value="스크림">스크림</option>
                            <option value="대회">대회</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1">세부 단계</label>
                        <select id="mm-category" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                            <option value="스크림">스크림</option>
                            <option value="대회 예선">대회 예선</option>
                            <option value="본선 8강">본선 8강</option>
                            <option value="본선 4강">본선 4강</option>
                            <option value="결승">결승</option>
                            <option value="자유입력">자유입력</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1">날짜</label>
                        <input type="text" id="mm-date" placeholder="25.11.15 토" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1">시간대/세트</label>
                        <input type="text" id="mm-setnum" placeholder="19시 1세트" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1">결과 요약</label>
                        <input type="text" id="mm-resultsummary" placeholder="1승 2패" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1">선택 진영</label>
                        <select id="mm-side" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                            <option value="BLUE">BLUE (블루)</option>
                            <option value="RED">RED (레드)</option>
                        </select>
                    </div>
                </div>

                <div class="border-t border-slate-800 pt-3">
                    <label class="text-slate-300 font-bold block mb-2">블루팀 5인 로스터 (스트리머명, 진영, 티어/점수, 챔피언)</label>
                    <div id="mm-blue-list" class="space-y-2">
                        <!-- 5명 입력폼 생성됨 -->
                    </div>
                </div>

                <div class="border-t border-slate-800 pt-3">
                    <label class="text-slate-300 font-bold block mb-2">레드팀 5인 로스터 (스트리머명, 진영, 티어/점수, 챔피언)</label>
                    <div id="mm-red-list" class="space-y-2">
                        <!-- 5명 입력폼 생성됨 -->
                    </div>
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                <button onclick="closeAddMwjMatchModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl transition-all text-xs">취소</button>
                <button onclick="saveMwjMatch()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl transition-all text-xs">저장하기</button>
            </div>
        </div>
    </div>

    <!-- 스크립트 -->
    <script>
        let mockData = {
            val: [], lol: [], pubg: []
        };

        // 멸망전 데이터 샘플
        let mwjTeams = [
            {
                id: 'team1', name: '도현팀 (승리 요정들)', logo: 'DH', logoImg: '', desc: '준우승 🥈', period: '2025.11.10 ~ 11.25', seasonTitle: '2025 ALL Season 1',
                matches: [
                    {

        function renderRecords() {
            const listEl = document.getElementById('record-list');
            const data = mockData[currentGameTab];
            const filterYear = document.getElementById('year-filter').value;
            const filterMonth = document.getElementById('month-filter').value;
            const filterType = document.getElementById('type-filter').value;
            const query = document.getElementById('search-input').value.toLowerCase();

            listEl.innerHTML = '';
            const filtered = data.filter(item => {
                const dateParts = item.date ? item.date.split('.') : [];
                const matchYear = (filterYear === 'ALL' || dateParts[0] === filterYear);
                const matchMonth = (filterMonth === 'ALL' || dateParts[1] === filterMonth);
                const matchType = (filterType === 'ALL' || item.type === filterType);
                const matchQuery = !query || (item.date && item.date.includes(query)) || (item.balance && item.balance.toLowerCase().includes(query)) || (item.members && item.members.toLowerCase().includes(query));
                return matchYear && matchMonth && matchType && matchQuery;
            });

            if(filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">해당 조건에 일치하는 전적이 없습니다.</div>`;
                return;
            }

            filtered.forEach(item => {
                const isWin = item.result === 'WIN';
                const bgStyle = isWin ? 'bg-sky-950/40 border-sky-500/40' : 'bg-rose-950/30 border-rose-500/40';
                const badgeColor = "bg-indigo-900 text-white border-indigo-700/60 font-bold";
                const formattedMembers = (item.members && item.members.trim()) ? item.members.trim().replace(/\n/g, '<br>') : '';
                const adminControls = isAdmin ? `<div class="flex items-center gap-1.5 ml-2"><button onclick="event.stopPropagation(); editRecord(${item.id})" class="px-2 py-1 bg-slate-800 hover:bg-indigo-600 text-white rounded-lg text-xs font-bold">수정</button><button onclick="event.stopPropagation(); deleteRecord(${item.id})" class="px-2 py-1 bg-slate-800 hover:bg-rose-600 text-white rounded-lg text-xs font-bold">삭제</button></div>` : '';

                let cardHtml = `
                    <details class="group border rounded-2xl overflow-hidden transition-all shadow-md text-base ${bgStyle}">
                        <summary class="p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center cursor-pointer list-none select-none gap-3">
                            <div class="flex items-center gap-3 flex-wrap">
                                ${item.type ? `<span class="text-xs px-2.5 py-1 rounded-lg border ${badgeColor}">${item.type}</span>` : ''}
                                ${item.date ? `<span class="text-xs text-slate-400 font-medium">${item.date}</span>` : ''}
                                ${item.balance ? `<span class="text-xs bg-slate-900/60 px-2.5 py-1 rounded-lg text-slate-300 border border-slate-700/50 font-semibold">${item.balance}</span>` : ''}
                            </div>
                            <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end">
                                <div class="flex items-center gap-4 sm:gap-6 text-sm">
                                    ${item.map ? `<span class="font-bold text-white">${item.map}</span>` : ''}
                                    ${item.agent ? `<span class="text-purple-300 font-bold bg-purple-950/60 px-2.5 py-1 rounded-lg text-xs">${item.agent}</span>` : ''}
                                    ${item.acs ? `<span class="text-xs text-amber-400 font-bold">ACS ${item.acs}</span>` : ''}
                                    ${item.position ? `<span class="bg-slate-900/60 text-indigo-300 px-2.5 py-1 rounded-lg text-xs font-semibold border border-slate-700/50">${item.position}</span>` : ''}
                                    ${item.champion ? `<span class="text-purple-300 font-bold">${item.champion}</span>` : ''}
                                    ${item.targetKills ? `<span class="text-amber-400 font-bold bg-amber-500/10 px-2 py-0.5 rounded-lg border border-amber-500/20 text-xs">[${item.targetKills}]</span>` : ''}
                                    ${item.memberKills ? `<span class="text-xs text-slate-200 bg-slate-900/60 px-2.5 py-1 rounded-lg border border-slate-700/50 font-semibold">${item.memberKills}</span>` : ''}
                                    ${item.kda ? `<span class="text-white font-bold">${item.kda}</span>` : ''}
                                    ${item.score ? `<span class="text-xs text-slate-300">${item.score}</span>` : ''}
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="text-sm font-black ${isWin ? 'text-sky-400' : 'text-rose-400'}">${item.result || ''}</span>
                                    <i class="fa-solid fa-chevron-down text-xs text-slate-400 group-open:rotate-180 transition-transform"></i>
                                    ${adminControls}
                                </div>
                            </div>
                        </summary>
                        ${formattedMembers ? `<div class="px-5 py-4 border-t border-slate-800/50 bg-slate-950/60 text-xs text-slate-300 flex flex-col gap-2"><span class="text-slate-400 font-bold">전체 멤버</span><div class="text-white font-medium bg-slate-900/80 p-3 rounded-xl border border-slate-800 leading-relaxed">${formattedMembers}</div></div>` : ''}
                    </details>
                `;
                listEl.innerHTML += cardHtml;
            });
        }

            document.getElementById('modal-mode-label').innerText = '수정';
            document.getElementById('edit-record-id').value = item.id;
            document.getElementById('m-type').value = item.type || '내전';
            document.getElementById('m-date').value = item.date || '';
            document.getElementById('m-balance').value = item.balance || '';
            document.getElementById('m-members').value = item.members || '';
            document.getElementById('m-result').value = item.result || 'WIN';
            openAddRecordModal();
        }

        function deleteRecord(id) {
            if(confirm('전적을 삭제하시겠습니까?')) {
                mockData[currentGameTab] = mockData[currentGameTab].filter(r => r.id !== id);
                renderRecords();
            }

        function closeAddRecordModal() { document.getElementById('add-modal').classList.add('hidden'); document.getElementById('edit-record-id').value = ''; }

        function saveNewRecord() {
            const editId = document.getElementById('edit-record-id').value;
            const type = document.getElementById('m-type').value;
            const date = document.getElementById('m-date').value || '';
            const balance = document.getElementById('m-balance').value || '';
            const result = document.getElementById('m-result').value;
            const members = document.getElementById('m-members').value || '';

            let recordItem = { id: editId ? Number(editId) : Date.now(), type, date, balance, result, members };
            if(currentGameTab === 'val') {
                recordItem.map = document.getElementById('m-map').value || '';
                recordItem.agent = document.getElementById('m-agent').value || '';
                recordItem.acs = document.getElementById('m-acs').value || '';
                recordItem.kda = document.getElementById('m-kda').value || '';
                recordItem.score = document.getElementById('m-score').value || '';
            } else if(currentGameTab === 'lol') {
                recordItem.position = document.getElementById('m-position').value || '';
                recordItem.champion = document.getElementById('m-champion').value || '';
                recordItem.kda = document.getElementById('m-kda').value || '';
            } else if(currentGameTab === 'pubg') {
                recordItem.targetKills = document.getElementById('m-target').value || '';
                recordItem.memberKills = document.getElementById('m-mkills').value || '';
                recordItem.totalScore = document.getElementById('m-score').value || '';
            }

            if(editId) {
                const idx = mockData[currentGameTab].findIndex(r => r.id === Number(editId));
                if(idx !== -1) mockData[currentGameTab][idx] = recordItem;
            } else {
                mockData[currentGameTab].unshift(recordItem);
            }
            renderRecords();
            closeAddRecordModal();
        }

        function renderMwjMatches(team) {
            const container = document.getElementById('mwj-matches-container');
            container.innerHTML = '';
            const filteredMatches = team.matches ? team.matches.filter(m => m.type === currentMwjSubTab) : [];

                container.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">등록된 ${currentMwjSubTab} 경기 기록이 없습니다.</div>`;

                let blueRows = '', redRows = '';
                for(let i=0; i<5; i++) {

                    blueRows += `<tr class="hover:bg-slate-800/30"><td class="py-2.5 font-semibold text-white">${b.name}</td><td class="text-xs text-slate-300">${b.side}</td><td class="text-slate-400 text-xs">${b.tier}</td><td><span class="bg-slate-800 text-blue-300 px-2 py-0.5 rounded text-xs">${b.champ}</span></td><td class="font-bold text-slate-400 bg-slate-950/40">${b.pos}</td><td><span class="bg-slate-800 text-rose-300 px-2 py-0.5 rounded text-xs">${r.champ}</span></td><td class="text-slate-400 text-xs">${r.tier}</td><td class="text-xs text-slate-300">${r.side}</td><td class="font-semibold text-white">${r.name}</td></tr>`;
                }

                const adminMatchControls = isAdmin ? `<div class="flex gap-2"><button onclick="editMwjMatch(${match.id})" class="px-2 py-1 bg-slate-800 hover:bg-indigo-600 text-white rounded text-xs font-bold">수정</button><button onclick="deleteMwjMatch(${match.id})" class="px-2 py-1 bg-slate-800 hover:bg-rose-600 text-white rounded text-xs font-bold">삭제</button></div>` : '';

                container.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-5">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-800 pb-4">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="bg-indigo-900 text-white font-bold text-xs px-2.5 py-1 rounded-lg">${match.category}</span>
                                <h3 class="text-lg font-bold text-white">${match.date}</h3>
                                ${match.resultSummary ? `<span class="text-xs text-slate-400 bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800">결과: ${match.resultSummary}</span>` : ''}
                            </div>
                            ${adminMatchControls}
                        </div>

                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <div class="px-3 py-1 rounded-lg text-xs font-bold bg-indigo-600 text-white">${match.setNum}</div>
                                <div class="text-xs text-slate-400 font-medium bg-slate-950 px-3 py-1 rounded-lg border border-slate-800">선택 진영: <span class="${sideColor} font-bold">${sideText}</span></div>
                            </div>

                            <div class="overflow-x-auto custom-scrollbar">
                                <table class="w-full text-center border-collapse min-w-[700px]">
                                    <thead>
                                        <tr class="text-xs text-slate-400 border-b border-slate-800 bg-slate-950/50">
                                            <th class="py-2.5 text-blue-400 font-bold w-5/12" colspan="4">BLUE TEAM</th>
                                            <th class="py-2.5 font-bold text-slate-400 w-2/12">포지션</th>
                                            <th class="py-2.5 text-rose-400 font-bold w-5/12" colspan="4">RED TEAM</th>
                                        </tr>
                                        <tr class="text-[11px] text-slate-500 border-b border-slate-800/60 bg-slate-950/30">
                                            <th>스트리머명</th><th>진영</th><th>티어/점수</th><th>챔피언</th>
                                            <th>-</th>
                                            <th>챔피언</th><th>티어/점수</th><th>진영</th><th>스트리머명</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-800/40 text-xs sm:text-sm">
                                        ${blueRows}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // 멸망전 경기 추가/수정 모달 동적 폼 생성
        function openAddMwjMatchModal() {
            document.getElementById('mwj-match-mode-label').innerText = '추가';
            document.getElementById('edit-mwj-match-id').value = '';
            document.getElementById('mm-date').value = '';
            document.getElementById('mm-setnum').value = '';
            document.getElementById('mm-resultsummary').value = '';
            buildMatchRosterInputs();
            document.getElementById('mwj-match-modal').classList.remove('hidden');
        }

        function closeAddMwjMatchModal() { document.getElementById('mwj-match-modal').classList.add('hidden'); }

        function buildMatchRosterInputs(matchData = null) {
            const positions = ['탑', '정글', '미드', '원딜', '서폿'];
            let blueHtml = '', redHtml = '';

            positions.forEach((pos, idx) => {
                const b = matchData && matchData.blueTeam ? matchData.blueTeam[idx] : { name: '', side: 'BLUE', tier: '', champ: '' };
                const r = matchData && matchData.redTeam ? matchData.redTeam[idx] : { name: '', side: 'RED', tier: '', champ: '' };

                blueHtml += `<div class="grid grid-cols-4 gap-2"><input type="text" placeholder="${pos} 스트리머" id="bm-name-${idx}" value="${b.name}" class="bg-slate-950 border border-slate-800 text-xs text-white rounded p-1.5"><input type="text" placeholder="진영(BLUE)" id="bm-side-${idx}" value="${b.side || 'BLUE'}" class="bg-slate-950 border border-slate-800 text-xs text-white rounded p-1.5"><input type="text" placeholder="티어/점수" id="bm-tier-${idx}" value="${b.tier}" class="bg-slate-950 border border-slate-800 text-xs text-white rounded p-1.5"><input type="text" placeholder="챔피언" id="bm-champ-${idx}" value="${b.champ}" class="bg-slate-950 border border-slate-800 text-xs text-white rounded p-1.5"></div>`;
                redHtml += `<div class="grid grid-cols-4 gap-2"><input type="text" placeholder="${pos} 스트리머" id="rm-name-${idx}" value="${r.name}" class="bg-slate-950 border border-slate-800 text-xs text-white rounded p-1.5"><input type="text" placeholder="진영(RED)" id="rm-side-${idx}" value="${r.side || 'RED'}" class="bg-slate-950 border border-slate-800 text-xs text-white rounded p-1.5"><input type="text" placeholder="티어/점수" id="rm-tier-${idx}" value="${r.tier}" class="bg-slate-950 border border-slate-800 text-xs text-white rounded p-1.5"><input type="text" placeholder="챔피언" id="rm-champ-${idx}" value="${r.champ}" class="bg-slate-950 border border-slate-800 text-xs text-white rounded p-1.5"></div>`;
            });

            document.getElementById('mm-blue-list').innerHTML = blueHtml;
            document.getElementById('mm-red-list').innerHTML = redHtml;
        }

        function saveMwjMatch() {
            const editId = document.getElementById('edit-mwj-match-id').value;
            const type = document.getElementById('mm-type').value;
            const category = document.getElementById('mm-category').value;
            const date = document.getElementById('mm-date').value || '25.11.15 토';
            const setNum = document.getElementById('mm-setnum').value || '19시 1세트';
            const resultSummary = document.getElementById('mm-resultsummary').value || '';
            const side = document.getElementById('mm-side').value;

            const positions = ['탑', '정글', '미드', '원딜', '서폿'];
            let blueTeam = [], redTeam = [];

            positions.forEach((pos, idx) => {
                blueTeam.push({
                    pos,
                    name: document.getElementById(`bm-name-${idx}`).value || '-',
                    side: document.getElementById(`bm-side-${idx}`).value || 'BLUE',
                    tier: document.getElementById(`bm-tier-${idx}`).value || '-',
                    champ: document.getElementById(`bm-champ-${idx}`).value || '-'
                });
                redTeam.push({
                    pos,
                    name: document.getElementById(`rm-name-${idx}`).value || '-',
                    side: document.getElementById(`rm-side-${idx}`).value || 'RED',
                    tier: document.getElementById(`rm-tier-${idx}`).value || '-',
                    champ: document.getElementById(`rm-champ-${idx}`).value || '-'
                });
            });

            const team = mwjTeams.find(t => t.id === currentSelectedTeamId);
            if(!team) return;

            if(editId) {
                const match = team.matches.find(m => m.id === Number(editId));
                if(match) {
                    match.type = type; match.category = category; match.date = date; match.setNum = setNum; match.resultSummary = resultSummary; match.side = side; match.blueTeam = blueTeam; match.redTeam = redTeam;
                }
            } else {
                if(!team.matches) team.matches = [];
                team.matches.unshift({
                    id: Date.now(), type, category, date, setNum, resultSummary, side, blueTeam, redTeam
                });
            }

            renderMwjMatches(team);
            closeAddMwjMatchModal();
        }

        function editMwjMatch(matchId) {
            const team = mwjTeams.find(t => t.id === currentSelectedTeamId);
            if(!team) return;
            const match = team.matches.find(m => m.id === matchId);
            if(!match) return;

            document.getElementById('mwj-match-mode-label').innerText = '수정';
            document.getElementById('edit-mwj-match-id').value = match.id;
            document.getElementById('mm-type').value = match.type || '스크림';
            document.getElementById('mm-category').value = match.category || '스크림';
            document.getElementById('mm-date').value = match.date || '';
            document.getElementById('mm-setnum').value = match.setNum || '';
            document.getElementById('mm-resultsummary').value = match.resultSummary || '';
            document.getElementById('mm-side').value = match.side || 'BLUE';

            buildMatchRosterInputs(match);
            document.getElementById('mwj-match-modal').classList.remove('hidden');
        }

        function deleteMwjMatch(matchId) {
            if(confirm('해당 경기 기록을 삭제하시겠습니까?')) {
                const team = mwjTeams.find(t => t.id === currentSelectedTeamId);
                if(team) {
                    team.matches = team.matches.filter(m => m.id !== matchId);
                    renderMwjMatches(team);
                }
            }
        }

        // 팀 추가 모달
        function openAddTeamModal() {
            document.getElementById('edit-team-id').value = '';
            document.getElementById('t-name').value = '';
            document.getElementById('t-logo').value = '';
            document.getElementById('t-desc').value = '';
            document.getElementById('t-period').value = '';
            document.getElementById('t-logo-file').value = '';
            document.getElementById('t-logo-preview-box').classList.add('hidden');
            uploadedLogoDataUrl = '';
            document.getElementById('mwj-team-modal').classList.remove('hidden');
        }
        function closeAddTeamModal() { document.getElementById('mwj-team-modal').classList.add('hidden'); }
        function editTeam(teamId) {
            const team = mwjTeams.find(t => t.id === teamId);
            if(!team) return;
            document.getElementById('edit-team-id').value = team.id;
            document.getElementById('t-name').value = team.name || '';
            document.getElementById('t-logo').value = team.logo || '';
            document.getElementById('t-desc').value = team.desc || '';
            document.getElementById('t-period').value = team.period || '';
            if(team.logoImg) {
                uploadedLogoDataUrl = team.logoImg;
                document.getElementById('t-logo-preview').src = team.logoImg;
                document.getElementById('t-logo-preview-box').classList.remove('hidden');
            }
            document.getElementById('mwj-team-modal').classList.remove('hidden');
        }
        function deleteTeam(teamId) {
            if(confirm('멸망전 팀을 삭제하시겠습니까?')) {
                mwjTeams = mwjTeams.filter(t => t.id !== teamId);
                renderMwjTeams();
            }
        }
        function saveTeam() {
            const editId = document.getElementById('edit-team-id').value;
            const name = document.getElementById('t-name').value || '도현팀';
            const logo = document.getElementById('t-logo').value || 'DH';
            const desc = document.getElementById('t-desc').value || '';
            const period = document.getElementById('t-period').value || '';

            if(editId) {
                const team = mwjTeams.find(t => t.id === editId);
                if(team) { team.name = name; team.logo = logo; team.desc = desc; team.period = period; if(uploadedLogoDataUrl) team.logoImg = uploadedLogoDataUrl; }
            } else {
                mwjTeams.push({ id: 'team_' + Date.now(), name, logo, desc, period, logoImg: uploadedLogoDataUrl, seasonTitle: '2025 SOOP 멸망전', matches: [] });
            }
            renderMwjTeams();
            closeAddTeamModal();
        }

        window.onload = () => { renderRecords(); };
    </script>
</body>
</html>
