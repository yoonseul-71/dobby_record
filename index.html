<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOHYEON ARCHIVE - 도현 기록 모음</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-base">

    <div>
        <!-- 상단 헤더 -->
        <header class="bg-[#0f172a] border-b border-slate-800 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex flex-col md:flex-row items-center justify-between gap-3 py-2 md:py-0">
                <div class="flex items-center space-x-3">
                    <div class="bg-amber-500/10 border border-amber-500/30 p-2.5 rounded-xl text-amber-400">
                        <i class="fa-solid fa-trophy text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-black tracking-tight text-white flex items-center gap-2">
                            SOOP DOHYEON
                        </h1>
                        <p class="text-xs text-slate-400 font-medium">도현 기록 모음</p>
                    </div>
                </div>

                <!-- 메인 탭 4개 & 관리자 모드 버튼 -->
                <div class="flex items-center space-x-3">
                    <nav class="flex space-x-1.5 bg-[#080d1a] p-1.5 rounded-xl border border-slate-800 overflow-x-auto max-w-full custom-scrollbar">
                        <button id="nav-btn-history" onclick="switchMainTab('history')" class="px-4 py-2 rounded-lg text-sm font-bold transition-all bg-indigo-600 text-white shadow-lg whitespace-nowrap">
                            게임 전적 검색
                        </button>
                        <button id="nav-btn-mwj" onclick="switchMainTab('mwj')" class="px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-400 hover:text-white whitespace-nowrap">
                            롤 멸망전
                        </button>
                        <button id="nav-btn-chong" onclick="switchMainTab('chong')" class="px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-400 hover:text-white whitespace-nowrap">
                            총겜동
                        </button>
                        <button id="nav-btn-mc" onclick="switchMainTab('mc')" class="px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-400 hover:text-white whitespace-nowrap">
                            마크서버
                        </button>
                    </nav>
                    <button onclick="toggleAdminMode()" id="admin-mode-btn" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl border border-slate-700 transition-all whitespace-nowrap">
                        <i class="fa-solid fa-lock mr-1"></i>관리자 OFF
                    </button>
                </div>
            </div>
        </header>

        <!-- 메인 컨텐츠 영역 -->
        <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

            <!-- 1. 게임 전적 검색 섹션 -->
            <section id="section-history" class="space-y-6">
                <div class="bg-[#0f172a]/90 border border-slate-800 p-5 rounded-2xl flex flex-col gap-4 shadow-xl">
                    <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
                        <div class="flex space-x-1 bg-[#080d1a] p-1.5 rounded-xl border border-slate-800 w-full md:w-auto">
                            <button id="game-tab-val" onclick="switchGameTab('val')" class="flex-1 md:flex-none px-5 py-2 rounded-lg text-sm font-bold bg-rose-600 text-white transition-all">VALORANT</button>
                            <button id="game-tab-lol" onclick="switchGameTab('lol')" class="flex-1 md:flex-none px-5 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition-all">LEAGUE OF LEGENDS</button>
                            <button id="game-tab-pubg" onclick="switchGameTab('pubg')" class="flex-1 md:flex-none px-5 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition-all">PUBG</button>
                        </div>
                        <div class="flex gap-2.5 w-full md:w-auto items-center">
                            <button onclick="openAddRecordModal()" id="add-record-btn" class="hidden px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition-all flex items-center gap-1.5 whitespace-nowrap">
                                <i class="fa-solid fa-plus"></i> 기록 추가
                            </button>
                            <select id="type-filter" onchange="renderRecords()" class="bg-[#080d1a] border border-slate-800 text-slate-300 text-sm rounded-xl px-3 py-2 outline-none focus:border-indigo-500">
                                <option value="ALL">전체 유형</option>
                                <option value="내전">내전</option>
                                <option value="CK">CK</option>
                                <option value="랜드">랜드</option>
                                <option value="자유입력">자유입력</option>
                            </select>
                            <div class="relative flex-1 md:w-56">
                                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                                <input type="text" id="search-input" onkeyup="renderRecords()" placeholder="검색..." class="w-full bg-[#080d1a] border border-slate-800 text-slate-200 text-sm rounded-xl pl-9 pr-4 py-2 outline-none focus:border-indigo-500">
                            </div>
                        </div>
                    </div>
                    <!-- 연도별 탭 & 정렬 바 -->
                    <div class="flex flex-col sm:flex-row justify-between items-center border-t border-slate-800 pt-3 gap-3">
                        <div id="history-year-tabs" class="flex space-x-1.5 overflow-x-auto max-w-full custom-scrollbar pb-1"></div>
                        <div class="flex items-center gap-1 bg-[#080d1a] p-1 rounded-xl border border-slate-800">
                            <button onclick="switchSortOrder('desc')" id="sort-btn-desc" class="px-3 py-1 rounded-lg text-xs font-bold bg-indigo-600 text-white">최신순</button>
                            <button onclick="switchSortOrder('asc')" id="sort-btn-asc" class="px-3 py-1 rounded-lg text-xs font-bold text-slate-400 hover:text-white">과거순</button>
                        </div>
                    </div>
                </div>
                <div id="record-list" class="space-y-3"></div>
            </section>

            <!-- 2. 롤 멸망전 섹션 -->
            <section id="section-mwj" class="space-y-6 hidden">
                <div id="mwj-main-view">
                    <div class="mb-6 flex justify-between items-end">
                        <div>
                            <h2 class="text-xl font-bold text-white mb-1">참여 멸망전 목록</h2>
                            <p class="text-sm text-slate-400">팀 카드를 클릭하면 상세 기록을 확인할 수 있습니다.</p>
                        </div>
                        <button onclick="openAddTeamModal()" id="add-mwj-btn" class="hidden px-3.5 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold rounded-xl transition-all">
                            <i class="fa-solid fa-plus mr-1"></i>멸망전 팀 추가
                        </button>
                    </div>
                    <div id="mwj-teams-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </div>

                <div id="mwj-detail-view" class="space-y-6 hidden">
                    <div class="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                        <div class="flex items-center space-x-4">
                            <button onclick="closeMwjDetail()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold rounded-xl transition-all">
                                <i class="fa-solid fa-arrow-left mr-1.5"></i>목록으로
                            </button>
                            <div>
                                <h2 id="detail-team-title" class="text-lg font-bold text-white">멸망전 상세 아카이브</h2>
                                <span class="text-xs text-amber-400 font-medium">상세 경기 기록</span>
                            </div>
                        </div>
                        <button onclick="openAddMatchModal()" id="add-match-btn" class="hidden px-3.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold rounded-xl transition-all">
                            <i class="fa-solid fa-plus mr-1"></i>경기 기록 추가
                        </button>
                    </div>
                    <div id="mwj-matches-container" class="space-y-6"></div>
                </div>
            </section>

            <!-- 3. 총겜동 섹션 -->
            <section id="section-chong" class="space-y-6 hidden">
                <div id="chong-main-view">
                    <div class="mb-6 flex justify-between items-end">
                        <div>
                            <h2 class="text-xl font-bold text-white mb-1">총겜동 컨텐츠 모음</h2>
                            <p class="text-sm text-slate-400">에피소드를 클릭하면 상세 타임라인을 볼 수 있습니다.</p>
                        </div>
                        <button onclick="openAddChongModal()" id="add-chong-btn" class="hidden px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition-all">
                            <i class="fa-solid fa-plus mr-1"></i>에피소드 추가
                        </button>
                    </div>
                    <div id="chong-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </div>

                <div id="chong-detail-view" class="space-y-6 hidden">
                    <div class="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                        <div class="flex items-center space-x-4">
                            <button onclick="closeChongDetail()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold rounded-xl transition-all">
                                <i class="fa-solid fa-arrow-left mr-1.5"></i>목록으로
                            </button>
                            <h2 id="chong-detail-title" class="text-lg font-bold text-white">총겜동 상세</h2>
                        </div>
                        <button onclick="openAddChongTimelineModal()" id="add-chong-timeline-btn" class="hidden px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition-all">
                            <i class="fa-solid fa-plus mr-1"></i>타임라인 추가
                        </button>
                    </div>
                    <div id="chong-timelines-container" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-3"></div>
                </div>
            </section>

            <!-- 4. 마크서버 섹션 (사진 2번 스크린샷 2026-10-25 160309.png 스타일 반영) -->
            <section id="section-mc" class="space-y-6 hidden">
                <div id="mc-main-view">
                    <div class="mb-6 flex justify-between items-end">
                        <div>
                            <h2 class="text-xl font-bold text-white mb-1">마크서버 길드 및 기록</h2>
                            <p class="text-sm text-slate-400">길드를 클릭하여 상세 일별 타임라인을 확인할 수 있습니다.</p>
                        </div>
                        <button onclick="openAddMcGuildModal()" id="add-mc-btn" class="hidden px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition-all">
                            <i class="fa-solid fa-plus mr-1"></i>마크 길드 추가
                        </button>
                    </div>
                    <div id="mc-guilds-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </div>

                <div id="mc-detail-view" class="space-y-6 hidden">
                    <div class="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                        <div class="flex items-center space-x-4">
                            <button onclick="closeMcDetail()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold rounded-xl transition-all">
                                <i class="fa-solid fa-arrow-left mr-1.5"></i>목록으로
                            </button>
                            <h2 id="mc-detail-title" class="text-lg font-bold text-white">마크 상세</h2>
                        </div>
                        <button onclick="openAddMcDayModal()" id="add-mc-day-btn" class="hidden px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition-all">
                            <i class="fa-solid fa-plus mr-1"></i>날짜(일차) 추가
                        </button>
                    </div>
                    <div id="mc-categories-container" class="space-y-4"></div>
                </div>
            </section>

        </main>
    </div>

    <!-- 하단 푸터 -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 px-4 sm:px-6 lg:px-8 mt-12">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center text-xs text-slate-500 gap-2">
            <div>본 사이트는 비공식 전적 정리 사이트이므로 일부 누락이나 오류가 있을 수 있습니다.</div>
            <div class="font-semibold text-slate-400">made by 윤슬ツ</div>
        </div>
    </footer>

    <!-- 게임 전적 추가/수정 모달 -->
    <div id="add-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
            <h3 class="text-lg font-bold text-white"><span id="modal-game-title">VALORANT</span> 전적 관리</h3>
            <input type="hidden" id="edit-record-id">
            <div class="space-y-3 text-sm">
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1">연도</label>
                        <input type="text" id="m-year" placeholder="2025" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1">유형</label>
                        <select id="m-type" onchange="handleTypeChange()" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                            <option value="내전">내전</option>
                            <option value="CK">CK</option>
                            <option value="랜드">랜드</option>
                            <option value="자유입력">자유입력</option>
                        </select>
                    </div>
                    <div id="m-type-custom-box" class="hidden">
                        <label class="text-slate-400 block mb-1">직접 입력</label>
                        <input type="text" id="m-type-custom" placeholder="유형 입력" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1">날짜</label>
                        <input type="text" id="m-date" placeholder="2025.11.20" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                    </div>
                </div>
                <div>
                    <label class="text-slate-400 block mb-1">밸런스 (상대팀 정보 등)</label>
                    <input type="text" id="m-balance" placeholder="예: 도현팀 vs 이상호팀" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                </div>
                <div id="m-game-specific-fields" class="space-y-3"></div>
                <div>
                    <label class="text-slate-400 block mb-1">참여 멤버 (여러 줄 입력 가능)</label>
                    <textarea id="m-members" rows="3" placeholder="도현&#10;이상호..." class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5 custom-scrollbar text-xs"></textarea>
                </div>
                <div>
                    <label class="text-slate-400 block mb-1">승패 여부</label>
                    <select id="m-result" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                        <option value="WIN">WIN (승리)</option>
                        <option value="LOSE">LOSE (패배)</option>
                        <option value="NONE">선택 안함</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                <button onclick="closeAddRecordModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl transition-all text-xs">취소</button>
                <button onclick="saveNewRecord()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition-all text-xs">저장하기</button>
            </div>
        </div>
    </div>

    <!-- 스크립트 -->
    <script>
        let mockData = JSON.parse(localStorage.getItem('dohyeon_mockData')) || {
            val: [
                { id: 1, year: "2025", type: "CK", date: "2025.11.20", balance: "도현팀 vs 이상호팀", map: "헤이븐", agent: "제트", acs: "312", kda: "24 / 12 / 5", score: "13 : 9", result: "WIN", members: "도현\n이상호\n뜨삭\n손오봉" },
                { id: 2, year: "2025", type: "내전", date: "2025.11.18", balance: "도현팀 vs 김계란팀", map: "어센트", agent: "소바", acs: "198", kda: "14 / 15 / 11", score: "10 : 13", result: "LOSE", members: "도현\n김계란" }
            ],
            lol: [
                { id: 1, year: "2025", type: "CK", date: "2025.11.19", balance: "도현스쿼드 vs 저라뎃스쿼드", position: "미드", champion: "아칼리", acs: "", kda: "10 / 2 / 6", score: "", result: "WIN", members: "도현\n저라뎃\n박사장" }
            ],
            pubg: [
                { id: 1, year: "2025", type: "내전", date: "2025.11.17", balance: "도현스쿼드 vs 킴성태스쿼드", targetKills: "팀 40킬", memberKills: "30 (40-10)", totalScore: "1위 (65점)", result: "WIN", members: "도현\n킴성태", pubgTeams: ["도현팀 40 (30-10)", "상대팀 25 (20-5)"] }
            ]
        };

        let mwjTeams = JSON.parse(localStorage.getItem('dohyeon_mwjTeams')) || [
            { id: 'team_1', name: '도현팀 (승리 요정들)', logo: 'DH', desc: '최종 성적: 준우승 🥈', period: '2025.11.10 ~ 11.25', seasonTitle: '2025 ALL Season 1', matches: [
                { id: 1, category: '본선 8강', date: '25.11.15 토', matchResult: 'WIN', setNum: '19시 1세트', resultSummary: '2승 1패' }
            ]}
        ];

        let chongEpisodes = JSON.parse(localStorage.getItem('dohyeon_chong')) || [
            { id: 'chong_1', title: '발로란트 레전드 내전', desc: '역대급 레전드 명경기 모음 에피소드', timelines: [
                { time: '14:30', content: '첫 번째 매치 픽밴 시작' },
                { time: '15:10', content: '환상적인 에이스 달성 순간' }
            ]}
        ];

        let mcGuilds = JSON.parse(localStorage.getItem('dohyeon_mc')) || [
            { id: 'mc_1', name: '북해빙궁', serverTag: '코창서버', period: '2024.11.04 ~ 12.10', days: [
                { dayTitle: '1일차', content: '서버 오픈 첫날 자원 채집 및 집터 선정 완료.' },
                { dayTitle: '2일차', content: '철광석 파밍 완료 및 인챈트룸 구축.' }
            ]}
        ];

        let currentGameTab = 'val';
        let currentYearTab = '2025';
        let currentSortOrder = 'desc'; 
        let isAdmin = false;

        let currentSelectedTeamId = null;
        let currentSelectedChongId = null;
        let currentSelectedGuildId = null;

        function saveData() {
            localStorage.setItem('dohyeon_mockData', JSON.stringify(mockData));
            localStorage.setItem('dohyeon_mwjTeams', JSON.stringify(mwjTeams));
            localStorage.setItem('dohyeon_chong', JSON.stringify(chongEpisodes));
            localStorage.setItem('dohyeon_mc', JSON.stringify(mcGuilds));
        }

        function toggleAdminMode() {
            isAdmin = !isAdmin;
            const btn = document.getElementById('admin-mode-btn');
            
            if(isAdmin) {
                btn.className = "px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl border border-emerald-500 transition-all";
                btn.innerHTML = '<i class="fa-solid fa-unlock mr-1"></i>관리자 ON';
            } else {
                btn.className = "px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl border border-slate-700 transition-all";
                btn.innerHTML = '<i class="fa-solid fa-lock mr-1"></i>관리자 OFF';
            }

            renderRecords();
            renderMwjTeams();
            renderChongEpisodes();
            renderMcGuilds();
            if(currentSelectedTeamId) renderMwjMatches(currentSelectedTeamId);
            if(currentSelectedChongId) renderChongTimelines(currentSelectedChongId);
            if(currentSelectedGuildId) renderMcDays(currentSelectedGuildId);
        }

        function switchMainTab(tab) {
            ['history', 'mwj', 'chong', 'mc'].forEach(t => {
                const sec = document.getElementById(`section-${t}`);
                const navBtn = document.getElementById(`nav-btn-${t}`);

        function renderRecords() {
            const listEl = document.getElementById('record-list');
            const yearTabsEl = document.getElementById('history-year-tabs');
            const addRecordBtn = document.getElementById('add-record-btn');
            
            if(addRecordBtn) {
                if(isAdmin) addRecordBtn.classList.remove('hidden');
                else addRecordBtn.classList.add('hidden');
            }

            const data = mockData[currentGameTab] || [];
            const yearsSet = new Set(data.map(item => item.year || '2025'));
            yearsSet.add('2025');
            const years = Array.from(yearsSet).sort().reverse();

            if(!years.includes(currentYearTab)) {
                currentYearTab = years[0];
            }

            yearTabsEl.innerHTML = '';
            years.forEach(y => {
                const isActive = (y === currentYearTab);
                yearTabsEl.innerHTML += `<button onclick="currentYearTab='${y}'; renderRecords();" class="px-3 py-1 rounded-lg text-xs font-bold transition-all whitespace-nowrap ${isActive ? 'bg-indigo-600 text-white shadow' : 'bg-[#080d1a] text-slate-400 hover:text-white border border-slate-800'}">${y}년</button>`;
            });

            const filterType = document.getElementById('type-filter').value;
            const query = document.getElementById('search-input').value.toLowerCase();

            let filtered = data.filter(item => (item.year || '2025') === currentYearTab);

            if(filterType !== 'ALL') {
                filtered = filtered.filter(item => item.type === filterType);
            }

            if(query) {
                filtered = filtered.filter(item => 
                    item.date.toLowerCase().includes(query) || 
                    (item.balance && item.balance.toLowerCase().includes(query)) ||
                    (item.agent && item.agent.toLowerCase().includes(query)) ||
                    (item.champion && item.champion.toLowerCase().includes(query)) ||
                    (item.members && item.members.toLowerCase().includes(query))
                );
            }

            filtered.sort((a, b) => {
                if(currentSortOrder === 'desc') return b.id - a.id;
                return a.id - b.id;
            });

            listEl.innerHTML = '';
            if(filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">등록된 전적이 없습니다. 상단 '기록 추가' 버튼을 이용하세요.</div>`;

            document.getElementById('chong-detail-view').classList.add('hidden');
            document.getElementById('chong-main-view').classList.remove('hidden');
            renderChongEpisodes();
        }

        function renderChongTimelines(epId) {
            const container = document.getElementById('chong-timelines-container');
            const addTimelineBtn = document.getElementById('add-chong-timeline-btn');
            if(addTimelineBtn) {
                if(isAdmin) addTimelineBtn.classList.remove('hidden');
                else addTimelineBtn.classList.add('hidden');
            }

            const ep = chongEpisodes.find(x => x.id === epId);
            if(!ep || !ep.timelines || ep.timelines.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">등록된 타임라인이 없습니다.</div>`;
                return;
            }

            container.innerHTML = '';
            ep.timelines.forEach(t => {
                container.innerHTML += `<div class="text-sm text-slate-200 border-b border-slate-800 pb-2 flex items-center gap-3"><strong class="text-purple-400 font-mono text-xs">${t.time}</strong> <span>${t.content}</span></div>`;
            });
        }

        // 모달 관리
        function openAddRecordModal(editId = null) {
            document.getElementById('modal-game-title').innerText = currentGameTab.toUpperCase();
            document.getElementById('edit-record-id').value = '';
            document.getElementById('m-year').value = currentYearTab || '2025';
            document.getElementById('m-type').value = 'CK';
            document.getElementById('m-type-custom').value = '';
            document.getElementById('m-type-custom-box').classList.add('hidden');
            document.getElementById('m-date').value = '';
            document.getElementById('m-balance').value = '';
            document.getElementById('m-members').value = '';
            document.getElementById('m-result').value = 'WIN';

            const specificFields = document.getElementById('m-game-specific-fields');
            if(currentGameTab === 'val') {
                specificFields.innerHTML = `
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="text-slate-400 block mb-1">맵</label><input type="text" id="m-map" placeholder="헤이븐" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                        <div><label class="text-slate-400 block mb-1">요원</label><input type="text" id="m-agent" placeholder="제트" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div><label class="text-slate-400 block mb-1">ACS</label><input type="text" id="m-acs" placeholder="312" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                        <div><label class="text-slate-400 block mb-1">KDA</label><input type="text" id="m-kda" placeholder="24 / 12 / 5" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                        <div><label class="text-slate-400 block mb-1">스코어</label><input type="text" id="m-score" placeholder="13 : 9" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                    </div>
                `;
            } else if(currentGameTab === 'lol') {
                specificFields.innerHTML = `
                    <div class="grid grid-cols-3 gap-3">
                        <div><label class="text-slate-400 block mb-1">포지션</label><input type="text" id="m-pos" placeholder="미드" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                        <div><label class="text-slate-400 block mb-1">챔피언</label><input type="text" id="m-champ" placeholder="아칼리" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                        <div><label class="text-slate-400 block mb-1">KDA</label><input type="text" id="m-lol-kda" placeholder="10 / 2 / 6" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                    </div>
                `;
            } else if(currentGameTab === 'pubg') {
                specificFields.innerHTML = `
                    <div class="grid grid-cols-3 gap-3">
                        <div><label class="text-slate-400 block mb-1">[목표킬]</label><input type="text" id="m-target" placeholder="팀 40킬" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                        <div><label class="text-slate-400 block mb-1">도현순수킬</label><input type="text" id="m-mkills" placeholder="30 (40-10)" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                        <div><label class="text-slate-400 block mb-1">순위/점수</label><input type="text" id="m-score-pubg" placeholder="1위 (65점)" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1">순수킬 팀별 상세 2단 표</label>
                        <textarea id="m-pubg-teams" rows="2" placeholder="도현팀 40 (30-10)&#10;상대팀 25 (20-5)" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5 text-xs custom-scrollbar"></textarea>
                    </div>
                `;
            }

            if(editId) {
                const item = (mockData[currentGameTab] || []).find(x => x.id === editId);
                if(item) {
                    document.getElementById('edit-record-id').value = item.id;
                    document.getElementById('m-year').value = item.year || '2025';
                    
                    const selectEl = document.getElementById('m-type');
                    const standardTypes = ['내전', 'CK', '랜드'];
                    if(standardTypes.includes(item.type)) {
                        selectEl.value = item.type;
                    } else {
                        selectEl.value = '자유입력';
                        document.getElementById('m-type-custom-box').classList.remove('hidden');
                        document.getElementById('m-type-custom').value = item.type;
                    }

                    document.getElementById('m-date').value = item.date || '';
                    document.getElementById('m-balance').value = item.balance || '';
                    document.getElementById('m-members').value = item.members || '';
                    document.getElementById('m-result').value = item.result || 'WIN';

                    if(currentGameTab === 'val') {
                        document.getElementById('m-map').value = item.map || '';
                        document.getElementById('m-agent').value = item.agent || '';
                        document.getElementById('m-acs').value = item.acs || '';
                        document.getElementById('m-kda').value = item.kda || '';
                        document.getElementById('m-score').value = item.score || '';
                    } else if(currentGameTab === 'lol') {
                        document.getElementById('m-pos').value = item.position || '';
                        document.getElementById('m-champ').value = item.champion || '';
                        document.getElementById('m-lol-kda').value = item.kda || '';
                    } else if(currentGameTab === 'pubg') {
                        document.getElementById('m-target').value = item.targetKills || '';
                        document.getElementById('m-mkills').value = item.memberKills || '';
                        document.getElementById('m-score-pubg').value = item.totalScore || '';
                        if(item.pubgTeams) {
                            document.getElementById('m-pubg-teams').value = item.pubgTeams.join('\n');
                        }
                    }
                }
            }

            document.getElementById('add-modal').classList.remove('hidden');
        }

        function closeAddRecordModal() { document.getElementById('add-modal').classList.add('hidden'); }
        function editGameRecord(id) { openAddRecordModal(id); }

        function saveNewRecord() {
            const editId = document.getElementById('edit-record-id').value;
            const year = document.getElementById('m-year').value || '2025';
            
            let type = document.getElementById('m-type').value;
            if(type === '자유입력') {
                type = document.getElementById('m-type-custom').value || '자유입력';
            }

            const date = document.getElementById('m-date').value || '2025.11.20';
            const balance = document.getElementById('m-balance').value || '';
            const members = document.getElementById('m-members').value || '';
            const result = document.getElementById('m-result').value;

            let newItem = { year, type, date, balance, members, result };

            if(currentGameTab === 'val') {
                newItem.map = document.getElementById('m-map').value || '';
                newItem.agent = document.getElementById('m-agent').value || '';
                newItem.acs = document.getElementById('m-acs').value || '';
                newItem.kda = document.getElementById('m-kda').value || '';
                newItem.score = document.getElementById('m-score').value || '';
            } else if(currentGameTab === 'lol') {
                newItem.position = document.getElementById('m-pos').value || '';
                newItem.champion = document.getElementById('m-champ').value || '';
                newItem.kda = document.getElementById('m-lol-kda').value || '';
            } else if(currentGameTab === 'pubg') {
                newItem.targetKills = document.getElementById('m-target').value || '';
                newItem.memberKills = document.getElementById('m-mkills').value || '';
                newItem.totalScore = document.getElementById('m-score-pubg').value || '';
                const rawPubgTeams = document.getElementById('m-pubg-teams').value;
                newItem.pubgTeams = rawPubgTeams ? rawPubgTeams.split('\n').filter(x => x.trim() !== '') : [];
            }

            if(!mockData[currentGameTab]) mockData[currentGameTab] = [];

            if(editId) {
                const index = mockData[currentGameTab].findIndex(x => x.id === Number(editId));
                if(index !== -1) {
                    newItem.id = Number(editId);
                    mockData[currentGameTab][index] = newItem;
                }
            } else {
                newItem.id = Date.now();
                mockData[currentGameTab].unshift(newItem);
            }

            saveData();
            currentYearTab = year;
            renderRecords();
            closeAddRecordModal();
        }

        function deleteGameRecord(id) {
            mockData[currentGameTab] = mockData[currentGameTab].filter(x => x.id !== id);
            saveData();
            renderRecords();
        }

        function openAddTeamModal() {
            const name = prompt("멸망전 팀 이름을 입력하세요:");
            if(!name) return;
            mwjTeams.push({ id: 'team_' + Date.now(), name, logo: name.substring(0,2), desc: '준우승 🥈', period: '2025', seasonTitle: '2025 시즌', matches: [] });
            saveData();
            renderMwjTeams();
        }

        function deleteMwjTeam(id) {
            mwjTeams = mwjTeams.filter(x => x.id !== id);
            saveData();
            renderMwjTeams();
        }

        function openAddMatchModal() {
            if(!currentSelectedTeamId) return;
            const category = prompt("경기 카테고리 (예: 본선 8강):", "본선 8강");
            if(!category) return;
            const team = mwjTeams.find(x => x.id === currentSelectedTeamId);
            if(team) {
                team.matches.push({ id: Date.now(), category, date: '25.11.15 토', matchResult: 'WIN', setNum: '1세트', resultSummary: '승리' });
                saveData();
                renderMwjMatches(currentSelectedTeamId);
            }
        }

        function openAddChongModal() {
            const title = prompt("총겜동 에피소드 제목을 입력하세요:");
            if(!title) return;
            const desc = prompt("설명을 입력하세요:", "명경기 모음");
            chongEpisodes.push({ id: 'chong_' + Date.now(), title, desc, timelines: [] });
            saveData();
            renderChongEpisodes();
        }

        function deleteChongEpisode(id) {
            chongEpisodes = chongEpisodes.filter(x => x.id !== id);
            saveData();
            renderChongEpisodes();
        }

        function openAddChongTimelineModal() {
            if(!currentSelectedChongId) return;
            const time = prompt("시간대 (예: 14:30):", "14:30");
            const content = prompt("타임라인 내용을 입력하세요:");
            if(!content) return;
            const ep = chongEpisodes.find(x => x.id === currentSelectedChongId);
            if(ep) {
                ep.timelines.push({ time, content });
                saveData();
                renderChongTimelines(currentSelectedChongId);
            }
        }

        function openAddMcGuildModal() {
            const name = prompt("마크 길드 이름을 입력하세요:");
            if(!name) return;
            const serverTag = prompt("서버 이름을 입력하세요 (예: 코창서버):", "코창서버");
            const period = prompt("기간을 입력하세요 (예: 2024.11.04 ~ 12.10):", "2024.11.04 ~ 12.10");
            mcGuilds.push({ id: 'mc_' + Date.now(), name, serverTag, period, days: [] });
            saveData();
            renderMcGuilds();
        }

        function deleteMcGuild(id) {
            mcGuilds = mcGuilds.filter(x => x.id !== id);
            saveData();
            renderMcGuilds();
        }

        function openAddMcDayModal() {
            if(!currentSelectedGuildId) return;
            const dayTitle = prompt("일차 입력 (예: 1일차):", "1일차");
            const content = prompt("해당 일차 기록 내용을 입력하세요:");
            if(!content) return;
            const guild = mcGuilds.find(x => x.id === currentSelectedGuildId);
            if(guild) {
                guild.days.push({ dayTitle, content });
                saveData();
                renderMcDays(currentSelectedGuildId);
            }
        }

        window.onload = () => { switchMainTab('history'); };
    </script>
</body>
</html>
