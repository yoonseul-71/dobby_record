<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DOHYEON ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --page: #f1f3f6; --page-fg: #12161c; --page-muted: #566170;
  --panel: #ffffff; --surface: #ffffff; --line: #dde2ea;
  --accent: #2a56d6; --accent-ink: #ffffff; --soft: #e4ebfc; --soft-ink: #1f3fa6;
  --win: #16794c; --win-bg: #dff2e6; --loss: #b3282d; --loss-bg: #fae3e3; --neutral-bg: #e6e9ee;
  --pink: #d65a9e; --pink-bg: #fbe3f0; --pink-ink: #7d1f55;
  --yellow: #d9a200; --yellow-bg: #fdf0b8; --yellow-ink: #5a4400;
  --sky: #4a9be8; --sky-bg: #dcecfd; --sky-ink: #0f4a86;
  --violet: #9b6fe0; --violet-bg: #eadfff; --violet-ink: #4a2a8c;
  --font-display: "Barlow Condensed", "Noto Sans KR", sans-serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--page-fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; padding: 28px 16px 56px; }

.wrap { max-width: 1090px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
a { color: inherit; text-decoration: none; }

header.top { display: flex; justify-content: space-between; align-items: flex-start; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: 1; letter-spacing: -0.01em; text-transform: uppercase; }
h1 em { font-family: var(--font-display); font-style: italic; font-weight: 800; }

nav.bar { display: flex; align-items: flex-end; gap: 6px; border-bottom: 1px solid var(--line); padding-left: 10px; }
nav.bar a {
  position: relative; display: inline-flex; align-items: center; padding: 8px 22px;
  border-radius: 8px 8px 0 0; font-weight: 700; font-size: 15px;
  background: var(--note); color: var(--note-ink); border: 1px solid var(--note-edge); border-bottom: 0;
  box-shadow: 0 -2px 5px rgba(0,0,0,0.05); transform-origin: 50% 100%; transform: rotate(var(--tilt, 0deg)) translateY(2px);
}
nav.bar a::before {
  content: ""; position: absolute; top: -5px; left: 50%; width: 26px; height: 8px; margin-left: -13px;
  background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(0,0,0,0.08); border-radius: 2px; transform: rotate(-3deg);
}
nav.bar a[data-cat="record"] { --note: var(--pink-bg); --note-ink: var(--pink-ink); --note-edge: var(--pink); --tilt: -1deg; }
nav.bar a[data-cat="scrim"] { --note: var(--yellow-bg); --note-ink: var(--yellow-ink); --note-edge: var(--yellow); --tilt: 1deg; }
nav.bar a[data-cat="mc"] { --note: var(--sky-bg); --note-ink: var(--sky-ink); --note-edge: var(--sky); --tilt: -0.8deg; }
nav.bar a[data-cat="chong"] { --note: var(--violet-bg); --note-ink: var(--violet-ink); --note-edge: var(--violet); --tilt: 1.2deg; }
nav.bar a[aria-current="page"] {
  z-index: 1; transform: none; padding-top: 11px; padding-bottom: 9px; margin-bottom: -1px;
  border-color: var(--line); border-bottom: 1px solid var(--panel); background: var(--panel); color: var(--page-fg);
}

.panel { background: var(--panel); border-radius: 0 0 12px 12px; padding: 24px; border: 1px solid var(--line); border-top: 0; }
.block { display: flex; flex-direction: column; gap: 20px; }
.subnav { display: flex; gap: 8px; flex-wrap: wrap; }
.subnav a { padding: 5px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--page-fg); font-size: 13px; cursor: pointer; }
.subnav a[aria-current="page"] { background: var(--soft); border-color: var(--accent); color: var(--soft-ink); font-weight: 700; }
.subnav .n { font-family: var(--font-mono); opacity: 0.7; margin-left: 4px; }

h2 { margin: 0; font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

.stats { display: flex; gap: 32px; align-items: flex-end; }
.stat .k { font-size: 12px; color: var(--page-muted); display: block; }
.stat .v { font-family: var(--font-mono); font-size: 22px; font-weight: 700; }

.toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.filters { display: flex; gap: 6px; align-items: center; }
.chip { font: inherit; font-size: 13px; padding: 4px 14px; border-radius: 999px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); color: var(--page-fg); }
.chip[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--soft-ink); font-weight: 700; }

.month { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); margin-bottom: 16px; }
.month summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: #eef3fc; color: #1a365d; font-weight: bold; }
.month summary::-webkit-details-marker { display: none; }
.month .m-title { font-family: var(--font-mono); font-size: 16px; color: #2b6cb0; }
.month .m-meta { font-size: 13px; opacity: 0.8; font-weight: normal; }
.month .seg { margin-left: 10px; display: inline-flex; border: 1px solid #cbd5e0; border-radius: 999px; overflow: hidden; }
.month .seg button { font: inherit; font-size: 11px; padding: 2px 10px; border: 0; background: transparent; cursor: pointer; }
.month .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: bold; }
.month .rate-box { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.month .bar { width: 100px; height: 8px; border-radius: 4px; background: var(--loss-bg); overflow: hidden; }
.month .bar b { display: block; height: 100%; background: var(--win); }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 700px; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--page-muted); font-weight: 500; }
tbody tr:hover { background: rgba(0,0,0,0.02); }
td.mono { font-family: var(--font-mono); }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.pill.w { background: var(--win-bg); color: var(--win); }
.pill.l { background: var(--loss-bg); color: var(--loss); }

/* 카드 공통 */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 15px; }
.card { display: flex; flex-direction: column; justify-content: space-between; min-height: 145px; padding: 20px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; text-decoration: none; color: var(--page-fg); transition: border-color 0.15s, transform 0.15s; position: relative; overflow: hidden; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); }

/* 마크서버 카드 스타일 */
.card-mc .server-name { font-size: 13px; font-weight: 500; color: var(--page-muted); }
.card-mc .guild-name { font-size: 18px; font-weight: 800; color: #000; margin-top: 2px; }

/* 총겜동 카드 */
.card-chong .ep-no { font-family: var(--font-display); font-weight: 800; font-size: 32px; color: var(--violet); line-height: 1; }
.card-chong .ep-title { font-size: 18px; font-weight: 700; color: #000; margin-top: 4px; }

/* 롤 멸망전 카드 */
.card-scrim .scrim-no { font-family: var(--font-display); font-weight: 800; font-size: 32px; color: #d99b00; line-height: 1; }
.card-scrim .scrim-title { font-size: 18px; font-weight: 700; color: #000; margin-top: 4px; }
.card-badge { position: absolute; top: 0; right: 0; background: var(--yellow-bg); color: var(--yellow-ink); font-size: 11px; font-weight: bold; padding: 4px 10px; border-bottom-left-radius: 8px; border: 1px solid var(--yellow); border-top: 0; border-right: 0; }

.card-more { align-self: flex-end; font-size: 12px; color: var(--page-muted); font-weight: 500; margin-top: auto; padding-top: 12px; }
.card-admin-btns { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; z-index: 2; }

/* 배그 킬내기 표 스타일 */
.kill-summary-box { border-left: 4px solid #12161c; padding-left: 12px; margin-bottom: 16px; }
.kill-summary-box .target-kill { font-size: 15px; font-weight: bold; color: var(--page-fg); }
.kill-summary-box .score-line { font-size: 20px; font-weight: 800; margin-top: 2px; }
.pubg-card-table { width: 100%; border-collapse: collapse; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 10px; }
.pubg-card-table th { background: #f2f0eb; font-weight: bold; padding: 10px; border: 1px solid #e0ddd7; color: #333; }
.pubg-card-table td { padding: 10px; border: 1px solid #e0ddd7; text-align: center; font-size: 13px; background: #fff; }
.pubg-card-table tr.team-row-2 th { background: #e8f0fe; color: #1a73e8; }

/* 모달 */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
.light-modal { background: var(--panel); color: var(--page-fg); border-radius: 12px; width: 100%; max-width: 580px; max-height: 90vh; overflow-y: auto; padding: 24px; border: 1px solid var(--line); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
.light-modal h3 { margin-top: 0; font-size: 18px; border-bottom: 1px solid var(--line); padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.light-modal .close-btn { cursor: pointer; border: 0; background: transparent; font-size: 20px; }
.light-modal label { display: block; font-size: 12px; font-weight: bold; color: var(--page-muted); margin-bottom: 6px; }
.light-modal input, .light-modal select, .light-modal textarea { width: 100%; font: inherit; padding: 10px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface); color: var(--page-fg); margin-bottom: 14px; }
.light-modal .btn-group { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
.light-modal .btn-save { background: var(--accent); color: var(--accent-ink); border: 0; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
.light-modal .btn-cancel { background: var(--neutral-bg); color: var(--page-fg); border: 0; padding: 10px 16px; border-radius: 6px; cursor: pointer; }

.detail-sec { margin-bottom: 16px; }
.detail-sec label { font-size: 12px; color: var(--page-muted); font-weight: bold; display: block; margin-bottom: 6px; }
.detail-sec .val { font-size: 14px; white-space: pre-wrap; line-height: 1.6; }

/* 타임라인 스타일 */
.ep-detail-wrap { display: flex; flex-direction: column; gap: 20px; margin-top: 15px; }
.ep-box { border: 1px solid var(--line); border-radius: 12px; padding: 20px; background: var(--surface); }
.ep-box-title { font-size: 15px; font-weight: bold; color: var(--page-fg); margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.timeline-clean { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.timeline-clean li { font-size: 14px; display: flex; align-items: center; gap: 6px; }
.timeline-clean a { color: var(--accent); text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
.timeline-clean a:hover { text-decoration: underline; }

.back-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--page-muted); margin-bottom: 10px; cursor: pointer; text-decoration: none; }
.day-tabs { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
.day-tab-btn { padding: 6px 14px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); font-weight: bold; cursor: pointer; font-size: 13px; }
.day-tab-btn[aria-selected="true"] { background: var(--sky-bg); border-color: var(--sky); color: var(--sky-ink); }

#admin-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #18181b; color: #fff; padding: 10px 24px; display: none; justify-content: space-between; align-items: center; z-index: 999; font-weight: bold; }
#admin-bar button { background: #ef4444; color: #fff; border: 0; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
.btn-btn { font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 6px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); }
.btn-accent { background: var(--accent); color: #fff; border: 0; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>DOHYEON <em>ARCHIVE</em></h1>
  </header>

  <div class="sheet">
    <nav class="bar" id="mainNav">
      <a href="#record" data-cat="record">전적</a>
      <a href="#scrim" data-cat="scrim">롤 멸망전</a>
      <a href="#mc" data-cat="mc">마크서버</a>
      <a href="#chong" data-cat="chong">총겜동</a>
    </nav>
    <div class="panel">
      <main id="view"></main>
    </div>
  </div>
</div>

<div id="admin-bar">
  <span>⚡ 관리자 모드 활성화 (Alt+A)</span>
  <button onclick="logoutAdmin()">관리자 종료</button>
</div>

<!-- 전적 상세 정보 모달 -->
<div class="modal-overlay" id="detailModal">
  <div class="light-modal">
    <h3><span id="mTitle">전적 상세</span><button class="close-btn" onclick="closeModal('detailModal')">✕</button></h3>
    <div id="modalContent"></div>
  </div>
</div>

<!-- 관리자 편집 폼 모달 -->
<div class="modal-overlay" id="adminFormModal">
  <div class="light-modal">
    <h3><span id="adminFormTitle">항목 편집</span><button class="close-btn" onclick="closeModal('adminFormModal')">✕</button></h3>
    <form id="adminForm" onsubmit="handleAdminFormSubmit(event)">
      <input type="hidden" id="afTarget">
      <input type="hidden" id="afIdx" value="-1">
      <div id="afFields"></div>
      <div class="btn-group">
        <button type="button" class="btn-cancel" onclick="closeModal('adminFormModal')">취소</button>
        <button type="submit" class="btn-save">저장하기</button>
      </div>
    </form>
  </div>
</div>

<script>
const GAME_MODES = {
  "발로란트": ["전체", "내전", "랜드", "CK"],
  "롤": ["전체", "랜드", "CK"],
  "배그": ["전체", "킬내기", "랜드", "공장"]
};

const DEFAULT_SETS = [
  {
    date: "2026-05-23", game: "발로란트", mode: "내전", balance: "상대A", set: "1세트", result: "W",
    allMembersText: "도현 (제트)\n멤버1 (소바)\n멤버2 (케이오)\n멤버3 (페이드)\n멤버4 (킬조이)"
  },
  {
    date: "2026-09-12", game: "배그", mode: "킬내기", balance: "걸뽀팀", set: "1세트", result: "L",
    targetKillText: "[170킬]", scoreText: "도현팀 133 : 171 걸뽀팀",
    pubgTableData: [
      { teamName: "도현팀", members: [ {name:"블랙워크", val:"54 (84-30)"}, {name:"박나닝", val:"37 (64-27)"}, {name:"나는상윤", val:"5 (32-27)"}, {name:"도현", val:"-8 (25-33)"} ] },
      { teamName: "걸뽀팀", members: [ {name:"아칸", val:"64 (91-27)"}, {name:"수피", val:"70 (94-24)"}, {name:"킴성태", val:"1 (34-33)"}, {name:"걸뽀", val:"1 (31-30)"} ] }
    ]
  }
];

const DEFAULT_MC = [
  { 
    id: "mc-1", serverName: "코창서버", guildName: "북해빙궁", 
    days: [
      { 
        dayTitle: "1일차", dateStr: "2026-05-20",
        sections: [
          { title: "모험 및 탐색", timelines: [{text: "서버 첫 입장 및 스폰 확인", url: "https://youtube.com"}, {text: "마을 정찰", url: ""}] },
          { title: "광질 및 파밍", timelines: [{text: "철 광석 채굴", url: "https://youtube.com"}] }
        ] 
      },
      { 
        dayTitle: "2일차", dateStr: "2026-05-21",
        sections: [
          { title: "건축 및 기지 구축", timelines: [{text: "임시 거처 완성", url: ""}] }
        ] 
      }
    ] 
  }
];

const DEFAULT_CHONG = [
  { ep: 0, title: "FPS 동아리: 총겜동", desc: "총겜동의 시작을 알린 첫 방송.", timeline: [{text: "오프닝 방송 시작", url: "https://youtube.com"}, {text: "동아리 소개", url: ""}] },
  { ep: 1, title: "배그 서열정리 킬내기", desc: "첫 번째 공식 정기전 킬내기 매치.", timeline: [{text: "룰 설명", url: "https://youtube.com"}, {text: "본 경기 시작", url: ""}] }
];

const DEFAULT_SCRIM = [
  { id: "do2", no: "도이온2", badge: "2025 시즌2 멸망전", title: "도이온2 멸망전", desc: "멸망전 전적 기록", data: [{ date: "2025-11-15", type: "스크림", title: "스크림 1일차", result: "1승 2패", note: "라인전 점검" }] }
];

function loadFreshData() {
  localStorage.setItem("dohyeon_mc", JSON.stringify(DEFAULT_MC));
  localStorage.setItem("dohyeon_chong", JSON.stringify(DEFAULT_CHONG));
  localStorage.setItem("dohyeon_scrim", JSON.stringify(DEFAULT_SCRIM));
  if (!localStorage.getItem("dohyeon_sets")) {
    localStorage.setItem("dohyeon_sets", JSON.stringify(DEFAULT_SETS));
  }
}
loadFreshData();

let MC_SERVERS = JSON.parse(localStorage.getItem("dohyeon_mc"));
let CHONG_EPS = JSON.parse(localStorage.getItem("dohyeon_chong"));
let SCRIM_CARDS = JSON.parse(localStorage.getItem("dohyeon_scrim"));
let setsData = JSON.parse(localStorage.getItem("dohyeon_sets"));

function saveData() {
  localStorage.setItem("dohyeon_sets", JSON.stringify(setsData));
  localStorage.setItem("dohyeon_mc", JSON.stringify(MC_SERVERS));
  localStorage.setItem("dohyeon_chong", JSON.stringify(CHONG_EPS));
  localStorage.setItem("dohyeon_scrim", JSON.stringify(SCRIM_CARDS));
}

let isAdmin = false;
let S = { game: "발로란트", mode: "전체", monthOrder: {} };

window.addEventListener("keydown", e => {
  if (e.altKey && e.code === "KeyA") {
    e.preventDefault();
    const pw = prompt("관리자 비밀코드를 입력하세요:");
    if (pw === "1520711") {
      isAdmin = true;
      document.getElementById("admin-bar").style.display = "flex";
      alert("관리자 모드가 활성화되었습니다!");
      render();
    } else if (pw !== null) alert("비밀코드가 올바르지 않습니다.");
  }
});

function logoutAdmin() {
  isAdmin = false;
  document.getElementById("admin-bar").style.display = "none";
  render();
}

function closeModal(id) { document.getElementById(id).style.display = "none"; }

function openDetail(idx) {
  const r = setsData[idx];
  let html = "";
  if (r.game === "배그" && r.pubgTableData) {
    html += `
      <div class="kill-summary-box">
        <div class="target-kill">${r.targetKillText || ''}</div>
        <div class="score-line">${r.scoreText || ''}</div>
      </div>
      <table class="pubg-card-table">
        <tbody>
          ${r.pubgTableData.map((t, tIdx) => `
            <tr class="${tIdx === 1 ? 'team-row-2' : ''}">
              ${t.members.map(m => `<th>${m.name}</th>`).join('')}
            </tr>
            <tr>
              ${t.members.map(m => `<td>${m.val}</td>`).join('')}
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  }
  if (r.allMembersText) {
    html += `
      <div class="detail-sec" style="margin-top:16px;">
        <label>👥 참여 멤버 상세 목록</label>
        <div class="val">${r.allMembersText}</div>
      </div>`;
  }
  document.getElementById("mTitle").textContent = `${r.date} ${r.game} (${r.set}) 멤버 상세`;
  document.getElementById("modalContent").innerHTML = html || '<div style="padding:20px;text-align:center;">등록된 멤버 정보가 없습니다.</div>';
  document.getElementById("detailModal").style.display = "flex";
}

function openAdminModal(target, idx = -1) {
  document.getElementById("afTarget").value = target;
  document.getElementById("afIdx").value = idx;
  const container = document.getElementById("afFields");
  container.innerHTML = "";

  if (target === "record") {
    const r = idx >= 0 ? setsData[idx] : {};
    document.getElementById("adminFormTitle").textContent = idx >= 0 ? "전적 수정" : "새 전적 추가";
    container.innerHTML = `
      <label>날짜 (YYYY-MM-DD)</label><input type="text" id="afDate" value="${r.date||''}" required>
      <label>게임</label>
      <select id="afGame">
        <option value="발로란트" ${r.game==='발로란트'?'selected':''}>발로란트</option>
        <option value="롤" ${r.game==='롤'?'selected':''}>롤</option>
        <option value="배그" ${r.game==='배그'?'selected':''}>배그</option>
      </select>
      <label>종류</label><input type="text" id="afMode" value="${r.mode||'내전'}">
      <label>밸런스</label><input type="text" id="afBalance" value="${r.balance||''}">
      <label>세트</label><input type="text" id="afSet" value="${r.set||'1세트'}">
      <label>결과 (W/L)</label><select id="afResult"><option value="W" ${r.result==='W'?'selected':''}>승</option><option value="L" ${r.result==='L'?'selected':''}>패</option></select>
      <label>참여 멤버 (엔터 세로 줄바꿈 작성)</label>
      <textarea id="afAllMembers" rows="4">${r.allMembersText||''}</textarea>
    `;
  } else if (target === "chong") {
    const e = idx >= 0 ? CHONG_EPS[idx] : {};
    document.getElementById("adminFormTitle").textContent = idx >= 0 ? "총겜동 에피소드 수정" : "새 총겜동 에피소드 추가";
    container.innerHTML = `
      <label>에피소드 번호 (숫자)</label><input type="number" id="afEpNo" value="${e.ep??CHONG_EPS.length}">
      <label>에피소드 제목</label><input type="text" id="afEpTitle" value="${e.title||''}" required>
      <label>상세 설명</label><textarea id="afEpDesc" rows="3">${e.desc||''}</textarea>
      <label>타임라인 항목들 (형식: 내용 | 링크주소, 줄바꿈으로 작성)</label>
      <textarea id="afChongTimeline" rows="4">${(e.timeline||[]).map(t => t.url ? `${t.text} | ${t.url}` : t.text).join('\n')}</textarea>
    `;
  } else if (target === "mc") {
    const m = idx >= 0 ? MC_SERVERS[idx] : {};
    document.getElementById("adminFormTitle").textContent = idx >= 0 ? "마크서버 수정" : "새 마크서버 추가";
    container.innerHTML = `
      <label>서버명 (상단 작은 글씨)</label><input type="text" id="afMcServer" value="${m.serverName||''}" required>
      <label>길드명 / 메인타이틀 (큰 글씨)</label><input type="text" id="afMcGuild" value="${m.guildName||''}" required>
    `;
  } else if (target === "mc_day") {
    const m = MC_SERVERS[idx];
    document.getElementById("adminFormTitle").textContent = "마크서버 일자(날짜) 추가/편집";
    container.innerHTML = `
      <label>일자 타이틀 (예: 1일차)</label><input type="text" id="afMcDayTitle" value="1일차" required>
      <label>상세 날짜 (예: 2026-05-23)</label><input type="text" id="afMcDayDate" value="2026-05-23" required>
    `;
  } else if (target === "scrim") {
    const s = idx >= 0 ? SCRIM_CARDS[idx] : {};
    document.getElementById("adminFormTitle").textContent = idx >= 0 ? "롤 멸망전 카드 수정" : "새 롤 멸망전 카드 추가";
    container.innerHTML = `
      <label>팀명 / 타이틀 (노란색 글씨)</label><input type="text" id="afScrimNo" value="${s.no||''}" required>
      <label>우측 상단 북마크 시즌 설명</label><input type="text" id="afScrimBadge" value="${s.badge||''}" required>
      <label>전체 타이틀</label><input type="text" id="afScrimTitle" value="${s.title||''}" required>
      <label>설명</label><textarea id="afScrimDesc" rows="2">${s.desc||''}</textarea>
    `;
  }

  document.getElementById("adminFormModal").style.display = "flex";
}

function handleAdminFormSubmit(e) {
  e.preventDefault();
  const target = document.getElementById("afTarget").value;
  const idx = parseInt(document.getElementById("afIdx").value);

  if (target === "record") {
    const item = {
      date: document.getElementById("afDate").value,
      game: document.getElementById("afGame").value,
      mode: document.getElementById("afMode").value,
      balance: document.getElementById("afBalance").value,
      set: document.getElementById("afSet").value,
      result: document.getElementById("afResult").value,
      allMembersText: document.getElementById("afAllMembers").value
    };
    if (idx >= 0) setsData[idx] = { ...setsData[idx], ...item };
    else setsData.push(item);
  } else if (target === "chong") {
    const rawLines = document.getElementById("afChongTimeline").value.split("\n");
    const timelineArr = rawLines.map(line => {
      const parts = line.split("|");
      return { text: parts[0].trim(), url: parts[1] ? parts[1].trim() : "" };
    }).filter(t => t.text);

    const item = {
      ep: parseInt(document.getElementById("afEpNo").value),
      title: document.getElementById("afEpTitle").value,
      desc: document.getElementById("afEpDesc").value,
      timeline: timelineArr.length ? timelineArr : [{text: "오프닝 방송", url: ""}]
    };
    if (idx >= 0) CHONG_EPS[idx] = { ...CHONG_EPS[idx], ...item };
    else CHONG_EPS.push(item);
  } else if (target === "mc") {
    const item = {
      id: "mc-" + Date.now(),
      serverName: document.getElementById("afMcServer").value,
      guildName: document.getElementById("afMcGuild").value,
      days: [{ dayTitle: "1일차", dateStr: "2026-05-20", sections: [{ title: "모험", timelines: [{text: "입장", url: ""}] }] }]
    };
    if (idx >= 0) MC_SERVERS[idx] = { ...MC_SERVERS[idx], serverName: item.serverName, guildName: item.guildName };
    else MC_SERVERS.push(item);
  } else if (target === "mc_day") {
    const srv = MC_SERVERS[idx];
    srv.days.push({
      dayTitle: document.getElementById("afMcDayTitle").value,
      dateStr: document.getElementById("afMcDayDate").value,
      sections: [{ title: "탐색", timelines: [{text: "시작", url: ""}] }]
    });
  } else if (target === "scrim") {
    const item = {
      id: "scrim-" + Date.now(),
      no: document.getElementById("afScrimNo").value,
      badge: document.getElementById("afScrimBadge").value,
      title: document.getElementById("afScrimTitle").value,
      desc: document.getElementById("afScrimDesc").value,
      data: [{ date: "2025-11-15", type: "스크림", title: "첫 연습매치", result: "1승", note: "좋음" }]
    };
    if (idx >= 0) SCRIM_CARDS[idx] = { ...SCRIM_CARDS[idx], no: item.no, badge: item.badge, title: item.title, desc: item.desc };
    else SCRIM_CARDS.push(item);
  }

  saveData();
  closeModal("adminFormModal");
  render();
}

function deleteItem(target, idx, subIdx = -1) {
  if (!confirm("정말 이 항목을 삭제하시겠습니까?")) return;
  if (target === "record") setsData.splice(idx, 1);
  else if (target === "chong") CHONG_EPS.splice(idx, 1);
  else if (target === "mc") MC_SERVERS.splice(idx, 1);
  else if (target === "mc_day") {
    MC_SERVERS[idx].days.splice(subIdx, 1);
  }
  else if (target === "scrim") SCRIM_CARDS.splice(idx, 1);
  saveData();
  render();
}

function renderRecords() {
  const games = ["발로란트", "롤", "배그"];
  const currentModes = GAME_MODES[S.game] || ["전체"];

  let rows = setsData.filter(r => r.game === S.game);
  if (S.mode !== "전체") rows = rows.filter(r => r.mode === S.mode);

  const total = rows.length;
  const winCount = rows.filter(r => r.result === "W").length;
  const lossCount = total - winCount;
  const winRate = total ? Math.round((winCount / total) * 100) : 0;
  const allGameRows = setsData.filter(r => r.game === S.game);

  const subnavHtml = currentModes.map(m => {
    const count = m === "전체" ? allGameRows.length : allGameRows.filter(r => r.mode === m).length;
    return `<a onclick="setMode('${m}')" ${S.mode === m ? 'aria-current="page"' : ''}>${m} <span class="n">${count}</span></a>`;
  }).join("");

  const groups = new Map();
  rows.forEach(r => {
    const k = r.date.slice(0, 7);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  });

  const monthsHtml = [...groups.entries()].map(([k, list]) => {
    const desc = S.monthOrder[k] === "desc";
    const sorted = [...list].sort((a, b) => desc ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));
    const mWin = sorted.filter(r => r.result === "W").length;
    const mRate = Math.round((mWin / sorted.length) * 100);

    const trs = sorted.map(r => {
      const realIdx = setsData.indexOf(r);
      return `
        <tr>
          <td class="mono">${r.date.slice(5).replace('-', '.')} ${getWd(r.date)}</td>
          <td>${r.mode}</td>
          <td>${r.balance || '-'}</td>
          <td><a href="javascript:void(0)" onclick="openDetail(${realIdx})" style="font-weight:bold;color:var(--accent);">${r.set}</a></td>
          <td><span class="pill ${r.result === 'W' ? 'w' : 'l'}">${r.result === 'W' ? '승' : '패'}</span></td>
          ${isAdmin ? `<td><button class="btn-btn" onclick="openAdminModal('record', ${realIdx})">수정</button> <button class="btn-btn" style="color:red;" onclick="deleteItem('record', ${realIdx})">삭제</button></td>` : ''}
        </tr>`;
    }).join("");

    return `
      <details class="month" open>
        <summary>
          <span class="m-title">v ${k.replace('-', '.')}</span>
          <span class="m-meta">${sorted.length}세트 · ${mWin}승 ${sorted.length - mWin}패</span>
          <span class="seg">
            <button type="button" onclick="setMonthOrd('${k}','desc')" aria-pressed="${desc}">최신순</button>
            <button type="button" onclick="setMonthOrd('${k}','asc')" aria-pressed="${!desc}">오래된순</button>
          </span>
          <div class="rate-box">
            <span class="mono">승률 <b>${mRate}%</b></span>
            <div class="bar"><b style="width:${mRate}%"></b></div>
          </div>
        </summary>
        <div class="table-wrap">
          <table>
            <thead><tr><th>날짜</th><th>종류</th><th>밸런스</th><th>세트</th><th>결과</th>${isAdmin ? '<th>관리</th>' : ''}</tr></thead>
            <tbody>${trs}</tbody>
          </table>
        </div>
      </details>`;
  }).join("");

  return `
    <div class="block">
      <div class="subnav">${subnavHtml}</div>
      <h2>전체 전적</h2>
      <div class="stats">
        <div class="stat"><span class="k">세트</span><span class="v">${total}</span></div>
        <div class="stat"><span class="k">승 / 패</span><span class="v">${winCount} / ${lossCount}</span></div>
        <div class="stat"><span class="k">승률</span><span class="v">${winRate}%</span></div>
      </div>
      <div class="toolbar">
        <div class="filters">
          ${games.map(g=>`<button class="chip" onclick="setGame('${g}')" aria-pressed="${S.game===g}">${g}</button>`).join('')}
        </div>
        ${isAdmin ? `<button class="btn-accent" onclick="openAdminModal('record')">+ 새 전적 추가</button>` : ''}
      </div>
      ${monthsHtml || '<div style="padding:40px;text-align:center;color:#888;">전적 기록이 없습니다.</div>'}
    </div>`;
}

function renderScrims(subId) {
  if (subId) {
    const card = SCRIM_CARDS.find(c => c.id === subId) || SCRIM_CARDS[0];
    return `
      <div class="block">
        <a class="back-btn" onclick="location.hash='#scrim'">← 멸망전 목록으로</a>
        <h2>${card.title} 상세 전적</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>날짜</th><th>구분</th><th>경기 타이틀</th><th>결과</th><th>비고</th></tr></thead>
            <tbody>
              ${card.data.map(d => `
                <tr>
                  <td class="mono">${d.date}</td>
                  <td><b>${d.type}</b></td>
                  <td>${d.title}</td>
                  <td><span class="pill w">${d.result}</span></td>
                  <td>${d.note}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  }

  return `
    <div class="block">
      <div class="toolbar">
        <h2>롤 멸망전</h2>
        ${isAdmin ? `<button class="btn-accent" onclick="openAdminModal('scrim')">+ 새 멸망전 카드 추가</button>` : ''}
      </div>
      <div class="cards">
        ${SCRIM_CARDS.map((c, idx) => `
          <div class="card card-scrim">
            ${c.badge ? `<div class="card-badge">${c.badge}</div>` : ''}
            ${isAdmin ? `<div class="card-admin-btns"><button class="btn-btn" onclick="openAdminModal('scrim', ${idx})">수정</button><button class="btn-btn" style="color:red;" onclick="deleteItem('scrim', ${idx})">삭제</button></div>` : ''}
            <a href="#scrim-${c.id}" style="text-decoration:none; color:inherit; display:flex; flex-direction:column; height:100%;">
              <div>
                <div class="scrim-no">${c.no}</div>
                <div class="scrim-title">${c.title}</div>
                <div style="font-size:12px; color:var(--page-muted); margin-top:4px;">${c.desc}</div>
              </div>
              <div class="card-more">상세보기 →</div>
            </a>
          </div>
        `).join('')}
      </div>
    </div>`;
}

// 마크서버 탭 (1일차 옆에 상세 날짜 표시 및 관리자 일자 추가 지원)
function renderMinecraft(subId, dayIndex = 0) {
  if (subId) {
    const srvIdx = MC_SERVERS.findIndex(s => s.id === subId);
    const srv = MC_SERVERS[srvIdx] || MC_SERVERS[0];
    const curDay = srv.days[dayIndex] || srv.days[0];

    return `
      <div class="block">
        <a class="back-btn" onclick="location.hash='#mc'">← 마크서버 목록으로</a>
        <h2>${srv.serverName} (${srv.guildName}) 모험 일지</h2>
        
        <div class="toolbar" style="margin-bottom:0;">
          <div class="day-tabs">
            ${srv.days.map((d, idx) => `
              <button class="day-tab-btn" onclick="location.hash='#mc-${srv.id}-d${idx}'" ${idx === dayIndex ? 'aria-selected="true"' : ''}>
                ${d.dayTitle} <span style="font-size:11px; opacity:0.7; margin-left:3px;">(${d.dateStr})</span>
                ${isAdmin ? `<span onclick="event.stopPropagation(); deleteItem('mc_day', ${srvIdx}, ${idx})" style="color:red; margin-left:6px; font-weight:normal;">×</span>` : ''}
              </button>
            `).join('')}
          </div>
          ${isAdmin ? `<button class="btn-btn" onclick="openAdminModal('mc_day', ${srvIdx})">+ 일자 추가</button>` : ''}
        </div>

        <div class="ep-detail-wrap">
          ${curDay.sections.map(sec => `
            <div class="ep-box">
              <div class="ep-box-title">${sec.title}</div>
              <ul class="timeline-clean">
                ${sec.timelines.map(item => `
                  <li>
                    ${item.url ? `<a href="${item.url}" target="_blank">↗ ${item.text}</a>` : `<span>${item.text}</span>`}
                  </li>
                `).join('')}
              </ul>
            </div>
          `).join('')}
        </div>
      </div>`;
  }

  return `
    <div class="block">
      <div class="toolbar">
        <h2>마크서버</h2>
        ${isAdmin ? `<button class="btn-accent" onclick="openAdminModal('mc')">+ 새 마크서버 추가</button>` : ''}
      </div>
      <div class="cards">
        ${MC_SERVERS.map((s, idx) => `
          <div class="card card-mc">
            ${isAdmin ? `<div class="card-admin-btns"><button class="btn-btn" onclick="openAdminModal('mc', ${idx})">수정</button><button class="btn-btn" style="color:red;" onclick="deleteItem('mc', ${idx})">삭제</button></div>` : ''}
            <a href="#mc-${s.id}-d0" style="text-decoration:none; color:inherit; display:flex; flex-direction:column; height:100%;">
              <div>
                <div class="server-name">${s.serverName}</div>
                <div class="guild-name">${s.guildName}</div>
              </div>
              <div class="card-more">상세보기 →</div>
            </a>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function renderChong(subEp) {
  if (subEp !== null && subEp !== undefined && subEp !== "") {
    const epIdx = CHONG_EPS.findIndex(e => e.ep === parseInt(subEp));
    const epObj = CHONG_EPS[epIdx] || CHONG_EPS[0];

    return `
      <div class="block">
        <a class="back-btn" onclick="location.hash='#chong'">← 총겜동 목록으로</a>
        <div>
          <h2>EP.${epObj.ep} ${epObj.title}</h2>
          <p style="font-size:13px; color:var(--page-muted); margin:4px 0 0 0;">${epObj.desc}</p>
        </div>
        <div class="ep-detail-wrap">
          <div class="ep-box">
            <div class="ep-box-title">
              <span>방송 타임라인</span>
              ${isAdmin ? `<button class="btn-btn" onclick="openAdminModal('chong', ${epIdx})">상세/타임라인 편집</button>` : ''}
            </div>
            <ul class="timeline-clean">
              ${epObj.timeline.map(item => `
                <li>
                  ${item.url ? `<a href="${item.url}" target="_blank">↗ ${item.text}</a>` : `<span>${item.text}</span>`}
                </li>
              `).join('')}
            </ul>
          </div>
        </div>
      </div>`;
  }

  return `
    <div class="block">
      <div class="toolbar">
        <h2>총겜동</h2>
        ${isAdmin ? `<button class="btn-accent" onclick="openAdminModal('chong')">+ 새 에피소드 추가</button>` : ''}
      </div>
      <div class="cards">
        ${CHONG_EPS.map((e, idx) => `
          <div class="card card-chong">
            ${isAdmin ? `<div class="card-admin-btns"><button class="btn-btn" onclick="openAdminModal('chong', ${idx})">수정</button><button class="btn-btn" style="color:red;" onclick="deleteItem('chong', ${idx})">삭제</button></div>` : ''}
            <a href="#chong-ep${e.ep}" style="text-decoration:none; color:inherit; display:flex; flex-direction:column; height:100%;">
              <div>
                <div class="ep-no">EP.${e.ep}</div>
                <div class="ep-title">${e.title}</div>
              </div>
              <div class="card-more">EP.${e.ep} 보기 →</div>
            </a>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function getWd(d) {
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return days[new Date(d).getDay()];
}

function setGame(g) { S.game = g; S.mode = "전체"; render(); }
function setMode(m) { S.mode = m; render(); }
function setMonthOrd(k, ord) { S.monthOrder[k] = ord; render(); }

function render() {
  const hash = location.hash.slice(1) || "record";
  const cat = hash.split("-")[0];

  document.querySelectorAll("#mainNav a").forEach(a => {
    if (a.dataset.cat === cat) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });

  const view = document.getElementById("view");

  if (cat === "record") {
    view.innerHTML = renderRecords();
  } else if (cat === "scrim") {
    const match = hash.match(/^scrim-(.+)$/);
    view.innerHTML = renderScrims(match ? match[1] : null);
  } else if (cat === "mc") {
    const match = hash.match(/^mc-([a-z0-9-]+)-d(\d+)$/);
    if (match) view.innerHTML = renderMinecraft(match[1], parseInt(match[2]));
    else view.innerHTML = renderMinecraft(hash.startsWith("mc-") ? hash : null, 0);
  } else if (cat === "chong") {
    const epMatch = hash.match(/^chong-ep(\d+)$/);
    view.innerHTML = renderChong(epMatch ? epMatch[1] : null);
  } else {
    view.innerHTML = renderRecords();
  }
}

window.addEventListener("hashchange", render);
render();
</script>
