<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DOHYEON ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --page: #f1f3f6; --page-fg: #12161c; --page-muted: #566170;
  --panel: #ffffff; --surface: #ffffff; --surface-2: #f8fa00; --line: #dde2ea;
  --accent: #2a56d6; --accent-ink: #ffffff; --soft: #e4ebfc; --soft-ink: #1f3fa6;
  --win: #16794c; --win-bg: #dff2e6; --loss: #b3282d; --loss-bg: #fae3e3; --neutral-bg: #e6e9ee;
  --pink: #d65a9e; --pink-bg: #fbe3f0; --pink-ink: #7d1f55;
  --yellow: #d9a200; --yellow-bg: #fdf0b8; --yellow-ink: #5a4400;
  --sky: #4a9be8; --sky-bg: #dcecfd; --sky-ink: #0f4a86;
  --violet: #9b6fe0; --violet-bg: #eadfff; --violet-ink: #4a2a8c;
  --font-display: "Barlow Condensed", "Noto Sans KR", sans-serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0f1318; --page-fg: #e8ecf2; --page-muted: #9aa5b4;
    --panel: #171c23; --surface: #171c23; --surface-2: #212833; --line: #2a323e;
    --accent: #7ea3ff; --accent-ink: #0c1220; --soft: #1c2740; --soft-ink: #a9c1ff;
    --win: #5fd39a; --win-bg: #163527; --loss: #ff8a8f; --loss-bg: #3b1d20; --neutral-bg: #2a2a31;
    --pink: #ef8fc3; --pink-bg: #3a1c2d; --pink-ink: #ffd3ea;
    --yellow: #f2c744; --yellow-bg: #3b3210; --yellow-ink: #ffe9a0;
    --sky: #7bb8f5; --sky-bg: #14293f; --sky-ink: #cfe6ff;
    --violet: #bf9cff; --violet-bg: #2a1f45; --violet-ink: #e3d4ff;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--page-fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; padding: 28px 16px 56px; }

/* 전체 컨테이너 5% 확대 (1090px) */
.wrap { max-width: 1090px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
a { color: inherit; text-decoration: none; }

header.top { display: flex; justify-content: space-between; align-items: flex-start; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: 1; letter-spacing: -0.01em; text-transform: uppercase; }
h1 em { font-family: var(--font-display); font-style: italic; font-weight: 800; }

/* 스티커 메모 탭 */
nav.bar { display: flex; align-items: flex-end; gap: 6px; border-bottom: 1px solid var(--line); padding-left: 10px; }
nav.bar a {
  position: relative; display: inline-flex; align-items: center; padding: 8px 22px;
  border-radius: 8px 8px 0 0; font-weight: 700; font-size: 15px;
  background: var(--note); color: var(--note-ink); border: 1px solid var(--note-edge); border-bottom: 0;
  box-shadow: 0 -2px 5px rgba(0,0,0,0.05); transform-origin: 50% 100%; transform: rotate(var(--tilt, 0deg)) translateY(2px);
}
nav.bar a::before {
  content: ""; position: absolute; top: -5px; left: 50%; width: 26px; height: 8px; margin-left: -13px;
  background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(0,0,0,0.08); border-radius: 2px; transform: rotate(-3deg);
}
nav.bar a[data-cat="record"] { --note: var(--pink-bg); --note-ink: var(--pink-ink); --note-edge: var(--pink); --tilt: -1deg; }
nav.bar a[data-cat="scrim"] { --note: var(--yellow-bg); --note-ink: var(--yellow-ink); --note-edge: var(--yellow); --tilt: 1deg; }
nav.bar a[data-cat="mc"] { --note: var(--sky-bg); --note-ink: var(--sky-ink); --note-edge: var(--sky); --tilt: -0.8deg; }
nav.bar a[data-cat="chong"] { --note: var(--violet-bg); --note-ink: var(--violet-ink); --note-edge: var(--violet); --tilt: 1.2deg; }
nav.bar a[aria-current="page"] {
  z-index: 1; transform: none; padding-top: 11px; padding-bottom: 9px; margin-bottom: -1px;
  border-color: var(--line); border-bottom: 1px solid var(--panel); background: var(--panel); color: var(--page-fg);
}

.panel { background: var(--panel); border-radius: 0 0 12px 12px; padding: 24px; border: 1px solid var(--line); border-top: 0; }
.block { display: flex; flex-direction: column; gap: 20px; }
.subnav { display: flex; gap: 8px; flex-wrap: wrap; }
.subnav a { padding: 5px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--page-fg); font-size: 13px; cursor: pointer; }
.subnav a[aria-current="page"] { background: var(--soft); border-color: var(--accent); color: var(--soft-ink); font-weight: 700; }
.subnav .n { font-family: var(--font-mono); opacity: 0.7; margin-left: 4px; }

h2 { margin: 0; font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

.stats { display: flex; gap: 32px; align-items: flex-end; }
.stat .k { font-size: 12px; color: var(--page-muted); display: block; }
.stat .v { font-family: var(--font-mono); font-size: 22px; font-weight: 700; }
.form-dots { display: flex; gap: 4px; }
.form-dots i { width: 12px; height: 18px; border-radius: 2px; display: block; background: var(--neutral-bg); }
.form-dots i.w { background: var(--win); }
.form-dots i.l { background: var(--loss); }

.toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.filters { display: flex; gap: 6px; align-items: center; }
.chip { font: inherit; font-size: 13px; padding: 4px 14px; border-radius: 999px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); color: var(--page-fg); }
.chip[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--soft-ink); font-weight: 700; }

/* 월별 아코디언 */
.month { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); margin-bottom: 16px; }
.month summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: #eef3fc; color: #1a365d; font-weight: bold; }
.month summary::-webkit-details-marker { display: none; }
.month .m-title { font-family: var(--font-mono); font-size: 16px; color: #2b6cb0; }
.month .m-meta { font-size: 13px; opacity: 0.8; font-weight: normal; }
.month .seg { margin-left: 10px; display: inline-flex; border: 1px solid #cbd5e0; border-radius: 999px; overflow: hidden; }
.month .seg button { font: inherit; font-size: 11px; padding: 2px 10px; border: 0; background: transparent; cursor: pointer; }
.month .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: bold; }
.month .rate-box { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.month .bar { width: 100px; height: 8px; border-radius: 4px; background: var(--loss-bg); overflow: hidden; }
.month .bar b { display: block; height: 100%; background: var(--win); }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 650px; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--page-muted); font-weight: 500; }
tbody tr:hover { background: rgba(0,0,0,0.02); }
td.mono { font-family: var(--font-mono); }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.pill.w { background: var(--win-bg); color: var(--win); }
.pill.l { background: var(--loss-bg); color: var(--loss); }
.tag-sample { font-size: 11px; background: #eee; padding: 1px 6px; border-radius: 4px; margin-left: 6px; color: #666; }
.nms { display: flex; flex-wrap: wrap; gap: 4px; }
.nm { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--neutral-bg); }

/* 카드 스타일 (마크서버 & 총겜동) */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 15px; }
.card { display: flex; flex-direction: column; justify-content: space-between; gap: 12px; min-height: 140px; padding: 20px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; text-decoration: none; color: var(--page-fg); position: relative; transition: border-color 0.15s, transform 0.15s; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); }

/* 마크서버 전용 스타일 */
.card-mc .guild-name { font-size: 13px; font-weight: bold; color: var(--sky); }
.card-mc .server-name { font-size: 20px; font-weight: 800; color: #000; }
.card-more { align-self: flex-end; font-size: 12px; color: var(--page-muted); font-weight: 500; display: flex; align-items: center; gap: 2px; }

/* 총겜동 전용 스타일 */
.card-chong .ep-no { font-family: var(--font-display); font-weight: 800; font-size: 32px; color: var(--violet); line-height: 1; }
.card-chong .ep-title { font-size: 18px; font-weight: 700; color: #000; }

/* 에피소드 & 서버 상세페이지 레이아웃 */
.ep-detail-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
@media (max-width: 768px) { .ep-detail-wrap { grid-template-columns: 1fr; } }
.ep-box { border: 1px solid var(--line); border-radius: 12px; padding: 20px; background: var(--surface); }
.ep-box-title { display: inline-block; padding: 2px 12px; border-radius: 999px; background: var(--violet-bg); color: var(--violet-ink); border: 1px solid var(--violet); font-size: 13px; font-weight: bold; margin-bottom: 14px; }
.timeline-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.timeline-list li { position: relative; padding-left: 18px; }
.timeline-list li::before { content: ""; position: absolute; left: 0; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--violet); }
.timeline-list a { color: var(--violet-ink); font-weight: 500; text-decoration: none; }
.timeline-list a:hover { text-decoration: underline; }

.back-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--page-muted); margin-bottom: 10px; cursor: pointer; text-decoration: none; }
.back-btn:hover { color: var(--page-fg); }

/* 모달 */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
.modal { background: var(--panel); border-radius: 12px; width: 100%; max-width: 580px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 1px solid var(--line); }
.modal h3 { margin-top: 0; font-size: 20px; border-bottom: 1px solid var(--line); padding-bottom: 10px; display: flex; justify-content: space-between; }
.modal .close-btn { cursor: pointer; border: 0; background: transparent; font-size: 20px; }
.detail-sec { margin-bottom: 16px; }
.detail-sec label { font-size: 12px; color: var(--page-muted); font-weight: bold; display: block; margin-bottom: 4px; }
.detail-sec .val { font-size: 14px; white-space: pre-wrap; line-height: 1.6; }

.pubg-team-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.pubg-team-table th, .pubg-team-table td { border: 1px solid var(--line); padding: 6px 10px; font-size: 13px; text-align: center; }
.pubg-team-table th { background: var(--surface-2); }

.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; font: inherit; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--page-fg); }

/* 관리자 바 */
#admin-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #18181b; color: #fff; padding: 10px 24px; display: none; justify-content: space-between; align-items: center; z-index: 999; font-weight: bold; }
#admin-bar button { background: #ef4444; color: #fff; border: 0; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
.btn-btn { font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 6px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); }
.btn-accent { background: var(--accent); color: #fff; border: 0; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>DOHYEON <em>ARCHIVE</em></h1>
  </header>

  <div class="sheet">
    <nav class="bar" id="mainNav">
      <a href="#record" data-cat="record">전적</a>
      <a href="#scrim" data-cat="scrim">롤 멸망전</a>
      <a href="#mc" data-cat="mc">마크서버</a>
      <a href="#chong" data-cat="chong">총겜동</a>
    </nav>
    <div class="panel">
      <main id="view"></main>
    </div>
  </div>
</div>

<!-- 관리자 상태바 -->
<div id="admin-bar">
  <span>⚡ 관리자 모드 활성화 (Alt+A)</span>
  <button onclick="logoutAdmin()">관리자 종료</button>
</div>

<!-- 상세보기 모달 -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <h3><span id="mTitle">전적 상세 정보</span><button class="close-btn" onclick="closeModal('detailModal')">✕</button></h3>
    <div id="modalContent"></div>
  </div>
</div>

<!-- 전적 추가/수정 모달 -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <h3><span id="formTitle">전적 추가</span><button class="close-btn" onclick="closeModal('formModal')">✕</button></h3>
    <form id="recordForm" onsubmit="saveRecord(event)">
      <input type="hidden" id="editIdx" value="-1">
      <div class="form-group"><label>날짜 (YYYY-MM-DD)</label><input type="text" id="fDate" required placeholder="2026-05-23"></div>
      <div class="form-group"><label>게임</label>
        <select id="fGame"><option value="발로란트">발로란트</option><option value="롤">롤</option><option value="배그">배그</option></select>
      </div>
      <div class="form-group"><label>종류</label>
        <select id="fMode">
          <option value="내전">내전</option>
          <option value="랜드">랜드</option>
          <option value="CK">CK</option>
          <option value="킬내기">킬내기</option>
          <option value="공장">공장</option>
        </select>
      </div>
      <div class="form-group"><label>세트</label><input type="text" id="fSet" required placeholder="1세트"></div>
      <div class="form-group"><label>결과</label>
        <select id="fResult"><option value="W">승</option><option value="L">패</option></select>
      </div>
      <div class="form-group"><label>맵 / 챔피언</label><input type="text" id="fDetail" placeholder="어센트 또는 아리 등"></div>
      <div class="form-group"><label>순수킬 (배그 전용, 없을시 비워둠)</label><input type="text" id="fKills" placeholder="숫자만 입력"></div>
      <div class="form-group"><label>요원 (발로란트 전용)</label><input type="text" id="fAgent" placeholder="제트"></div>
      <div class="form-group"><label>주요 표출 멤버 (쉼표 구분)</label><input type="text" id="fMembers" placeholder="예시A, 예시B, 예시C"></div>
      <hr style="margin: 15px 0; border:0; border-top:1px solid var(--line);">
      <div class="form-group">
        <label>전체 멤버 상세 내용 (엔터/줄바꿈 가능)</label>
        <textarea id="fAllMembersText" rows="4" placeholder="줄바꿈으로 전체 멤버 목록을 자유롭게 적을 수 있습니다."></textarea>
      </div>
      <div class="form-group"><label>배그 3:3 ~ 8:8 팀별 멤버 (형식: A팀: 멤버1,멤버2 / B팀: 멤버3,멤버4)</label><input type="text" id="fPubgTeams" placeholder="A팀: A,B,C / B팀: D,E,F"></div>
      <div class="form-group"><label>풀영상 VOD 링크</label><input type="url" id="fVod" placeholder="https://youtube.com/..."></div>
      <div class="form-group"><label>경기 메모 / 비고</label><textarea id="fNote" rows="2" placeholder="경기 하이라이트 및 메모"></textarea></div>
      <button type="submit" class="btn-accent" style="width:100%; margin-top:10px;">저장하기</button>
    </form>
  </div>
</div>

<script>
// 게임별 종류 옵션 정의
const GAME_MODES = {
  "발로란트": ["전체", "내전", "랜드", "CK"],
  "롤": ["전체", "랜드", "CK"],
  "배그": ["전체", "킬내기", "랜드", "공장"]
};

const DEFAULT_SETS = [
  {
    date: "2026-10-24", game: "롤", mode: "랜드", set: "1세트", result: "W", champ: "아리",
    members: ["예시B", "예시E", "예시I", "예시L", "예시A"], sample: true,
    allMembersText: "도현(아리)\n예시B\n예시E\n예시I\n예시L\n예시A", vod: "", note: "롤 랜드 1세트 승리"
  },
  {
    date: "2026-09-12", game: "배그", mode: "킬내기", set: "1세트", result: "W", kills: "7",
    members: ["예시A", "예시E", "예시F"], sample: true,
    allMembersText: "도현 팀: 도현, 예시A, 예시E, 예시F\n상대 팀: 상대A, 상대B, 상대C, 상대D",
    pubgTeams: "A팀: 도현, 예시A, 예시E, 예시F / B팀: 상대A, 상대B, 상대C, 상대D",
    vod: "", note: "배그 킬내기 7순수킬 기록"
  },
  {
    date: "2026-03-14", game: "배그", mode: "공장", set: "1세트", result: "W", kills: "",
    members: ["예시A", "예시B", "예시C", "예시D"], sample: true,
    allMembersText: "공장 매치 8명 진행", vod: "", note: "순수킬 미기록"
  },
  {
    date: "2026-05-23", game: "발로란트", mode: "내전", set: "1세트", result: "W", map: "헤이븐", agent: "소바",
    members: ["예시A", "예시B", "예시G"], sample: true,
    allMembersText: "도현, 예시A, 예시B, 예시G", vod: "", note: "발로 내전 승리"
  }
];

// 마크서버 & 총겜동 데이터
const MC_SERVERS = [
  { id: "mc-1", guild: "코창길드", name: "코창서버", desc: "코창서버 모험 기록" },
  { id: "mc-2", guild: "맹든길드", name: "맹든링서버", desc: "맹든링서버 1일차~5일차 모험" }
];

const CHONG_EPS = [
  { ep: 0, title: "프롤로그", date: "2025-04-15", memCount: "3명", summary: "총겜동의 시작을 알린 첫 방송.", timeline: ["오프닝", "동아리 소개", "첫 게임 시작", "엔딩"] },
  { ep: 1, title: "첫 정기전", date: "2025-05-01", memCount: "4명", summary: "첫 번째 정기 모임 방송.", timeline: ["오프닝", "팀 나누기", "1경기 진행", "최종 소감"] }
];

let setsData = JSON.parse(localStorage.getItem("dohyeon_sets")) || DEFAULT_SETS;
function saveSets() { localStorage.setItem("dohyeon_sets", JSON.stringify(setsData)); }

let isAdmin = false;
let S = { game: "발로란트", mode: "전체", monthOrder: {} };

window.addEventListener("keydown", e => {
  if (e.altKey && e.code === "KeyA") {
    e.preventDefault();
    const pw = prompt("관리자 비밀코드를 입력하세요:");
    if (pw === "1520711") {
      isAdmin = true;
      document.getElementById("admin-bar").style.display = "flex";
      alert("관리자 모드가 활성화되었습니다!");
      render();
    } else if (pw !== null) {
      alert("비밀코드가 올바르지 않습니다.");
    }
  }
});

function logoutAdmin() {
  isAdmin = false;
  document.getElementById("admin-bar").style.display = "none";
  render();
}

function closeModal(id) { document.getElementById(id).style.display = "none"; }

function openDetail(idx) {
  const r = setsData[idx];
  let pubgTableHtml = "";

  if (r.pubgTeams) {
    const teams = r.pubgTeams.split("/").map(t => t.trim());
    pubgTableHtml = `
      <div class="detail-sec"><label>⚔️ 팀별 멤버 구성</label>
        <table class="pubg-team-table">
          <thead><tr><th>팀</th><th>멤버</th></tr></thead>
          <tbody>
            ${teams.map(t => {
              const [tName, tMems] = t.split(":");
              return `<tr><td><b>${tName || '팀'}</b></td><td>${tMems || t}</td></tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>`;
  }

  document.getElementById("mTitle").textContent = `${r.date} ${r.game} (${r.set})`;
  document.getElementById("modalContent").innerHTML = `
    <div class="detail-sec"><label>경기 종류 / 결과</label><div class="val">${r.mode} · <span class="pill ${r.result==='W'?'w':'l'}">${r.result==='W'?'승리':'패배'}</span></div></div>
    <div class="detail-sec"><label>맵 / 챔피언 / 요원</label><div class="val">${r.map || r.champ || '-'} ${r.agent ? '('+r.agent+')' : ''}</div></div>
    ${r.kills ? `<div class="detail-sec"><label>🎯 순수킬</label><div class="val">${r.kills} 킬</div></div>` : ''}
    <div class="detail-sec"><label>👥 전체 멤버</label><div class="val">${r.allMembersText || r.members.join(', ')}</div></div>
    ${pubgTableHtml}
    ${r.note ? `<div class="detail-sec"><label>📝 경기 메모</label><div class="val">${r.note}</div></div>` : ''}
    ${r.vod ? `<div class="detail-sec"><label>🎬 풀영상</label><div class="val"><a href="${r.vod}" target="_blank" style="color:var(--accent);font-weight:bold;">영상 보러가기 ↗</a></div></div>` : ''}
  `;
  document.getElementById("detailModal").style.display = "flex";
}

function openForm(idx = -1) {
  document.getElementById("editIdx").value = idx;
  if (idx === -1) {
    document.getElementById("formTitle").textContent = "전적 추가";
    document.getElementById("recordForm").reset();
  } else {
    document.getElementById("formTitle").textContent = "전적 수정";
    const r = setsData[idx];
    document.getElementById("fDate").value = r.date;
    document.getElementById("fGame").value = r.game;
    document.getElementById("fMode").value = r.mode;
    document.getElementById("fSet").value = r.set;
    document.getElementById("fResult").value = r.result;
    document.getElementById("fDetail").value = r.map || r.champ || "";
    document.getElementById("fKills").value = r.kills || "";
    document.getElementById("fAgent").value = r.agent || "";
    document.getElementById("fMembers").value = r.members ? r.members.join(", ") : "";
    document.getElementById("fAllMembersText").value = r.allMembersText || "";
    document.getElementById("fPubgTeams").value = r.pubgTeams || "";
    document.getElementById("fVod").value = r.vod || "";
    document.getElementById("fNote").value = r.note || "";
  }
  document.getElementById("formModal").style.display = "flex";
}

function saveRecord(e) {
  e.preventDefault();
  const idx = parseInt(document.getElementById("editIdx").value);
  const game = document.getElementById("fGame").value;
  const detailVal = document.getElementById("fDetail").value;

  const item = {
    date: document.getElementById("fDate").value,
    game: game,
    mode: document.getElementById("fMode").value,
    set: document.getElementById("fSet").value,
    result: document.getElementById("fResult").value,
    map: game === "발로란트" ? detailVal : "",
    champ: game === "롤" ? detailVal : "",
    kills: document.getElementById("fKills").value.trim(),
    agent: document.getElementById("fAgent").value,
    members: document.getElementById("fMembers").value.split(",").map(s => s.trim()).filter(Boolean),
    allMembersText: document.getElementById("fAllMembersText").value,
    pubgTeams: document.getElementById("fPubgTeams").value,
    vod: document.getElementById("fVod").value,
    note: document.getElementById("fNote").value,
  };

  if (idx === -1) setsData.push(item);
  else setsData[idx] = item;

  saveSets();
  closeModal("formModal");
  render();
}

function deleteRecord(idx) {
  if (confirm("정말 이 전적을 삭제하시겠습니까?")) {
    setsData.splice(idx, 1);
    saveSets();
    render();
  }
}

// 전적 페이지 렌더링
function renderRecords() {
  const games = ["발로란트", "롤", "배그"];
  const currentModes = GAME_MODES[S.game] || ["전체"];

  // 선택된 게임 및 모드 필터링
  let rows = setsData.filter(r => r.game === S.game);
  if (S.mode !== "전체") {
    rows = rows.filter(r => r.mode === S.mode);
  }

  const total = rows.length;
  const winCount = rows.filter(r => r.result === "W").length;
  const lossCount = total - winCount;
  const winRate = total ? Math.round((winCount / total) * 100) : 0;

  // 게임별 카운트 계산용 (전체 모드 기준)
  const allGameRows = setsData.filter(r => r.game === S.game);

  // 서브탭 HTML (게임별 개별 옵션)
  const subnavHtml = currentModes.map(m => {
    const count = m === "전체" ? allGameRows.length : allGameRows.filter(r => r.mode === m).length;
    return `<a onclick="setMode('${m}')" ${S.mode === m ? 'aria-current="page"' : ''}>${m} <span class="n">${count}</span></a>`;
  }).join("");

  const groups = new Map();
  rows.forEach(r => {
    const k = r.date.slice(0, 7);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  });

  const isPubg = S.game === "배그";

  const monthsHtml = [...groups.entries()].map(([k, list]) => {
    const desc = S.monthOrder[k] === "desc";
    const sorted = [...list].sort((a, b) => desc ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));
    const mWin = sorted.filter(r => r.result === "W").length;
    const mRate = Math.round((mWin / sorted.length) * 100);

    const trs = sorted.map(r => {
      const realIdx = setsData.indexOf(r);
      return `
        <tr>
          <td class="mono">${r.date.slice(5).replace('-', '.')} ${getWd(r.date)}</td>
          <td>${r.mode}</td>
          <td><a href="javascript:void(0)" onclick="openDetail(${realIdx})" style="font-weight:bold;color:var(--accent);">${r.set}</a> ${r.sample ? '<span class="tag-sample">예시</span>' : ''}</td>
          <td><span class="pill ${r.result === 'W' ? 'w' : 'l'}">${r.result === 'W' ? '승' : '패'}</span></td>
          ${isPubg ? `<td>${r.kills ? r.kills : ''}</td>` : `<td>${r.map || r.champ || '-'}</td>`}
          ${!isPubg ? `<td>${r.agent || '-'}</td>` : ''}
          <td><div class="nms">${r.members.map(m => `<span class="nm">${m}</span>`).join('')}</div></td>
          <td>
            <button class="btn-btn" onclick="openDetail(${realIdx})">상세</button>
            ${isAdmin ? `<button class="btn-btn" onclick="openForm(${realIdx})">수정</button> <button class="btn-btn" style="color:red;" onclick="deleteRecord(${realIdx})">삭제</button>` : ''}
          </td>
        </tr>`;
    }).join("");

    return `
      <details class="month" open>
        <summary>
          <span class="m-title">v ${k.replace('-', '.')}</span>
          <span class="m-meta">${sorted.length}세트 · ${mWin}승 ${sorted.length - mWin}패</span>
          <span class="seg">
            <button type="button" onclick="setMonthOrd('${k}','desc')" aria-pressed="${desc}">최신순</button>
            <button type="button" onclick="setMonthOrd('${k}','asc')" aria-pressed="${!desc}">오래된순</button>
          </span>
          <div class="rate-box">
            <span class="mono">승률 <b>${mRate}%</b></span>
            <div class="bar"><b style="width:${mRate}%"></b></div>
          </div>
        </summary>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>날짜</th><th>종류</th><th>세트</th><th>결과</th>
                ${isPubg ? '<th>순수킬</th>' : '<th>맵/챔피언</th><th>요원</th>'}
                <th>멤버</th><th>상세보기</th>
              </tr>
            </thead>
            <tbody>${trs}</tbody>
          </table>
        </div>
      </details>`;
  }).join("");

  return `
    <div class="block">
      <div class="subnav">${subnavHtml}</div>

      <h2>전체 전적</h2>

      <div class="stats">
        <div class="stat"><span class="k">세트</span><span class="v">${total}</span></div>
        <div class="stat"><span class="k">승 / 패</span><span class="v">${winCount} / ${lossCount}</span></div>
        <div class="stat"><span class="k">승률</span><span class="v">${winRate}%</span></div>
        <div class="stat"><span class="k">최근 3세트</span>
          <div class="form-dots">${rows.slice(0,3).map(r=>`<i class="${r.result==='W'?'w':'l'}"></i>`).join('')}</div>
        </div>
      </div>

      <div class="toolbar">
        <div class="filters">
          ${games.map(g=>`<button class="chip" onclick="setGame('${g}')" aria-pressed="${S.game===g}">${g}</button>`).join('')}
        </div>
        ${isAdmin ? `<button class="btn-accent" onclick="openForm()">+ 새 전적 추가</button>` : ''}
      </div>

      ${monthsHtml || '<div style="padding:40px;text-align:center;color:#888;">선택한 종류의 전적 기록이 없습니다.</div>'}
    </div>`;
}

function renderScrims() {
  return `<div class="block"><h2>롤 멸망전 기록</h2><p style="color:var(--page-muted)">멸망전 기록 페이지입니다.</p></div>`;
}

// 마크서버 목록 & 상세페이지
function renderMinecraft(subId) {
  if (subId) {
    const srv = MC_SERVERS.find(s => s.id === subId) || MC_SERVERS[0];
    return `
      <div class="block">
        <a class="back-btn" onclick="location.hash='#mc'">← 마크서버 목록으로</a>
        <h2>${srv.name} 상세 정보</h2>
        <div class="ep-detail-wrap">
          <div class="ep-box">
            <span class="ep-box-title" style="background:var(--sky-bg);color:var(--sky-ink);border-color:var(--sky);">서버 모험 타임라인</span>
            <ul class="timeline-list">
              <li><a href="https://youtube.com" target="_blank" style="color:var(--sky-ink);">1일차: 서버 입장 및 광질 ↗</a></li>
              <li><a href="https://youtube.com" target="_blank" style="color:var(--sky-ink);">2일차: 길드 하우스 건축 ↗</a></li>
              <li><a href="https://youtube.com" target="_blank" style="color:var(--sky-ink);">3일차: 보스 레이드 ↗</a></li>
            </ul>
          </div>
          <div class="ep-box">
            <span class="ep-box-title" style="background:var(--sky-bg);color:var(--sky-ink);border-color:var(--sky);">서버 안내</span>
            <p style="margin:0; line-height:1.6;">${srv.guild} 소속으로 참여한 ${srv.name} 기록 페이지입니다.</p>
          </div>
        </div>
      </div>`;
  }

  return `
    <div class="block">
      <h2>마크서버</h2>
      <div class="cards">
        ${MC_SERVERS.map(s => `
          <a class="card card-mc" href="#mc-${s.id}">
            <div>
              <div class="guild-name">${s.guild}</div>
              <div class="server-name">${s.name}</div>
            </div>
            <div class="card-more">→ 상세보기</div>
          </a>
        `).join('')}
      </div>
    </div>`;
}

// 총겜동 목록 & 상세페이지
function renderChong(subEp) {
  if (subEp !== null && subEp !== undefined) {
    const epObj = CHONG_EPS.find(e => e.ep === parseInt(subEp)) || CHONG_EPS[0];
    return `
      <div class="block">
        <a class="back-btn" onclick="location.hash='#chong'">← 총겜동 목록으로</a>
        <h2>EP.${epObj.ep} ${epObj.title}</h2>
        <div class="ep-detail-wrap">
          <div class="ep-box">
            <span class="ep-box-title">방송 타임라인</span>
            <ul class="timeline-list">
              ${epObj.timeline.map(t => `<li><a href="https://youtube.com" target="_blank">${t} ↗</a></li>`).join('')}
            </ul>
          </div>
          <div class="ep-box">
            <span class="ep-box-title">에피소드 내용</span>
            <p style="margin:0; line-height:1.6;">${epObj.summary}</p>
          </div>
        </div>
      </div>`;
  }

  return `
    <div class="block">
      <h2>총겜동</h2>
      <div class="cards">
        ${CHONG_EPS.map(e => `
          <a class="card card-chong" href="#chong-ep${e.ep}">
            <div>
              <div class="ep-no">EP.${e.ep}</div>
              <div class="ep-title">${e.title}</div>
            </div>
            <div class="card-more">→ 상세보기</div>
          </a>
        `).join('')}
      </div>
    </div>`;
}

function getWd(d) {
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return days[new Date(d).getDay()];
}

function setGame(g) {
  S.game = g;
  S.mode = "전체"; // 게임 교체 시 기본 전체 모드로 초기화
  render();
}

function setMode(m) {
  S.mode = m;
  render();
}

function setMonthOrd(k, ord) { S.monthOrder[k] = ord; render(); }

function render() {
  const hash = location.hash.slice(1) || "record";
  const cat = hash.split("-")[0];

  document.querySelectorAll("#mainNav a").forEach(a => {
    if (a.dataset.cat === cat) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });

  const view = document.getElementById("view");

  if (cat === "record") {
    view.innerHTML = renderRecords();
  } else if (cat === "scrim") {
    view.innerHTML = renderScrims();
  } else if (cat === "mc") {
    const subId = hash.startsWith("mc-") ? hash : null;
    view.innerHTML = renderMinecraft(subId);
  } else if (cat === "chong") {
    const epMatch = hash.match(/^chong-ep(\d+)$/);
    const subEp = epMatch ? epMatch[1] : null;
    view.innerHTML = renderChong(subEp);
  } else {
    view.innerHTML = renderRecords();
  }
}

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
