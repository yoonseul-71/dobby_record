<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOHYEON ARCHIVE - 도현 기록 모음</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-base">

    <div>
        <!-- 상단 헤더 -->
        <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex flex-col md:flex-row items-center justify-between gap-3 py-2 md:py-0">
                <div class="flex items-center space-x-3">
                    <div class="bg-amber-500/10 border border-amber-500/30 p-2.5 rounded-xl text-amber-400">
                        <i class="fa-solid fa-trophy text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white flex items-center gap-2">
                            SOOP DOHYEON
                        </h1>
                        <p class="text-xs text-slate-400 font-medium">전적 검색 & 롤 멸망전 & 총겜동 & 마크서버</p>
                    </div>
                </div>

                <!-- 메인 탭 4개 & 관리자 모드 버튼 -->
                <div class="flex items-center space-x-3">
                    <nav class="flex space-x-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800 overflow-x-auto max-w-full custom-scrollbar">
                        <button id="nav-btn-history" onclick="switchMainTab('history')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all bg-indigo-600 text-white shadow-lg whitespace-nowrap">
                            게임 전적 검색
                        </button>
                        <button id="nav-btn-mwj" onclick="switchMainTab('mwj')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all text-slate-400 hover:text-white whitespace-nowrap">
                            롤 멸망전
                        </button>
                        <button id="nav-btn-chong" onclick="switchMainTab('chong')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all text-slate-400 hover:text-white whitespace-nowrap">
                            총겜동
                        </button>
                        <button id="nav-btn-mc" onclick="switchMainTab('mc')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all text-slate-400 hover:text-white whitespace-nowrap">
                            마크서버
                        </button>
                    </nav>
                    <button onclick="toggleAdminMode()" id="admin-mode-btn" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl border border-slate-700 transition-all whitespace-nowrap">
                        <i class="fa-solid fa-lock mr-1"></i>관리자 OFF
                    </button>
                </div>
            </div>
        </header>

        <!-- 메인 컨텐츠 영역 -->
        <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

            <!-- 1. 게임 전적 검색 섹션 -->
            <section id="section-history" class="space-y-6">
                <div class="bg-slate-900/80 backdrop-blur border border-slate-800 p-4 rounded-2xl flex flex-col md:flex-row gap-4 justify-between items-center shadow-xl">
                    <div class="flex space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800 w-full md:w-auto">
                        <button id="game-tab-val" onclick="switchGameTab('val')" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-xs sm:text-sm font-bold bg-rose-600 text-white transition-all">VALORANT</button>
                        <button id="game-tab-lol" onclick="switchGameTab('lol')" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-xs sm:text-sm font-bold text-slate-400 hover:text-white transition-all">LEAGUE OF LEGENDS</button>
                        <button id="game-tab-pubg" onclick="switchGameTab('pubg')" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-xs sm:text-sm font-bold text-slate-400 hover:text-white transition-all">PUBG</button>
                    </div>
                    <div class="flex gap-2 w-full md:w-auto">
                        <button onclick="openAddRecordModal()" id="add-record-btn" class="hidden px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition-all flex items-center gap-1 whitespace-nowrap">
                            <i class="fa-solid fa-plus"></i> 기록 추가
                        </button>
                        <select id="type-filter" onchange="filterRecords()" class="bg-slate-950 border border-slate-800 text-slate-300 text-sm rounded-xl px-3 py-2 outline-none focus:border-indigo-500">
                            <option value="ALL">전체 유형</option>
                            <option value="내전">내전</option>
                            <option value="CK">CK</option>
                            <option value="랜드">랜드</option>
                            <option value="자유입력">자유입력</option>
                        </select>
                        <div class="relative flex-1 md:w-64">
                            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                            <input type="text" id="search-input" onkeyup="filterRecords()" placeholder="스트리머, 챔프/요원, 날짜..." class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-sm rounded-xl pl-9 pr-4 py-2 outline-none focus:border-indigo-500">
                        </div>
                    </div>
                </div>
                <div id="record-list" class="space-y-3"></div>
            </section>

            <!-- 2. 롤 멸망전 섹션 -->
            <section id="section-mwj" class="space-y-6 hidden">
                <div id="mwj-main-view">
                    <div class="mb-6 flex justify-between items-end">
                        <div>
                            <h2 class="text-xl font-bold text-white mb-1">참여 멸망전 목록</h2>
                            <p class="text-sm text-slate-400">팀 카드를 클릭하면 상세 아카이브를 확인할 수 있습니다.</p>
                        </div>
                        <button onclick="openAddTeamModal()" id="add-mwj-btn" class="hidden px-3.5 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold rounded-xl transition-all">
                            <i class="fa-solid fa-plus mr-1"></i>멸망전 팀 추가
                        </button>
                    </div>
                    <div id="mwj-teams-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </div>

                <div id="mwj-detail-view" class="space-y-6 hidden">
                    <div class="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                        <div class="flex items-center space-x-4">
                            <button onclick="closeMwjDetail()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold rounded-xl transition-all">
                                <i class="fa-solid fa-arrow-left mr-1.5"></i>목록으로
                            </button>
                            <div>
                                <h2 id="detail-team-title" class="text-lg font-bold text-white">멸망전 상세 아카이브</h2>
                                <span class="text-xs text-amber-400 font-medium">상세 경기 기록</span>
                            </div>
                        </div>
                        <button onclick="openAddMatchModal()" id="add-match-btn" class="hidden px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold rounded-xl transition-all">
                            <i class="fa-solid fa-plus mr-1"></i>경기 기록 추가
                        </button>
                    </div>
                    <div id="mwj-matches-container" class="space-y-6"></div>
                </div>
            </section>

            <!-- 3. 총겜동 섹션 -->
            <section id="section-chong" class="space-y-6 hidden">
                <div id="chong-main-view">
                    <div class="mb-6 flex justify-between items-end">
                        <div>
                            <h2 class="text-xl font-bold text-white mb-1">총겜동 컨텐츠 모음</h2>
                            <p class="text-sm text-slate-400">에피소드를 클릭하면 상세 타임라인을 볼 수 있습니다.</p>
                        </div>
                        <button onclick="openAddChongModal()" id="add-chong-btn" class="hidden px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition-all">
                            <i class="fa-solid fa-plus mr-1"></i>에피소드 추가
                        </button>
                    </div>
                    <div id="chong-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </div>

                <div id="chong-detail-view" class="space-y-6 hidden">
                    <div class="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                        <div class="flex items-center space-x-4">
                            <button onclick="closeChongDetail()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold rounded-xl transition-all">
                                <i class="fa-solid fa-arrow-left mr-1.5"></i>목록으로
                            </button>
                            <h2 id="chong-detail-title" class="text-lg font-bold text-white">총겜동 상세</h2>
                        </div>
                        <button onclick="openAddChongTimelineModal()" id="add-chong-timeline-btn" class="hidden px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition-all">
                            <i class="fa-solid fa-plus mr-1"></i>타임라인 추가
                        </button>
                    </div>
                    <div id="chong-timelines-container" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-3"></div>
                </div>
            </section>

            <!-- 4. 마크서버 섹션 -->
            <section id="section-mc" class="space-y-6 hidden">
                <div id="mc-main-view">
                    <div class="mb-6 flex justify-between items-end">
                        <div>
                            <h2 class="text-xl font-bold text-white mb-1">마크서버 길드 및 기록</h2>
                            <p class="text-sm text-slate-400">길드를 클릭하여 상세 일차별 아카이브를 확인하세요.</p>
                        </div>
                        <button onclick="openAddMcGuildModal()" id="add-mc-btn" class="hidden px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition-all">
                            <i class="fa-solid fa-plus mr-1"></i>마크 길드 추가
                        </button>
                    </div>
                    <div id="mc-guilds-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </div>

                <div id="mc-detail-view" class="space-y-6 hidden">
                    <div class="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                        <div class="flex items-center space-x-4">
                            <button onclick="closeMcDetail()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold rounded-xl transition-all">
                                <i class="fa-solid fa-arrow-left mr-1.5"></i>목록으로
                            </button>
                            <h2 id="mc-detail-title" class="text-lg font-bold text-white">마크 상세</h2>
                        </div>
                        <button onclick="openAddMcDayModal()" id="add-mc-day-btn" class="hidden px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition-all">
                            <i class="fa-solid fa-plus mr-1"></i>날짜(일차) 추가
                        </button>
                    </div>
                    <div id="mc-days-tabs" class="flex space-x-2 pb-2 overflow-x-auto custom-scrollbar"></div>
                    <div id="mc-categories-container" class="space-y-6"></div>
                </div>
            </section>

        </main>
    </div>

    <!-- 하단 푸터 -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 px-4 sm:px-6 lg:px-8 mt-12">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center text-xs text-slate-500 gap-2">
            <div>본 사이트는 비공식 정리 사이트이므로 일부 누락이나 오류가 있을 수 있습니다.</div>
            <div class="font-semibold text-slate-400">made by 윤슬ツ</div>
        </div>
    </footer>

    <!-- 게임 전적 추가 모달 -->
    <div id="add-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white"><span id="modal-game-title">VALORANT</span> 전적 추가 (관리자)</h3>
            <div class="space-y-3 text-sm">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1">유형</label>
                        <select id="m-type" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                            <option value="내전">내전</option>
                            <option value="CK">CK</option>
                            <option value="랜드">랜드</option>
                            <option value="자유입력">자유입력</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1">날짜</label>
                        <input type="text" id="m-date" placeholder="2025.11.21" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                    </div>
                </div>
                <div>
                    <label class="text-slate-400 block mb-1">밸런스 (상대 스트리머 등)</label>
                    <input type="text" id="m-balance" placeholder="예: 도현팀 vs 이상호팀" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                </div>
                <div id="m-game-specific-fields" class="space-y-3"></div>
                <div>
                    <label class="text-slate-400 block mb-1">참여 멤버 (여러 줄 입력 가능)</label>
                    <textarea id="m-members" rows="4" placeholder="도현&#10;킴성태&#10;괴물쥐..." class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5 custom-scrollbar"></textarea>
                </div>
                <div>
                    <label class="text-slate-400 block mb-1">승패 여부</label>
                    <select id="m-result" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5">
                        <option value="WIN">WIN (승리)</option>
                        <option value="LOSE">LOSE (패배)</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                <button onclick="closeAddRecordModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl transition-all text-xs">취소</button>
                <button onclick="saveNewRecord()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition-all text-xs">저장하기</button>
            </div>
        </div>
    </div>

    <!-- 스크립트 -->
    <script>
        let mockData = JSON.parse(localStorage.getItem('dohyeon_mockData')) || {
            val: [
                { id: 1, type: "CK", date: "2025.11.20", balance: "도현팀 vs 이상호팀", map: "헤이븐", agent: "제트", acs: 312, kda: "24 / 12 / 5", result: "WIN", score: "13 : 9", members: "도현\n이상호\n뜨삭\n손오봉" }
            ],
            lol: [
                { id: 1, type: "CK", date: "2025.11.19", balance: "도현스쿼드 vs 저라뎃스쿼드", position: "미드", champion: "아칼리", kda: "10 / 2 / 6", result: "WIN", members: "도현\n저라뎃\n박사장" }
            ],
            pubg: [
                { id: 1, type: "내전", date: "2025.11.17", balance: "도현스쿼드 vs 킴성태스쿼드", targetKills: "팀 40킬", memberKills: "도현: 30 (40-10)", totalScore: "1위 (65점)", result: "WIN", members: "도현\n킴성태\n싸패" }
            ]
        };

        let mwjTeams = JSON.parse(localStorage.getItem('dohyeon_mwjTeams')) || [];
        let chongEpisodes = JSON.parse(localStorage.getItem('dohyeon_chong')) || [];
        let mcGuilds = JSON.parse(localStorage.getItem('dohyeon_mc')) || [];

        let currentGameTab = 'val';
        let isAdmin = false;
        let currentSelectedTeamId = null;
        let currentSelectedChongId = null;
        let currentSelectedGuildId = null;
        let currentMcDay = '';

        function saveData() {
            localStorage.setItem('dohyeon_mockData', JSON.stringify(mockData));
            localStorage.setItem('dohyeon_mwjTeams', JSON.stringify(mwjTeams));
            localStorage.setItem('dohyeon_chong', JSON.stringify(chongEpisodes));
            localStorage.setItem('dohyeon_mc', JSON.stringify(mcGuilds));
        }

        function toggleAdminMode() {
            isAdmin = !isAdmin;
            const btn = document.getElementById('admin-mode-btn');
            const addBtn = document.getElementById('add-record-btn');
            const addMwjBtn = document.getElementById('add-mwj-btn');
            const addMatchBtn = document.getElementById('add-match-btn');
            const addChongBtn = document.getElementById('add-chong-btn');
            const addChongTimelineBtn = document.getElementById('add-chong-timeline-btn');
            const addMcBtn = document.getElementById('add-mc-btn');
            const addMcDayBtn = document.getElementById('add-mc-day-btn');

            if(isAdmin) {
                btn.className = "px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl border border-emerald-500 transition-all";
                btn.innerHTML = '<i class="fa-solid fa-unlock mr-1"></i>관리자 ON';
                if(addBtn) addBtn.classList.remove('hidden');
                if(addMwjBtn) addMwjBtn.classList.remove('hidden');
                if(addMatchBtn) addMatchBtn.classList.remove('hidden');
                if(addChongBtn) addChongBtn.classList.remove('hidden');
                if(addChongTimelineBtn) addChongTimelineBtn.classList.remove('hidden');
                if(addMcBtn) addMcBtn.classList.remove('hidden');
                if(addMcDayBtn) addMcDayBtn.classList.remove('hidden');
            } else {
                btn.className = "px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl border border-slate-700 transition-all";
                btn.innerHTML = '<i class="fa-solid fa-lock mr-1"></i>관리자 OFF';
                if(addBtn) addBtn.classList.add('hidden');
                if(addMwjBtn) addMwjBtn.classList.add('hidden');
                if(addMatchBtn) addMatchBtn.classList.add('hidden');
                if(addChongBtn) addChongBtn.classList.add('hidden');
                if(addChongTimelineBtn) addChongTimelineBtn.classList.add('hidden');
                if(addMcBtn) addMcBtn.classList.add('hidden');
                if(addMcDayBtn) addMcDayBtn.classList.add('hidden');
            }
            renderRecords();
        }

        function switchMainTab(tab) {
            ['history', 'mwj', 'chong', 'mc'].forEach(t => {
                const sec = document.getElementById(`section-${t}`);
                const navBtn = document.getElementById(`nav-btn-${t}`);
                if(sec) sec.classList.add('hidden');
                if(navBtn) navBtn.className = "px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all text-slate-400 hover:text-white whitespace-nowrap";
            });

            const targetSec = document.getElementById(`section-${tab}`);
            const targetNav = document.getElementById(`nav-btn-${tab}`);
            if(targetSec) targetSec.classList.remove('hidden');
            if(targetNav) targetNav.className = "px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all bg-indigo-600 text-white shadow-lg whitespace-nowrap";

            if(tab === 'history') renderRecords();
            if(tab === 'mwj') { document.getElementById('mwj-main-view').classList.remove('hidden'); document.getElementById('mwj-detail-view').classList.add('hidden'); }
            if(tab === 'chong') { document.getElementById('chong-main-view').classList.remove('hidden'); document.getElementById('chong-detail-view').classList.add('hidden'); }
            if(tab === 'mc') { document.getElementById('mc-main-view').classList.remove('hidden'); document.getElementById('mc-detail-view').classList.add('hidden'); }
        }

        function switchGameTab(game) {
            currentGameTab = game;
            ['val', 'lol', 'pubg'].forEach(g => {
                const btn = document.getElementById(`game-tab-${g}`);
                if(g === game) {
                    const colorMap = { val: 'bg-rose-600', lol: 'bg-indigo-600', pubg: 'bg-amber-600' };
                    btn.className = `flex-1 md:flex-none px-4 py-2 rounded-lg text-xs sm:text-sm font-bold ${colorMap[g]} text-white transition-all`;
                } else {
                    btn.className = "flex-1 md:flex-none px-4 py-2 rounded-lg text-xs sm:text-sm font-bold text-slate-400 hover:text-white transition-all";
                }
            });
            renderRecords();
        }

        function renderRecords() {
            const listEl = document.getElementById('record-list');
            const data = mockData[currentGameTab] || [];
            const filterType = document.getElementById('type-filter').value;
            const query = document.getElementById('search-input').value.toLowerCase();

            listEl.innerHTML = '';
            const filtered = data.filter(item => {
                const matchType = (filterType === 'ALL' || item.type === filterType);
                const matchQuery = !query || 
                    item.date.includes(query) || 
                    (item.balance && item.balance.toLowerCase().includes(query)) ||
                    (item.agent && item.agent.toLowerCase().includes(query)) ||
                    (item.champion && item.champion.toLowerCase().includes(query)) ||
                    (item.members && item.members.toLowerCase().includes(query));
                return matchType && matchQuery;
            });

            if(filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">기록된 전적이 없습니다. 상단 '기록 추가' 버튼을 이용하세요.</div>`;
                return;
            }

            filtered.forEach(item => {
                const isWin = item.result === 'WIN';
                const bgStyle = isWin ? 'bg-sky-950/40 border-sky-500/40' : 'bg-rose-950/30 border-rose-500/40';
                const badgeColor = isWin ? 'bg-sky-500/20 text-sky-300 border-sky-500/30' : 'bg-rose-500/20 text-rose-300 border-rose-500/30';
                const formattedMembers = item.members ? item.members.replace(/\n/g, '<br>') : '';
                
                let cardHtml = '';
                if(currentGameTab === 'val') {
                    cardHtml = `
                        <details class="group border rounded-2xl overflow-hidden transition-all shadow-md text-base ${bgStyle}">
                            <summary class="p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center cursor-pointer list-none select-none gap-3">
                                <div class="flex items-center gap-3 flex-wrap">
                                    <span class="text-xs px-2.5 py-1 rounded-lg font-bold border ${badgeColor}">${item.type}</span>
                                    <span class="text-xs text-slate-400 font-medium">${item.date}</span>
                                    <span class="text-xs bg-slate-900/60 px-2.5 py-1 rounded-lg text-slate-300 border border-slate-700/50 font-semibold">${item.balance}</span>
                                </div>
                                <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end">
                                    <div class="flex items-center gap-3 text-sm">
                                        <span class="font-bold text-white">${item.map || ''}</span>
                                        <span class="bg-slate-900/60 text-rose-300 px-2.5 py-1 rounded-lg text-xs font-semibold border border-slate-700/50">${item.agent || ''}</span>
                                        ${item.acs ? `<span class="text-xs text-amber-400 font-bold">ACS ${item.acs}</span>` : ''}
                                        <span class="text-white font-bold">${item.kda || ''}</span>
                                        <span class="text-xs text-slate-300">${item.score || ''}</span>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <span class="text-sm font-black ${isWin ? 'text-sky-400' : 'text-rose-400'}">${item.result}</span>
                                        <i class="fa-solid fa-chevron-down text-xs text-slate-400 group-open:rotate-180 transition-transform"></i>
                                    </div>
                                </div>
                            </summary>
                            <div class="px-5 py-3 border-t border-slate-800/50 bg-slate-950/60 text-xs text-slate-300 flex flex-col gap-1.5">
                                <span class="text-slate-400 font-bold">참여 멤버 전체 목록:</span>
                                <div class="text-white font-medium bg-slate-900/80 p-3 rounded-xl border border-slate-800 leading-relaxed">${formattedMembers}</div>
                            </div>
                        </details>
                    `;
                } else if(currentGameTab === 'lol') {
                    cardHtml = `
                        <details class="group border rounded-2xl overflow-hidden transition-all shadow-md text-base ${bgStyle}">
                            <summary class="p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center cursor-pointer list-none select-none gap-3">
                                <div class="flex items-center gap-3 flex-wrap">
                                    <span class="text-xs px-2.5 py-1 rounded-lg font-bold border ${badgeColor}">${item.type}</span>
                                    <span class="text-xs text-slate-400 font-medium">${item.date}</span>
                                    <span class="text-xs bg-slate-900/60 px-2.5 py-1 rounded-lg text-slate-300 border border-slate-700/50 font-semibold">${item.balance}</span>
                                </div>
                                <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end">
                                    <div class="flex items-center gap-3 text-sm">
                                        <span class="bg-slate-900/60 text-indigo-300 px-2.5 py-1 rounded-lg text-xs font-semibold border border-slate-700/50">${item.position || ''}</span>
                                        <span class="text-indigo-400 font-bold">${item.champion || ''}</span>
                                        <span class="text-white font-bold">${item.kda || ''}</span>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <span class="text-sm font-black ${isWin ? 'text-sky-400' : 'text-rose-400'}">${item.result}</span>
                                        <i class="fa-solid fa-chevron-down text-xs text-slate-400 group-open:rotate-180 transition-transform"></i>
                                    </div>
                                </div>
                            </summary>
                            <div class="px-5 py-3 border-t border-slate-800/50 bg-slate-950/60 text-xs text-slate-300 flex flex-col gap-1.5">
                                <span class="text-slate-400 font-bold">참여 멤버 전체 목록:</span>
                                <div class="text-white font-medium bg-slate-900/80 p-3 rounded-xl border border-slate-800 leading-relaxed">${formattedMembers}</div>
                            </div>
                        </details>
                    `;
                } else if(currentGameTab === 'pubg') {
                    cardHtml = `
                        <details class="group border rounded-2xl overflow-hidden transition-all shadow-md text-base ${bgStyle}">
                            <summary class="p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center cursor-pointer list-none select-none gap-3">
                                <div class="flex items-center gap-3 flex-wrap">
                                    <span class="text-xs px-2.5 py-1 rounded-lg font-bold border ${badgeColor}">${item.type}</span>
                                    <span class="text-xs text-slate-400 font-medium">${item.date}</span>
                                    <span class="text-xs bg-slate-900/60 px-2.5 py-1 rounded-lg text-slate-300 border border-slate-700/50 font-semibold">${item.balance}</span>
                                </div>
                                <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end">
                                    <div class="flex items-center gap-3 text-sm">
                                        <span class="text-amber-400 font-bold">목표: ${item.targetKills || ''}</span>
                                        <span class="text-xs text-slate-300 bg-slate-900/60 px-2.5 py-1 rounded-lg border border-slate-700/50">${item.memberKills || ''}</span>
                                        <span class="text-white font-bold">${item.totalScore || ''}</span>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <span class="text-sm font-black ${isWin ? 'text-sky-400' : 'text-rose-400'}">${item.result}</span>
                                        <i class="fa-solid fa-chevron-down text-xs text-slate-400 group-open:rotate-180 transition-transform"></i>
                                    </div>
                                </div>
                            </summary>
                            <div class="px-5 py-3 border-t border-slate-800/50 bg-slate-950/60 text-xs text-slate-300 flex flex-col gap-1.5">
                                <span class="text-slate-400 font-bold">참여 멤버 전체 목록:</span>
                                <div class="text-white font-medium bg-slate-900/80 p-3 rounded-xl border border-slate-800 leading-relaxed">${formattedMembers}</div>
                            </div>
                        </details>
                    `;
                }
                listEl.innerHTML += cardHtml;
            });
        }

        function filterRecords() { renderRecords(); }

        function openAddRecordModal() {
            document.getElementById('modal-game-title').innerText = currentGameTab.toUpperCase();
            const specificFields = document.getElementById('m-game-specific-fields');
            if(currentGameTab === 'val') {
                specificFields.innerHTML = `
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="text-slate-400 block mb-1">맵</label><input type="text" id="m-map" placeholder="헤이븐" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                        <div><label class="text-slate-400 block mb-1">요원</label><input type="text" id="m-agent" placeholder="제트" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div><label class="text-slate-400 block mb-1">ACS</label><input type="number" id="m-acs" placeholder="312" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                        <div><label class="text-slate-400 block mb-1">KDA</label><input type="text" id="m-kda" placeholder="24/12/5" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                        <div><label class="text-slate-400 block mb-1">스코어</label><input type="text" id="m-score" placeholder="13 : 9" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                    </div>
                `;
            } else if(currentGameTab === 'lol') {
                specificFields.innerHTML = `
                    <div class="grid grid-cols-3 gap-3">
                        <div><label class="text-slate-400 block mb-1">포지션</label><input type="text" id="m-pos" placeholder="미드" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                        <div><label class="text-slate-400 block mb-1">챔피언</label><input type="text" id="m-champ" placeholder="아칼리" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                        <div><label class="text-slate-400 block mb-1">KDA</label><input type="text" id="m-lol-kda" placeholder="10/2/6" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                    </div>
                `;
            } else if(currentGameTab === 'pubg') {
                specificFields.innerHTML = `
                    <div class="grid grid-cols-3 gap-3">
                        <div><label class="text-slate-400 block mb-1">목표킬</label><input type="text" id="m-target" placeholder="팀 40킬" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                        <div><label class="text-slate-400 block mb-1">멤버킬</label><input type="text" id="m-mkills" placeholder="도현: 30 (40-10)" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                        <div><label class="text-slate-400 block mb-1">순위/점수</label><input type="text" id="m-score-pubg" placeholder="1위 (65점)" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                    </div>
                `;
            }
            document.getElementById('add-modal').classList.remove('hidden');
        }

        function closeAddRecordModal() { document.getElementById('add-modal').classList.add('hidden'); }

        function saveNewRecord() {
            const type = document.getElementById('m-type').value;
            const date = document.getElementById('m-date').value || '2025.11.21';
            const balance = document.getElementById('m-balance').value || '';
            const members = document.getElementById('m-members').value || '';
            const result = document.getElementById('m-result').value;

            let newItem = { id: Date.now(), type, date, balance, members, result };

            if(currentGameTab === 'val') {
                newItem.map = document.getElementById('m-map').value || '';
                newItem.agent = document.getElementById('m-agent').value || '';
                newItem.acs = document.getElementById('m-acs').value || '';
                newItem.kda = document.getElementById('m-kda').value || '';
                newItem.score = document.getElementById('m-score').value || '';
            } else if(currentGameTab === 'lol') {
                newItem.position = document.getElementById('m-pos').value || '';
                newItem.champion = document.getElementById('m-champ').value || '';
                newItem.kda = document.getElementById('m-lol-kda').value || '';
            } else if(currentGameTab === 'pubg') {
                newItem.targetKills = document.getElementById('m-target').value || '';
                newItem.memberKills = document.getElementById('m-mkills').value || '';
                newItem.totalScore = document.getElementById('m-score-pubg').value || '';
            }

            if(!mockData[currentGameTab]) mockData[currentGameTab] = [];
            mockData[currentGameTab].unshift(newItem);
            saveData();
            renderRecords();
            closeAddRecordModal();
        }

        window.onload = () => { switchMainTab('history'); };
    </script>
</body>
</html>
