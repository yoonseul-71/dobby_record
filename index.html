<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>도현 아카이브</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --page: #f8fafc;
  --page-fg: #1e293b;
  --page-muted: #64748b;
  --surface: #ffffff;
  --panel: #ffffff;
  --line: #e2e8f0;
  --accent: #3b82f6;
  --accent-ink: #ffffff;
  --neutral-bg: #f1f5f9;
  
  --win: #2563eb;
  --win-bg: #eff6ff;
  --loss: #dc2626;
  --loss-bg: #fef2f2;

  --pink-bg: #fbcfe8;
  --pink-ink: #831843;
  --pink: #db2777;

  --yellow-bg: #fef08a;
  --yellow-ink: #713f12;
  --yellow: #ca8a04;
  --yellow-bright: #eab308;
  --yellow-dark: #b45309;

  --sky-bg: #bfdbfe;
  --sky-ink: #1e3a8a;
  --sky: #2563eb;

  --violet-bg: #e9d5ff;
  --violet-ink: #4c1d95;
  --violet-line: #7c3aed;
  --violet: #7c3aed;

  --box-pastel-violet: #f3e8ff;

  --blue-team-bg: #dbeafe;
  --blue-team-ink: #12161c;
  --red-team-bg: #fee2e2;
  --red-team-ink: #12161c;
  
  --font-body: "Noto Sans KR", system-ui, sans-serif;
  --font-title: "Gowun Dodum", sans-serif;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--page-fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; padding: 28px 16px 56px; min-width: 1200px; }

.wrap { max-width: 1090px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
a { color: inherit; text-decoration: none; }

header.top { display: flex; justify-content: space-between; align-items: flex-end; }
h1 { margin: 0; font-family: var(--font-body); font-weight: 900; font-size: 44px; line-height: 1; letter-spacing: -0.02em; text-transform: uppercase; color: #12161c; }

.nav-bar-container { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--line); flex-wrap: nowrap; gap: 10px; overflow: hidden; }
nav.bar { display: flex; align-items: flex-end; gap: 6px; padding-left: 10px; border-bottom: 0; width: 100%; overflow-x: auto; overflow-y: hidden; -ms-overflow-style: none; scrollbar-width: none; }
nav.bar::-webkit-scrollbar { display: none; width: 0; height: 0; }

nav.bar a {
  position: relative; display: inline-flex; align-items: center; padding: 8px 22px;
  border-radius: 8px 8px 0 0; font-weight: 700; font-size: 15px;
  background: var(--note); color: var(--note-ink); border: 1.5px solid var(--note-edge); border-bottom: 0;
  box-shadow: 0 -2px 5px rgba(0,0,0,0.05); transform-origin: 50% 100%; transform: rotate(var(--tilt, 0deg)) translateY(2px);
  white-space: nowrap; cursor: pointer;
}
nav.bar a::before {
  content: ""; position: absolute; top: -5px; left: 50%; width: 26px; height: 8px; margin-left: -13px;
  background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(0,0,0,0.08); border-radius: 2px; transform: rotate(-3deg);
}

nav.bar a[data-cat="record"] { --note: var(--pink-bg); --note-ink: var(--pink-ink); --note-edge: var(--pink); --tilt: -1deg; }
nav.bar a[data-cat="scrim"] { --note: var(--yellow-bg); --note-ink: var(--yellow-ink); --note-edge: var(--yellow); --tilt: 1deg; }
nav.bar a[data-cat="mc"] { --note: var(--sky-bg); --note-ink: var(--sky-ink); --note-edge: var(--sky); --tilt: -0.8deg; }
nav.bar a[data-cat="chong"] { --note: var(--violet-bg); --note-ink: var(--violet-ink); --note-edge: var(--violet-line); --tilt: 1.2deg; }

nav.bar a[aria-current="page"] {
  z-index: 1; transform: none; padding-top: 11px; padding-bottom: 9px; margin-bottom: -1px;
  border-color: var(--line); border-bottom: 1px solid var(--panel); background: var(--panel); color: var(--page-fg);
}

.panel { background: var(--panel); border-radius: 0 0 12px 12px; padding: 24px; border: 1px solid var(--line); border-top: 0; }
.block { display: flex; flex-direction: column; gap: 20px; }

.game-tabs { display: flex; gap: 8px; margin-bottom: 2px; flex-wrap: wrap; }
.game-tab-btn { font: inherit; font-size: 14px; font-weight: bold; padding: 6px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; }
.game-tab-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

.subnav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.subnav a { padding: 4px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--page-fg); font-size: 13px; cursor: pointer; }
.subnav a[aria-current="page"] { background: var(--neutral-bg); border-color: var(--accent); color: var(--page-fg); font-weight: 700; }
.subnav .n { font-weight: 600; opacity: 0.7; margin-left: 4px; }

h2 { margin: 0; font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

.stats { display: flex; gap: 32px; align-items: flex-end; flex-wrap: wrap; }
.stat .k { font-size: 12px; color: var(--page-muted); display: block; }
.stat .v { font-weight: 800; font-size: 22px; }

.toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.month { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); margin-bottom: 16px; }
.month summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: #eef3fc; color: #1a365d; font-weight: bold; flex-wrap: wrap; }
.month summary::-webkit-details-marker { display: none; }
.month .m-title { font-weight: 700; font-size: 16px; color: #2b6cb0; }
.month .m-meta { font-size: 13px; opacity: 0.8; font-weight: normal; }
.month .seg { margin-left: 10px; display: inline-flex; border: 1px solid #cbd5e0; border-radius: 999px; overflow: hidden; }
.month .seg button { font: inherit; font-size: 11px; padding: 2px 10px; border: 0; background: transparent; cursor: pointer; }
.month .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: bold; }
.month .rate-box { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.month .bar { width: 100px; height: 8px; border-radius: 4px; background: var(--loss-bg); overflow: hidden; }
.month .bar b { display: block; height: 100%; background: var(--win); }

.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; min-width: 700px; }
th, td { padding: 10px 14px; text-align: left; }
th { font-size: 12px; color: var(--page-muted); font-weight: 500; border-bottom: 1px solid var(--line); }

.record-row { border-bottom: 1px dashed #e2e8f0; }
.record-row-last-of-date { border-bottom: 2px solid #cbd5e0; }
tbody tr.detail-dropdown-row td { background: #f8fafc; border-bottom: 2px solid #cbd5e0; padding: 16px; }

tbody tr:hover:not(.detail-dropdown-row) { background: rgba(0,0,0,0.02); }
td.mono { font-weight: 500; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.pill.w { background: var(--win-bg); color: var(--win); }
.pill.l { background: var(--loss-bg); color: var(--loss); }
.pill.d { background: #e2e8f0; color: #475569; }
.pill.none { background: var(--neutral-bg); color: var(--page-muted); }

.scrim-detail-box { border: 1px solid #dcdcdc; border-radius: 8px; background: #fff; margin-bottom: 24px; overflow-x: auto; -webkit-overflow-scrolling: touch; position: relative; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
.lol-match-table { width: 100%; border-collapse: collapse; min-width: 550px; }
.lol-match-table th { padding: 10px 14px; border: 1px solid #dcdcdc; font-size: 14px; font-weight: 800; text-align: center; }
.lol-match-table td { border: 1px solid #dcdcdc; padding: 8px 12px; vertical-align: middle; font-size: 13.5px; background: #ffffff !important; }

.text-pre { white-space: pre-wrap; word-break: break-all; }
footer.bottom-footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; font-size: 11.5px; color: #8c95a1; line-height: 1.6; flex-wrap: wrap; gap: 12px; }
.footer-signature { font-weight: 700; color: #8c95a1; cursor: pointer; user-select: none; }
#admin-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #18181b; color: #fff; padding: 10px 24px; display: none; justify-content: space-between; align-items: center; z-index: 999; font-weight: bold; }
.btn-btn { font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 6px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); }
</style>
</head>
<body>

<div class="wrap">
  <header class="top"><h1>DOHYEON ARCHIVE</h1></header>
  <div class="sheet">
    <div class="nav-bar-container">
      <nav class="bar" id="mainNav">
        <a href="#record" data-cat="record">전적</a>
        <a href="#scrim" data-cat="scrim">롤 멸망전</a>
        <a href="#mc" data-cat="mc">마크서버</a>
        <a href="#chong" data-cat="chong">총겜동</a>
      </nav>
    </div>
    <div class="panel">
      <main id="view"><div style="padding: 40px; text-align: center; color: #64748b; font-weight: bold;">데이터를 불러오는 중입니다...</div></main>
    </div>
  </div>
  <footer class="bottom-footer">
    <div class="footer-notice">본 사이트는 비공식 기록으로 일부 누락이나 삭제되는 부분이 있을 수 있습니다.</div>
    <div class="footer-signature" id="signatureBtn">made by 윤슬ツ</div>
  </footer>
</div>

<div id="admin-bar">
  <span>⚡ 관리자 모드 활성화됨</span>
  <div style="display:flex; gap:8px;">
    <button onclick="backupJsonData()" style="background:#3b82f6; color:#fff; border:0; padding:6px 12px; border-radius:6px; cursor:pointer;">데이터 백업(저장)</button>
    <button onclick="logoutAdmin()">관리자 종료</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD...",
    authDomain: "dohyeon-archive.firebaseapp.com",
    databaseURL: "https://dohyeon-archive-default-rtdb.firebaseio.com",
    projectId: "dohyeon-archive"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.dbRef = db;
  window.firebaseRef = ref;
  window.firebaseSet = set;

  onValue(ref(db, 'archiveData'), (snapshot) => {
    const data = snapshot.val();
    if (data) {
      if (data.setsData && Array.isArray(data.setsData)) { setsData = data.setsData; localStorage.setItem("local_setsData", JSON.stringify(setsData)); }
      if (data.MC_SERVERS) { MC_SERVERS = data.MC_SERVERS; localStorage.setItem("local_MC_SERVERS", JSON.stringify(MC_SERVERS)); }
      if (data.CHONG_EPS) { CHONG_EPS = data.CHONG_EPS; localStorage.setItem("local_CHONG_EPS", JSON.stringify(CHONG_EPS)); }
      if (data.SCRIM_CARDS) { SCRIM_CARDS = data.SCRIM_CARDS; localStorage.setItem("local_SCRIM_CARDS", JSON.stringify(SCRIM_CARDS)); }
    }
    render();
  });
</script>

<script>
const GAME_MODES = {
  "발로란트": ["전체", "내전", "랜드", "CK"],
  "롤": ["전체", "랜드", "CK"],
  "배그": ["전체", "킬내기", "랜드", "공장"]
};

let setsData = JSON.parse(localStorage.getItem("local_setsData")) || [];
let MC_SERVERS = JSON.parse(localStorage.getItem("local_MC_SERVERS")) || [];
let CHONG_EPS = JSON.parse(localStorage.getItem("local_CHONG_EPS")) || [];
let SCRIM_CARDS = JSON.parse(localStorage.getItem("local_SCRIM_CARDS")) || [];

let isAdmin = false;
let S = { game: "발로란트", year: "전체", mode: "전체", chongSort: "old", mcSort: "old", scrimFilter: "전체", scrimSort: "old", globalMonthSort: "desc", monthOrder: {}, openRows: {} };
let initializedMonths = false;

window.addEventListener("DOMContentLoaded", () => {
  const sigBtn = document.getElementById("signatureBtn");
  let pressTimer = null;
  if (sigBtn) {
    sigBtn.addEventListener("touchstart", () => { pressTimer = setTimeout(() => { promptAdminLogin(); }, 1000); });
    sigBtn.addEventListener("touchend", () => { clearTimeout(pressTimer); });
    sigBtn.addEventListener("mousedown", () => { pressTimer = setTimeout(() => { promptAdminLogin(); }, 1000); });
    sigBtn.addEventListener("mouseup", () => { clearTimeout(pressTimer); });
  }
  if (!location.hash) location.hash = "#record";
  render();
});

function promptAdminLogin() {
  const pw = prompt("관리자 비밀코드를 입력하세요:");
  if (pw && btoa(pw) === "MTUyMDcxMQ==") {
    isAdmin = true;
    document.getElementById("admin-bar").style.display = "flex";
    alert("관리자 모드 활성화!");
    render();
  }
}
function logoutAdmin() { isAdmin = false; document.getElementById("admin-bar").style.display = "none"; render(); }
function toggleRowDetail(idx) { S.openRows[idx] = !S.openRows[idx]; render(); }

// 오리지널 풀 디자인이 적용되고 undefined 에러를 완벽 방어하는 renderRecords 함수
function renderRecords() {
  const games = ["발로란트", "롤", "배그"];
  const currentSets = Array.isArray(setsData) ? setsData : [];
  
  const yearsSet = new Set(["전체", "2024년", "2025년", "2026년"]);
  currentSets.forEach(r => { if (r && r.date && typeof r.date === 'string' && r.date.length >= 4) yearsSet.add(r.date.slice(0, 4) + "년"); });
  
  const years = Array.from(yearsSet).sort((a, b) => a === "전체" ? -1 : b === "전체" ? 1 : a.localeCompare(b));
  const currentModes = GAME_MODES[S.game] || ["전체"];

  let rows = currentSets.filter(r => r && r.game === S.game);
  if (S.year !== "전체") rows = rows.filter(r => r && r.date && r.date.startsWith(S.year.replace("년", "")));
  if (S.mode !== "전체") {
    rows = rows.filter(r => r && r.mode && (r.mode === S.mode || r.mode.startsWith(S.mode)));
  }

  const total = rows.length;
  const winCount = rows.filter(r => r && r.result === "W").length;
  const lossCount = rows.filter(r => r && r.result === "L").length;
  const winRate = (winCount + lossCount) ? Math.round((winCount / (winCount + lossCount)) * 100) : 0;
  
  const gameFilteredRows = currentSets.filter(r => r && r.game === S.game);
  const yearFilteredRows = S.year === "전체" ? gameFilteredRows : gameFilteredRows.filter(r => r && r.date && r.date.startsWith(S.year.replace("년", "")));

  const gameTabsHtml = games.map(g => `<button class="game-tab-btn" onclick="setGame('${g}')" aria-pressed="${S.game === g}">${g}</button>`).join("");
  const yearTabsHtml = years.map(y => {
    const count = y === "전체" ? gameFilteredRows.length : gameFilteredRows.filter(r => r && r.date && r.date.startsWith(y.replace("년", ""))).length;
    return `<a onclick="setYear('${y}')" ${S.year === y ? 'aria-current="page"' : ''}>${y} <span class="n">${count}</span></a>`;
  }).join("");

  const subnavHtml = currentModes.map(m => {
    const count = m === "전체" ? yearFilteredRows.length : yearFilteredRows.filter(r => r && r.mode && (r.mode === m || r.mode.startsWith(m))).length;
    return `<a onclick="setMode('${m}')" ${S.mode === m ? 'aria-current="page"' : ''}>${m} <span class="n">${count}</span></a>`;
  }).join("");

  const groups = new Map();
  rows.forEach(r => {
    const k = (r && r.date && typeof r.date === 'string') ? r.date.slice(0, 7) : '기타';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  });

  if (!initializedMonths) {
    groups.forEach((_, k) => { S.monthOrder[k] = { open: true, sort: 'desc' }; });
    initializedMonths = true;
  } else {
    groups.forEach((_, k) => { if (!S.monthOrder[k]) S.monthOrder[k] = { open: true, sort: 'desc' }; });
  }

  const sortedMonthKeys = [...groups.keys()].sort((a, b) => S.globalMonthSort === "desc" ? b.localeCompare(a) : a.localeCompare(b));

  const monthsHtml = sortedMonthKeys.map(k => {
    const list = groups.get(k) || [];
    const mState = S.monthOrder[k] || { open: true, sort: 'desc' };
    const desc = mState.sort === "desc";
    const isOpen = mState.open;
    const sorted = [...list].sort((a, b) => {
      const dA = (a && a.date) ? a.date : '';
      const dB = (b && b.date) ? b.date : '';
      return desc ? dB.localeCompare(dA) : dA.localeCompare(dB);
    });
    const mWin = sorted.filter(r => r && r.result === "W").length;
    const mLoss = sorted.filter(r => r && r.result === "L").length;
    const mRate = (mWin + mLoss) ? Math.round((mWin / (mWin + mLoss)) * 100) : 0;

    const trs = sorted.map((r, sIdx) => {
      if (!r) return '';
      const realIdx = currentSets.indexOf(r);
      const isRowOpen = !!S.openRows[realIdx];
      const arrowIcon = isRowOpen ? "∧" : "∨";
      const nextR = sorted[sIdx + 1];
      const rowClass = (!nextR || nextR.date !== r.date) ? "record-row-last-of-date" : "record-row";

      let detailHtml = '';
      if (S.game === "배그") {
        let pubgRows = Array.isArray(r.pubgRows) ? r.pubgRows : [];
        let rowsTrs = pubgRows.map(pr => `
          <tr>
            <td style="width:50%; background:#fff; padding:10px 14px; border:1px solid #dcdcdc; vertical-align:middle;" class="text-pre">${pr && pr.leftName ? pr.leftName : ''}</td>
            <td style="width:50%; background:#fff; padding:10px 14px; border:1px solid #dcdcdc; vertical-align:middle;" class="text-pre">${pr && pr.rightName ? pr.rightName : ''}</td>
          </tr>
        `).join('');

        detailHtml = `
          <div style="font-weight:bold; font-size:14px; margin-bottom:8px; color:var(--page-fg);">멤버 순수킬 기록</div>
          <div class="scrim-detail-box" style="margin-bottom:0;">
            <table class="lol-match-table"><tbody>${rowsTrs || '<tr><td colspan="2" style="text-align:center; padding:20px; color:#888;">상세 멤버 기록이 없습니다.</td></tr>'}</tbody></table>
          </div>
        `;
      }

      const vDate = (r.date && typeof r.date === 'string' && r.date.length >= 10) ? (r.date.slice(5).replace('-', '.') + ' ' + getWd(r.date)) : (r.date || '-');
      const vMode = r.mode || '-';
      const vBal = r.balance || '-';
      const vTargetKill = r.targetKill || '-';
      const vPureKill = r.pureKill || '-';

      let formattedScore = '-';
      if (r.score && String(r.score).includes(':')) {
        const parts = String(r.score).split(':').map(p => parseInt(p.trim(), 10));
        if (!isNaN(parts[0]) && !isNaN(parts[1])) {
          if (parts[0] > parts[1]) formattedScore = `<span style="color:#1d4ed8;">${parts[0]}</span>:<span style="color:#b3282d;">${parts[1]}</span>`;
          else if (parts[0] < parts[1]) formattedScore = `<span style="color:#b3282d;">${parts[0]}</span>:<span style="color:#1d4ed8;">${parts[1]}</span>`;
          else formattedScore = r.score;
        } else {
          formattedScore = r.score;
        }
      } else if (r.score) {
        formattedScore = r.score;
      }

      let resPill = `<span class="pill none">진행중</span>`;
      if (r.result === 'W') resPill = `<span class="pill w">승</span>`;
      else if (r.result === 'L') resPill = `<span class="pill l">패</span>`;

      let mainRowContent = `
        <tr class="${rowClass}">
          <td class="mono" style="cursor:pointer;" onclick="toggleRowDetail(${realIdx})"><span style="color:var(--accent);">${arrowIcon}</span> ${vDate}</td>
          <td>${vMode}</td><td>${vBal}</td><td>${vTargetKill}</td><td>${vPureKill}</td><td>${formattedScore}</td><td>${resPill}</td>
          ${isAdmin ? `<td><button class="btn-btn" style="color:red;" onclick="deleteItem('record', ${realIdx})">삭제</button></td>` : ''}
        </tr>`;

      if (isRowOpen) {
        mainRowContent += `<tr class="detail-dropdown-row"><td colspan="${isAdmin?8:7}">${detailHtml || '상세 정보 없음'}</td></tr>`;
      }
      return mainRowContent;
    }).join("");

    let theaders = `<th>날짜</th><th>종류</th><th>밸런스</th><th>목표킬</th><th>도현 순수킬</th><th>스코어</th><th>결과</th>` + (isAdmin?'<th>관리</th>':'');

    return `
      <details class="month" ${isOpen ? 'open' : ''} ontoggle="handleMonthToggle('${k}', this.open)">
        <summary>
          <span class="m-title">v ${k.replace('-', '.')}</span>
          <span class="m-meta">${sorted.length}경기 · ${mWin}승 ${mLoss}패</span>
          <span class="seg">
            <button type="button" onclick="event.stopPropagation(); setMonthOrd('${k}','asc')" aria-pressed="${!desc}">오래된순</button>
            <button type="button" onclick="event.stopPropagation(); setMonthOrd('${k}','desc')" aria-pressed="${desc}">최신순</button>
          </span>
          <div class="rate-box">
            <span class="mono">승률 <b>${mRate}%</b></span>
            <div class="bar"><b style="width:${mRate}%"></b></div>
          </div>
        </summary>
        <div class="table-wrap">
          <table>
            <thead><tr>${theaders}</tr></thead>
            <tbody>${trs}</tbody>
          </table>
        </div>
      </details>`;
  }).join("");

  return `
    <div class="block">
      <div>
        <div class="game-tabs">${gameTabsHtml}</div>
      </div>
      <div style="border-top: 1px dashed var(--line); margin: 2px 0;"></div>
      <div class="toolbar" style="align-items:center;">
        <div class="subnav" style="margin:0;">${yearTabsHtml}</div>
      </div>
      <div class="subnav" style="margin-top:-6px;">${subnavHtml}</div>
      <div class="stats" style="margin-top:10px;">
        <div class="stat"><span class="k">경기</span><span class="v">${total}</span></div>
        <div class="stat"><span class="k">승 / 패</span><span class="v">${winCount} / ${lossCount}</span></div>
        <div class="stat">
          <span class="k">승률</span>
          <div style="display:flex; align-items:center; gap:10px;">
            <span class="v">${winRate}%</span>
            <div class="bar" style="width:110px; height:8px; border-radius:4px; background:var(--loss-bg); overflow:hidden;">
              <b style="display:block; height:100%; width:${winRate}%; background:var(--win);"></b>
            </div>
          </div>
        </div>
      </div>
      ${monthsHtml || '<div style="padding:40px;text-align:center;color:#888;">전적 기록이 없습니다.</div>'}
    </div>`;
}

function setGame(g) { S.game = g; S.mode = "전체"; render(); }
function setYear(y) { S.year = y; S.mode = "전체"; render(); }
function setMode(m) { S.mode = m; render(); }
function handleMonthToggle(k, isOpen) { if (S.monthOrder[k]) S.monthOrder[k].open = isOpen; }
function setMonthOrd(k, so) { if (S.monthOrder[k]) S.monthOrder[k].sort = so; render(); }
function getWd(dateStr) {
  try {
    const d = new Date(dateStr);
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    return '(' + days[d.getDay()] + ')';
  } catch(e) { return ''; }
}

// 탭 전환 및 활성화 처리 로직이 수정된 부분
function render() {
  const hash = location.hash || "#record";
  const view = document.getElementById("view");
  if (!view) return;

  // 1. 상단 네비게이션 탭들의 활성화 상태(aria-current) 동기화
  const navLinks = document.querySelectorAll("#mainNav a");
  navLinks.forEach(link => {
    if (link.getAttribute("href") === hash) {
      link.setAttribute("aria-current", "page");
    } else {
      link.removeAttribute("aria-current");
    }
  });

  // 2. 해시에 따른 화면 렌더링 분기
  if (hash === "#record") {
    view.innerHTML = renderRecords();
  } else if (hash === "#scrim") {
    view.innerHTML = "<div style='padding:40px; text-align:center;'><h2>롤 멸망전</h2><p style='margin-top:10px; color:#64748b;'>해당 탭의 컨텐츠 영역입니다.</p></div>";
  } else if (hash === "#mc") {
    view.innerHTML = "<div style='padding:40px; text-align:center;'><h2>마크서버</h2><p style='margin-top:10px; color:#64748b;'>해당 탭의 컨텐츠 영역입니다.</p></div>";
  } else if (hash === "#chong") {
    view.innerHTML = "<div style='padding:40px; text-align:center;'><h2>총겜동</h2><p style='margin-top:10px; color:#64748b;'>해당 탭의 컨텐츠 영역입니다.</p></div>";
  } else {
    view.innerHTML = renderRecords();
  }
}

window.addEventListener("hashchange", render);
</script>
</body>
</html>
