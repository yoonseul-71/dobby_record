<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DOHYEON ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --page: #f1f3f6; --page-fg: #12161c; --page-muted: #566170;
  --panel: #ffffff; --surface: #ffffff; --surface-2: #f8fa00; --line: #dde2ea;
  --accent: #2a56d6; --accent-ink: #ffffff; --soft: #e4ebfc; --soft-ink: #1f3fa6;
  --win: #16794c; --win-bg: #dff2e6; --loss: #b3282d; --loss-bg: #fae3e3; --neutral-bg: #e6e9ee;
  --pink: #d65a9e; --pink-bg: #fbe3f0; --pink-ink: #7d1f55;
  --yellow: #d9a200; --yellow-bg: #fdf0b8; --yellow-ink: #5a4400;
  --sky: #4a9be8; --sky-bg: #dcecfd; --sky-ink: #0f4a86;
  --violet: #9b6fe0; --violet-bg: #eadfff; --violet-ink: #4a2a8c;
  --font-display: "Barlow Condensed", "Noto Sans KR", sans-serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0f1318; --page-fg: #e8ecf2; --page-muted: #9aa5b4;
    --panel: #171c23; --surface: #171c23; --surface-2: #212833; --line: #2a323e;
    --accent: #7ea3ff; --accent-ink: #0c1220; --soft: #1c2740; --soft-ink: #a9c1ff;
    --win: #5fd39a; --win-bg: #163527; --loss: #ff8a8f; --loss-bg: #3b1d20; --neutral-bg: #2a2a31;
    --pink: #ef8fc3; --pink-bg: #3a1c2d; --pink-ink: #ffd3ea;
    --yellow: #f2c744; --yellow-bg: #3b3210; --yellow-ink: #ffe9a0;
    --sky: #7bb8f5; --sky-bg: #14293f; --sky-ink: #cfe6ff;
    --violet: #bf9cff; --violet-bg: #2a1f45; --violet-ink: #e3d4ff;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--page-fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; padding: 28px 16px 56px; }

.wrap { max-width: 1090px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
a { color: inherit; text-decoration: none; }

header.top { display: flex; justify-content: space-between; align-items: flex-start; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: 1; letter-spacing: -0.01em; text-transform: uppercase; }
h1 em { font-family: var(--font-display); font-style: italic; font-weight: 800; }

/* 스티커 메모 탭 */
nav.bar { display: flex; align-items: flex-end; gap: 6px; border-bottom: 1px solid var(--line); padding-left: 10px; }
nav.bar a {
  position: relative; display: inline-flex; align-items: center; padding: 8px 22px;
  border-radius: 8px 8px 0 0; font-weight: 700; font-size: 15px;
  background: var(--note); color: var(--note-ink); border: 1px solid var(--note-edge); border-bottom: 0;
  box-shadow: 0 -2px 5px rgba(0,0,0,0.05); transform-origin: 50% 100%; transform: rotate(var(--tilt, 0deg)) translateY(2px);
}
nav.bar a::before {
  content: ""; position: absolute; top: -5px; left: 50%; width: 26px; height: 8px; margin-left: -13px;
  background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(0,0,0,0.08); border-radius: 2px; transform: rotate(-3deg);
}
nav.bar a[data-cat="record"] { --note: var(--pink-bg); --note-ink: var(--pink-ink); --note-edge: var(--pink); --tilt: -1deg; }
nav.bar a[data-cat="scrim"] { --note: var(--yellow-bg); --note-ink: var(--yellow-ink); --note-edge: var(--yellow); --tilt: 1deg; }
nav.bar a[data-cat="mc"] { --note: var(--sky-bg); --note-ink: var(--sky-ink); --note-edge: var(--sky); --tilt: -0.8deg; }
nav.bar a[data-cat="chong"] { --note: var(--violet-bg); --note-ink: var(--violet-ink); --note-edge: var(--violet); --tilt: 1.2deg; }
nav.bar a[aria-current="page"] {
  z-index: 1; transform: none; padding-top: 11px; padding-bottom: 9px; margin-bottom: -1px;
  border-color: var(--line); border-bottom: 1px solid var(--panel); background: var(--panel); color: var(--page-fg);
}

.panel { background: var(--panel); border-radius: 0 0 12px 12px; padding: 24px; border: 1px solid var(--line); border-top: 0; }
.block { display: flex; flex-direction: column; gap: 20px; }
.subnav { display: flex; gap: 8px; flex-wrap: wrap; }
.subnav a { padding: 5px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--page-fg); font-size: 13px; cursor: pointer; }
.subnav a[aria-current="page"] { background: var(--soft); border-color: var(--accent); color: var(--soft-ink); font-weight: 700; }
.subnav .n { font-family: var(--font-mono); opacity: 0.7; margin-left: 4px; }

h2 { margin: 0; font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

.stats { display: flex; gap: 32px; align-items: flex-end; }
.stat .k { font-size: 12px; color: var(--page-muted); display: block; }
.stat .v { font-family: var(--font-mono); font-size: 22px; font-weight: 700; }

.toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.filters { display: flex; gap: 6px; align-items: center; }
.chip { font: inherit; font-size: 13px; padding: 4px 14px; border-radius: 999px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); color: var(--page-fg); }
.chip[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--soft-ink); font-weight: 700; }

/* 월별 아코디언 */
.month { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); margin-bottom: 16px; }
.month summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: #eef3fc; color: #1a365d; font-weight: bold; }
.month summary::-webkit-details-marker { display: none; }
.month .m-title { font-family: var(--font-mono); font-size: 16px; color: #2b6cb0; }
.month .m-meta { font-size: 13px; opacity: 0.8; font-weight: normal; }
.month .seg { margin-left: 10px; display: inline-flex; border: 1px solid #cbd5e0; border-radius: 999px; overflow: hidden; }
.month .seg button { font: inherit; font-size: 11px; padding: 2px 10px; border: 0; background: transparent; cursor: pointer; }
.month .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: bold; }
.month .rate-box { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.month .bar { width: 100px; height: 8px; border-radius: 4px; background: var(--loss-bg); overflow: hidden; }
.month .bar b { display: block; height: 100%; background: var(--win); }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 700px; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--page-muted); font-weight: 500; }
tbody tr:hover { background: rgba(0,0,0,0.02); }
td.mono { font-family: var(--font-mono); }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.pill.w { background: var(--win-bg); color: var(--win); }
.pill.l { background: var(--loss-bg); color: var(--loss); }

/* 카드 스타일 */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 15px; }
.card { display: flex; flex-direction: column; justify-content: space-between; gap: 12px; min-height: 140px; padding: 20px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; text-decoration: none; color: var(--page-fg); transition: border-color 0.15s, transform 0.15s; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); }

.card-mc .server-name { font-size: 18px; font-weight: 800; color: #000; }
.card-mc .guild-name { font-size: 13px; font-weight: 500; color: var(--sky); margin-top: 2px; }
.card-more { align-self: flex-end; font-size: 12px; color: var(--page-muted); font-weight: 500; }

.card-chong .ep-no { font-family: var(--font-display); font-weight: 800; font-size: 32px; color: var(--violet); line-height: 1; }
.card-chong .ep-title { font-size: 18px; font-weight: 700; color: #000; }

.card-scrim .scrim-no { font-family: var(--font-display); font-weight: 800; font-size: 32px; color: var(--yellow); line-height: 1; }
.card-scrim .scrim-title { font-size: 18px; font-weight: 700; color: #000; }

/* 상세페이지 레이아웃 */
.ep-detail-wrap { display: flex; flex-direction: column; gap: 20px; margin-top: 15px; }
.ep-box { border: 1px solid var(--line); border-radius: 12px; padding: 20px; background: var(--surface); }
.ep-box-title { font-size: 15px; font-weight: bold; color: var(--page-fg); margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }

/* 타임라인 (동그라미 제거, 링크 화살표 뒤로) */
.timeline-clean { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.timeline-clean li { font-size: 14px; }
.timeline-clean a { color: var(--accent); text-decoration: none; font-weight: 500; }
.timeline-clean a:hover { text-decoration: underline; }

.back-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--page-muted); margin-bottom: 10px; cursor: pointer; text-decoration: none; }
.back-btn:hover { color: var(--page-fg); }

/* 일별 탭 (마크서버 용) */
.day-tabs { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
.day-tab-btn { padding: 6px 14px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); font-weight: bold; cursor: pointer; font-size: 13px; }
.day-tab-btn[aria-selected="true"] { background: var(--sky-bg); border-color: var(--sky); color: var(--sky-ink); }

/* 배그 팀별 멤버 표 */
.pubg-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.pubg-table th, .pubg-table td { border: 1px solid var(--line); padding: 8px; text-align: center; font-size: 13px; }
.pubg-table th { background: #eef3fc; }

/* 모달 */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
.modal { background: var(--panel); border-radius: 12px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 1px solid var(--line); }
.modal h3 { margin-top: 0; font-size: 20px; border-bottom: 1px solid var(--line); padding-bottom: 10px; display: flex; justify-content: space-between; }
.modal .close-btn { cursor: pointer; border: 0; background: transparent; font-size: 20px; }
.detail-sec { margin-bottom: 16px; }
.detail-sec label { font-size: 12px; color: var(--page-muted); font-weight: bold; display: block; margin-bottom: 4px; }
.detail-sec .val { font-size: 14px; white-space: pre-wrap; line-height: 1.6; }

.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; font: inherit; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--page-fg); }

/* 관리자 바 */
#admin-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #18181b; color: #fff; padding: 10px 24px; display: none; justify-content: space-between; align-items: center; z-index: 999; font-weight: bold; }
#admin-bar button { background: #ef4444; color: #fff; border: 0; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
.btn-btn { font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 6px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); }
.btn-accent { background: var(--accent); color: #fff; border: 0; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>DOHYEON <em>ARCHIVE</em></h1>
  </header>

  <div class="sheet">
    <nav class="bar" id="mainNav">
      <a href="#record" data-cat="record">전적</a>
      <a href="#scrim" data-cat="scrim">롤 멸망전</a>
      <a href="#mc" data-cat="mc">마크서버</a>
      <a href="#chong" data-cat="chong">총겜동</a>
    </nav>
    <div class="panel">
      <main id="view"></main>
    </div>
  </div>
</div>

<!-- 관리자 상태바 -->
<div id="admin-bar">
  <span>⚡ 관리자 모드 활성화 (Alt+A)</span>
  <button onclick="logoutAdmin()">관리자 종료</button>
</div>

<!-- 상세보기 모달 -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <h3><span id="mTitle">전적 상세 정보</span><button class="close-btn" onclick="closeModal('detailModal')">✕</button></h3>
    <div id="modalContent"></div>
  </div>
</div>

<!-- 전적 추가/수정 모달 -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <h3><span id="formTitle">전적 추가</span><button class="close-btn" onclick="closeModal('formModal')">✕</button></h3>
    <form id="recordForm" onsubmit="saveRecord(event)">
      <input type="hidden" id="editIdx" value="-1">
      <div class="form-group"><label>날짜 (YYYY-MM-DD)</label><input type="text" id="fDate" required placeholder="2026-05-23"></div>
      <div class="form-group"><label>게임</label>
        <select id="fGame" onchange="toggleFormFields()"><option value="발로란트">발로란트</option><option value="롤">롤</option><option value="배그">배그</option></select>
      </div>
      <div class="form-group"><label>종류</label>
        <select id="fMode">
          <option value="내전">내전</option>
          <option value="랜드">랜드</option>
          <option value="CK">CK</option>
          <option value="킬내기">킬내기</option>
          <option value="공장">공장</option>
        </select>
      </div>
      <div class="form-group"><label>밸런스 (상대 스트리머 이름 등)</label><input type="text" id="fBalance" placeholder="상대 스트리머 / 밸런스"></div>
      <div class="form-group"><label>세트</label><input type="text" id="fSet" required placeholder="1세트"></div>
      
      <!-- 발로란트 전용 -->
      <div id="valoFields">
        <div class="form-group"><label>맵</label><input type="text" id="fMap" placeholder="어센트 등"></div>
        <div class="form-group"><label>요원</label><input type="text" id="fAgent" placeholder="제트 등"></div>
        <div class="form-group"><label>ACS (선택사항, 입력 시 표출)</label><input type="text" id="fAcs" placeholder="예: 285"></div>
      </div>

      <!-- 롤 전용 -->
      <div id="lolFields" style="display:none;">
        <div class="form-group"><label>챔피언</label><input type="text" id="fChamp" placeholder="아리 등"></div>
      </div>

      <div class="form-group"><label>KDA (발로/롤 공용)</label><input type="text" id="fKda" placeholder="예: 12/3/5"></div>

      <!-- 배그 전용 -->
      <div id="pubgFields" style="display:none;">
        <div class="form-group"><label>도현 순수킬</label><input type="text" id="fDohyeonKills" placeholder="예: 7"></div>
        <div class="form-group">
          <label><input type="checkbox" id="fShowTeamKills"> 팀원 순수킬 작성 및 상세 표출 활성화</label>
        </div>
      </div>

      <div class="form-group"><label>결과</label>
        <select id="fResult"><option value="W">승</option><option value="L">패</option></select>
      </div>

      <hr style="margin: 15px 0; border:0; border-top:1px solid var(--line);">
      
      <div class="form-group">
        <label>전체 멤버 상세 목록 (엔터/줄바꿈 가능)</label>
        <textarea id="fAllMembersText" rows="4" placeholder="줄바꿈으로 입력하면 상세 모달에서 그대로 표시됩니다."></textarea>
      </div>

      <div class="form-group">
        <label>배그 3:3 ~ 8:8 상세 팀 표 (형식: 팀명 | 멤버1, 멤버2(순수킬) | 멤버3...)</label>
        <textarea id="fPubgTableText" rows="3" placeholder="A팀 | 도현(5), 멤버A(3), 멤버B(2)&#10;B팀 | 상대A(1), 상대B(0)"></textarea>
      </div>

      <button type="submit" class="btn-accent" style="width:100%; margin-top:10px;">저장하기</button>
    </form>
  </div>
</div>

<script>
const GAME_MODES = {
  "발로란트": ["전체", "내전", "랜드", "CK"],
  "롤": ["전체", "랜드", "CK"],
  "배그": ["전체", "킬내기", "랜드", "공장"]
};

const DEFAULT_SETS = [
  {
    date: "2026-05-23", game: "발로란트", mode: "내전", balance: "상대A", set: "1세트",
    map: "어센트", agent: "제트", acs: "310", kda: "22/8/4", result: "W",
    allMembersText: "도현(제트)\n멤버1(소바)\n멤버2(케이오)\n멤버3(페이드)\n멤버4(킬조이)"
  },
  {
    date: "2026-10-24", game: "롤", mode: "랜드", balance: "상대B", set: "1세트",
    champ: "아리", kda: "8/2/11", result: "W",
    allMembersText: "도현(아리)\n멤버A(그웬)\n멤버B(리신)\n멤버C(자야)\n멤버D(레오나)"
  },
  {
    date: "2026-09-12", game: "배그", mode: "킬내기", balance: "상대C", set: "1세트",
    dohyeonKills: "7", showTeamKills: true, result: "W",
    allMembersText: "도현 팀 vs 상대 팀 4:4 킬내기",
    pubgTableText: "도현 팀 | 도현 7(10-3), 멤버A 4(5-1), 멤버B 2, 멤버C 1\n상대 팀 | 상대1 3, 상대2 2, 상대3 1, 상대4 0"
  }
];

const MC_SERVERS = [
  { 
    id: "mc-1", serverName: "코창서버", guildName: "코창길드", 
    days: [
      { 
        date: "2025-05-10 (1일차)", 
        sections: [
          { title: "모험 및 탐색", timelines: [{text: "서버 첫 입장 및 스폰 지역 확인", url: "https://youtube.com"}, {text: "마을 주변 지형 정찰", url: ""}] },
          { title: "광질 및 파밍", timelines: [{text: "동굴 진입하여 철 광석 채굴", url: ""}] }
        ] 
      }
    ]
  }
];

const CHONG_EPS = [
  { ep: 0, title: "프롤로그", desc: "총겜동의 시작을 알린 첫 방송.", timeline: [{text: "오프닝", url: "https://youtube.com"}, {text: "동아리 소개", url: "https://youtube.com"}] },
  { ep: 1, title: "첫 정기전", desc: "첫 번째 공식 정기전 매치입니다.", timeline: [{text: "오프닝 및 팀 구성", url: "https://youtube.com"}] }
];

const SCRIM_CARDS = [
  {
    id: "do2",
    no: "DO2",
    title: "도이온2 멸망전",
    desc: "도이온2 팀 멸망전 스크림 및 대회 전적 기록",
    data: [
      { date: "2025-11-15", type: "스크림", title: "스크림 1일차", result: "1승 2패", note: "라인전 우세 및 한타 점검" },
      { date: "2025-12-06", type: "대회", title: "멸망전 본선 1일차", result: "2승 0패", note: "깔끔한 2:0 승리" }
    ]
  }
];

let setsData = JSON.parse(localStorage.getItem("dohyeon_sets")) || DEFAULT_SETS;
function saveSets() { localStorage.setItem("dohyeon_sets", JSON.stringify(setsData)); }

let isAdmin = false;
let S = { game: "발로란트", mode: "전체", scrimSortNewest: true, monthOrder: {} };

window.addEventListener("keydown", e => {
  if (e.altKey && e.code === "KeyA") {
    e.preventDefault();
    const pw = prompt("관리자 비밀코드를 입력하세요:");
    if (pw === "1520711") {
      isAdmin = true;
      document.getElementById("admin-bar").style.display = "flex";
      alert("관리자 모드가 활성화되었습니다!");
      render();
    } else if (pw !== null) {
      alert("비밀코드가 올바르지 않습니다.");
    }
  }
});

function logoutAdmin() {
  isAdmin = false;
  document.getElementById("admin-bar").style.display = "none";
  render();
}

function closeModal(id) { document.getElementById(id).style.display = "none"; }

function openDetail(idx) {
  const r = setsData[idx];
  let pubgTableHtml = "";

  if (r.game === "배그" && r.pubgTableText) {
    const lines = r.pubgTableText.split("\n").filter(Boolean);
    pubgTableHtml = `
      <div class="detail-sec"><label>⚔️ 팀별 멤버 및 순수킬 표</label>
        <table class="pubg-table">
          <thead><tr><th>팀명</th><th>멤버 명단 ${r.showTeamKills ? '(순수킬)' : ''}</th></tr></thead>
          <tbody>
            ${lines.map(line => {
              const parts = line.split("|");
              const tName = parts[0] ? parts[0].trim() : "팀";
              const tMems = parts[1] ? parts[1].trim() : "";
              return `<tr><td><b>${tName}</b></td><td>${tMems}</td></tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  }

  document.getElementById("mTitle").textContent = `${r.date} ${r.game} (${r.set})`;
  document.getElementById("modalContent").innerHTML = `
    <div class="detail-sec"><label>종류 / 밸런스 / 결과</label><div class="val">${r.mode} · 밸런스: ${r.balance || '-'} · <span class="pill ${r.result==='W'?'w':'l'}">${r.result==='W'?'승리':'패배'}</span></div></div>
    ${r.allMembersText ? `<div class="detail-sec"><label>👥 전체 멤버 목록</label><div class="val">${r.allMembersText}</div></div>` : ''}
    ${pubgTableHtml}
  `;
  document.getElementById("detailModal").style.display = "flex";
}

function toggleFormFields() {
  const g = document.getElementById("fGame").value;
  document.getElementById("valoFields").style.display = g === "발로란트" ? "block" : "none";
  document.getElementById("lolFields").style.display = g === "롤" ? "block" : "none";
  document.getElementById("pubgFields").style.display = g === "배그" ? "block" : "none";
}

function openForm(idx = -1) {
  document.getElementById("editIdx").value = idx;
  if (idx === -1) {
    document.getElementById("formTitle").textContent = "전적 추가";
    document.getElementById("recordForm").reset();
  } else {
    document.getElementById("formTitle").textContent = "전적 수정";
    const r = setsData[idx];
    document.getElementById("fDate").value = r.date;
    document.getElementById("fGame").value = r.game;
    document.getElementById("fMode").value = r.mode;
    document.getElementById("fBalance").value = r.balance || "";
    document.getElementById("fSet").value = r.set;
    document.getElementById("fMap").value = r.map || "";
    document.getElementById("fAgent").value = r.agent || "";
    document.getElementById("fAcs").value = r.acs || "";
    document.getElementById("fChamp").value = r.champ || "";
    document.getElementById("fKda").value = r.kda || "";
    document.getElementById("fDohyeonKills").value = r.dohyeonKills || "";
    document.getElementById("fShowTeamKills").checked = !!r.showTeamKills;
    document.getElementById("fResult").value = r.result;
    document.getElementById("fAllMembersText").value = r.allMembersText || "";
    document.getElementById("fPubgTableText").value = r.pubgTableText || "";
  }
  toggleFormFields();
  document.getElementById("formModal").style.display = "flex";
}

function saveRecord(e) {
  e.preventDefault();
  const idx = parseInt(document.getElementById("editIdx").value);
  const game = document.getElementById("fGame").value;

  const item = {
    date: document.getElementById("fDate").value,
    game: game,
    mode: document.getElementById("fMode").value,
    balance: document.getElementById("fBalance").value,
    set: document.getElementById("fSet").value,
    map: game === "발로란트" ? document.getElementById("fMap").value : "",
    agent: game === "발로란트" ? document.getElementById("fAgent").value : "",
    acs: game === "발로란트" ? document.getElementById("fAcs").value : "",
    champ: game === "롤" ? document.getElementById("fChamp").value : "",
    kda: document.getElementById("fKda").value,
    dohyeonKills: game === "배그" ? document.getElementById("fDohyeonKills").value : "",
    showTeamKills: game === "배그" ? document.getElementById("fShowTeamKills").checked : false,
    result: document.getElementById("fResult").value,
    allMembersText: document.getElementById("fAllMembersText").value,
    pubgTableText: document.getElementById("fPubgTableText").value
  };

  if (idx === -1) setsData.push(item);
  else setsData[idx] = item;

  saveSets();
  closeModal("formModal");
  render();
}

function deleteRecord(idx) {
  if (confirm("정말 이 전적을 삭제하시겠습니까?")) {
    setsData.splice(idx, 1);
    saveSets();
    render();
  }
}

// 전적 페이지 (게임별 순서 엄수)
function renderRecords() {
  const games = ["발로란트", "롤", "배그"];
  const currentModes = GAME_MODES[S.game] || ["전체"];

  let rows = setsData.filter(r => r.game === S.game);
  if (S.mode !== "전체") rows = rows.filter(r => r.mode === S.mode);

  const total = rows.length;
  const winCount = rows.filter(r => r.result === "W").length;
  const lossCount = total - winCount;
  const winRate = total ? Math.round((winCount / total) * 100) : 0;
  const allGameRows = setsData.filter(r => r.game === S.game);

  const subnavHtml = currentModes.map(m => {
    const count = m === "전체" ? allGameRows.length : allGameRows.filter(r => r.mode === m).length;
    return `<a onclick="setMode('${m}')" ${S.mode === m ? 'aria-current="page"' : ''}>${m} <span class="n">${count}</span></a>`;
  }).join("");

  const hasAcs = S.game === "발로란트" && rows.some(r => r.acs && r.acs.trim() !== "");

  const groups = new Map();
  rows.forEach(r => {
    const k = r.date.slice(0, 7);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  });

  const monthsHtml = [...groups.entries()].map(([k, list]) => {
    const desc = S.monthOrder[k] === "desc";
    const sorted = [...list].sort((a, b) => desc ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));
    const mWin = sorted.filter(r => r.result === "W").length;
    const mRate = Math.round((mWin / sorted.length) * 100);

    const trs = sorted.map(r => {
      const realIdx = setsData.indexOf(r);
      
      // 발로란트: 날짜 / 종류 / 밸런스 / 세트 / 맵 / 요원 / ACS(선택) / KDA / 결과
      if (S.game === "발로란트") {
        return `
          <tr>
            <td class="mono">${r.date.slice(5).replace('-', '.')} ${getWd(r.date)}</td>
            <td>${r.mode}</td>
            <td>${r.balance || '-'}</td>
            <td><a href="javascript:void(0)" onclick="openDetail(${realIdx})" style="font-weight:bold;color:var(--accent);">${r.set}</a></td>
            <td>${r.map || '-'}</td>
            <td>${r.agent || '-'}</td>
            ${hasAcs ? `<td>${r.acs || '-'}</td>` : ''}
            <td>${r.kda || '-'}</td>
            <td><span class="pill ${r.result === 'W' ? 'w' : 'l'}">${r.result === 'W' ? '승' : '패'}</span></td>
            ${isAdmin ? `<td><button class="btn-btn" onclick="openForm(${realIdx})">수정</button> <button class="btn-btn" style="color:red;" onclick="deleteRecord(${realIdx})">삭제</button></td>` : ''}
          </tr>`;
      }
      
      // 롤: 날짜 / 종류 / 밸런스 / 세트 / 챔피언 / KDA / 결과
      if (S.game === "롤") {
        return `
          <tr>
            <td class="mono">${r.date.slice(5).replace('-', '.')} ${getWd(r.date)}</td>
            <td>${r.mode}</td>
            <td>${r.balance || '-'}</td>
            <td><a href="javascript:void(0)" onclick="openDetail(${realIdx})" style="font-weight:bold;color:var(--accent);">${r.set}</a></td>
            <td>${r.champ || '-'}</td>
            <td>${r.kda || '-'}</td>
            <td><span class="pill ${r.result === 'W' ? 'w' : 'l'}">${r.result === 'W' ? '승' : '패'}</span></td>
            ${isAdmin ? `<td><button class="btn-btn" onclick="openForm(${realIdx})">수정</button> <button class="btn-btn" style="color:red;" onclick="deleteRecord(${realIdx})">삭제</button></td>` : ''}
          </tr>`;
      }

      // 배그: 날짜 / 종류 / 밸런스 / 도현 순수킬 / 결과
      return `
        <tr>
          <td class="mono">${r.date.slice(5).replace('-', '.')} ${getWd(r.date)}</td>
          <td>${r.mode}</td>
          <td>${r.balance || '-'}</td>
          <td><a href="javascript:void(0)" onclick="openDetail(${realIdx})" style="font-weight:bold;color:var(--accent);">${r.dohyeonKills ? r.dohyeonKills + '킬' : '-'} (${r.set})</a></td>
          <td><span class="pill ${r.result === 'W' ? 'w' : 'l'}">${r.result === 'W' ? '승' : '패'}</span></td>
          ${isAdmin ? `<td><button class="btn-btn" onclick="openForm(${realIdx})">수정</button> <button class="btn-btn" style="color:red;" onclick="deleteRecord(${realIdx})">삭제</button></td>` : ''}
        </tr>`;
    }).join("");

    let thHtml = "";
    if (S.game === "발로란트") {
      thHtml = `<th>날짜</th><th>종류</th><th>밸런스</th><th>세트</th><th>맵</th><th>요원</th>${hasAcs ? '<th>ACS</th>' : ''}<th>KDA</th><th>결과</th>`;
    } else if (S.game === "롤") {
      thHtml = `<th>날짜</th><th>종류</th><th>밸런스</th><th>세트</th><th>챔피언</th><th>KDA</th><th>결과</th>`;
    } else {
      thHtml = `<th>날짜</th><th>종류</th><th>밸런스</th><th>도현 순수킬</th><th>결과</th>`;
    }
    if (isAdmin) thHtml += `<th>관리</th>`;

    return `
      <details class="month" open>
        <summary>
          <span class="m-title">v ${k.replace('-', '.')}</span>
          <span class="m-meta">${sorted.length}세트 · ${mWin}승 ${sorted.length - mWin}패</span>
          <span class="seg">
            <button type="button" onclick="setMonthOrd('${k}','desc')" aria-pressed="${desc}">최신순</button>
            <button type="button" onclick="setMonthOrd('${k}','asc')" aria-pressed="${!desc}">오래된순</button>
          </span>
          <div class="rate-box">
            <span class="mono">승률 <b>${mRate}%</b></span>
            <div class="bar"><b style="width:${mRate}%"></b></div>
          </div>
        </summary>
        <div class="table-wrap">
          <table>
            <thead><tr>${thHtml}</tr></thead>
            <tbody>${trs}</tbody>
          </table>
        </div>
      </details>`;
  }).join("");

  return `
    <div class="block">
      <div class="subnav">${subnavHtml}</div>
      <h2>전체 전적</h2>
      <div class="stats">
        <div class="stat"><span class="k">세트</span><span class="v">${total}</span></div>
        <div class="stat"><span class="k">승 / 패</span><span class="v">${winCount} / ${lossCount}</span></div>
        <div class="stat"><span class="k">승률</span><span class="v">${winRate}%</span></div>
      </div>
      <div class="toolbar">
        <div class="filters">
          ${games.map(g=>`<button class="chip" onclick="setGame('${g}')" aria-pressed="${S.game===g}">${g}</button>`).join('')}
        </div>
        ${isAdmin ? `<button class="btn-accent" onclick="openForm()">+ 새 전적 추가</button>` : ''}
      </div>
      ${monthsHtml || '<div style="padding:40px;text-align:center;color:#888;">전적 기록이 없습니다.</div>'}
    </div>`;
}

// 롤 멸망전 탭 (마크/총겜동처럼 카드 탭 클릭 후 상세 진입)
function renderScrims(subId) {
  if (subId) {
    const card = SCRIM_CARDS.find(c => c.id === subId) || SCRIM_CARDS[0];
    let dataList = [...card.data];
    dataList.sort((a, b) => S.scrimSortNewest ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));

    return `
      <div class="block">
        <a class="back-btn" onclick="location.hash='#scrim'">← 멸망전 목록으로</a>
        <h2>${card.title} 상세 전적</h2>
        <div class="toolbar" style="margin-bottom:10px;">
          <span>총 ${dataList.length}개 경기 기록</span>
          <button class="chip" onclick="toggleScrimSort()">${S.scrimSortNewest ? '최신순 정렬' : '오래된순 정렬'}</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>날짜</th><th>구분</th><th>경기 타이틀</th><th>결과</th><th>비고</th></tr></thead>
            <tbody>
              ${dataList.map(d => `
                <tr>
                  <td class="mono">${d.date}</td>
                  <td><b>${d.type}</b></td>
                  <td>${d.title}</td>
                  <td><span class="pill w">${d.result}</span></td>
                  <td>${d.note}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  }

  return `
    <div class="block">
      <h2>롤 멸망전</h2>
      <div class="cards">
        ${SCRIM_CARDS.map(c => `
          <a class="card card-scrim" href="#scrim-${c.id}">
            <div>
              <div class="scrim-no">${c.no}</div>
              <div class="scrim-title">${c.title}</div>
              <div style="font-size:12px; color:var(--page-muted); margin-top:4px;">${c.desc}</div>
            </div>
            <div class="card-more">상세보기 →</div>
          </a>
        `).join('')}
      </div>
    </div>`;
}

// 마크서버 탭
function renderMinecraft(subId, dayIndex = 0) {
  if (subId) {
    const srv = MC_SERVERS.find(s => s.id === subId) || MC_SERVERS[0];
    const curDay = srv.days[dayIndex] || srv.days[0];

    return `
      <div class="block">
        <a class="back-btn" onclick="location.hash='#mc'">← 마크서버 목록으로</a>
        <h2>${srv.serverName} (${srv.guildName}) 모험 일지</h2>
        
        <div class="day-tabs">
          ${srv.days.map((d, idx) => `
            <button class="day-tab-btn" onclick="location.hash='#mc-${srv.id}-d${idx}'" ${idx === dayIndex ? 'aria-selected="true"' : ''}>
              ${d.date}
            </button>
          `).join('')}
        </div>

        <div class="ep-detail-wrap">
          ${curDay.sections.map(sec => `
            <div class="ep-box">
              <div class="ep-box-title">${sec.title}</div>
              <ul class="timeline-clean">
                ${sec.timelines.map(item => `
                  <li>
                    ${item.url ? `<a href="${item.url}" target="_blank">${item.text} ↗</a>` : `<span>${item.text}</span>`}
                  </li>
                `).join('')}
              </ul>
            </div>
          `).join('')}
        </div>
      </div>`;
  }

  return `
    <div class="block">
      <h2>마크서버</h2>
      <div class="cards">
        ${MC_SERVERS.map(s => `
          <a class="card card-mc" href="#mc-${s.id}-d0">
            <div>
              <div class="server-name">${s.serverName}</div>
              <div class="guild-name">${s.guildName}</div>
            </div>
            <div class="card-more">상세보기 →</div>
          </a>
        `).join('')}
      </div>
    </div>`;
}

// 총겜동 탭 (undefined 수정완료)
function renderChong(subEp) {
  if (subEp !== null && subEp !== undefined && subEp !== "") {
    const epIdx = CHONG_EPS.findIndex(e => e.ep === parseInt(subEp));
    const epObj = CHONG_EPS[epIdx] || CHONG_EPS[0];

    return `
      <div class="block">
        <a class="back-btn" onclick="location.hash='#chong'">← 총겜동 목록으로</a>
        <div>
          <h2>EP.${epObj.ep} ${epObj.title}</h2>
          <p style="font-size:13px; color:var(--page-muted); margin:4px 0 0 0;">${epObj.desc}</p>
        </div>

        <div class="ep-detail-wrap">
          <div class="ep-box">
            <div class="ep-box-title">방송 타임라인</div>
            <ul class="timeline-clean">
              ${epObj.timeline.map(item => `
                <li>
                  ${item.url ? `<a href="${item.url}" target="_blank">${item.text} ↗</a>` : `<span>${item.text}</span>`}
                </li>
              `).join('')}
            </ul>
          </div>
        </div>
      </div>`;
  }

  return `
    <div class="block">
      <h2>총겜동</h2>
      <div class="cards">
        ${CHONG_EPS.map(e => `
          <a class="card card-chong" href="#chong-ep${e.ep}">
            <div>
              <div class="ep-no">EP.${e.ep}</div>
              <div class="ep-title">${e.title}</div>
            </div>
            <div class="card-more">EP.${e.ep} 보기 →</div>
          </a>
        `).join('')}
      </div>
    </div>`;
}

function getWd(d) {
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return days[new Date(d).getDay()];
}

function setGame(g) { S.game = g; S.mode = "전체"; render(); }
function setMode(m) { S.mode = m; render(); }
function toggleScrimSort() { S.scrimSortNewest = !S.scrimSortNewest; render(); }
function setMonthOrd(k, ord) { S.monthOrder[k] = ord; render(); }

function render() {
  const hash = location.hash.slice(1) || "record";
  const cat = hash.split("-")[0];

  document.querySelectorAll("#mainNav a").forEach(a => {
    if (a.dataset.cat === cat) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });

  const view = document.getElementById("view");

  if (cat === "record") {
    view.innerHTML = renderRecords();
  } else if (cat === "scrim") {
    const match = hash.match(/^scrim-(.+)$/);
    view.innerHTML = renderScrims(match ? match[1] : null);
  } else if (cat === "mc") {
    const match = hash.match(/^mc-([a-z0-9-]+)-d(\d+)$/);
    if (match) {
      view.innerHTML = renderMinecraft(match[1], parseInt(match[2]));
    } else {
      const sId = hash.startsWith("mc-") ? hash : null;
      view.innerHTML = renderMinecraft(sId, 0);
    }
  } else if (cat === "chong") {
    const epMatch = hash.match(/^chong-ep(\d+)$/);
    view.innerHTML = renderChong(epMatch ? epMatch[1] : null);
  } else {
    view.innerHTML = renderRecords();
  }
}

window.addEventListener("hashchange", render);
render();
</script>
