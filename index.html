<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOHYEON ARCHIVE - 도현 기록 모음</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-base">

    <div>
        <!-- 상단 헤더 -->
        <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex flex-col md:flex-row items-center justify-between gap-3 py-2 md:py-0">
                <div class="flex items-center space-x-3">
                    <div class="bg-amber-500/10 border border-amber-500/30 p-2.5 rounded-xl text-amber-400">
                        <i class="fa-solid fa-trophy text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-lg sm:text-xl font-black tracking-tight text-white flex items-center gap-2">
                            DOHYEON ARCHIVE
                        </h1>
                        <p class="text-xs text-slate-400 font-medium">도현 기록 모음</p>
                    </div>
                </div>

                <!-- 상단 탭 4개 -->
                <div class="flex items-center space-x-3">
                    <nav id="main-nav-tabs" class="flex space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800 overflow-x-auto max-w-full custom-scrollbar">
                        <button onclick="switchMainTab('history')" id="nav-btn-history" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all bg-indigo-600 text-white shadow-lg whitespace-nowrap">게임 전적</button>
                        <button onclick="switchMainTab('mwj')" id="nav-btn-mwj" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all text-slate-400 hover:text-white whitespace-nowrap">롤 멸망전</button>
                        <button onclick="switchMainTab('chong')" id="nav-btn-chong" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all text-slate-400 hover:text-white whitespace-nowrap">총겜동</button>
                        <button onclick="switchMainTab('mc')" id="nav-btn-mc" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all text-slate-400 hover:text-white whitespace-nowrap">마크서버</button>
                    </nav>
                    <button onclick="toggleAdminMode()" id="admin-mode-btn" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl border border-slate-700 transition-all whitespace-nowrap">
                        <i class="fa-solid fa-lock mr-1"></i>관리자 OFF
                    </button>
                </div>
            </div>
        </header>

        <!-- 메인 컨텐츠 영역 -->
        <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

            <!-- 1. 게임 전적 섹션 -->
            <section id="section-history" class="space-y-6">
                <div class="bg-slate-900/80 backdrop-blur border border-slate-800 p-4 rounded-2xl flex flex-col gap-4 shadow-xl">
                    <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
                        <div class="flex space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800 w-full md:w-auto">
                            <button id="game-tab-val" onclick="switchGameTab('val')" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-xs sm:text-sm font-bold bg-rose-600 text-white transition-all">VALORANT</button>
                            <button id="game-tab-lol" onclick="switchGameTab('lol')" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-xs sm:text-sm font-bold text-slate-400 hover:text-white transition-all">LEAGUE OF LEGENDS</button>
                            <button id="game-tab-pubg" onclick="switchGameTab('pubg')" class="flex-1 md:flex-none px-4 py-2 rounded-lg text-xs sm:text-sm font-bold text-slate-400 hover:text-white transition-all">PUBG</button>
                        </div>
                        <div class="flex gap-2 w-full md:w-auto">
                            <button onclick="openAddRecordModal()" id="add-record-btn" class="hidden px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition-all flex items-center gap-1 whitespace-nowrap">
                                <i class="fa-solid fa-plus"></i> 기록 추가
                            </button>
                            <div class="relative flex-1 md:w-64">
                                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                                <input type="text" id="search-input" onkeyup="filterRecords()" placeholder="스트리머, 챔프/요원, 날짜..." class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-sm rounded-xl pl-9 pr-4 py-2 outline-none focus:border-indigo-500">
                            </div>
                        </div>
                    </div>
                </div>
                <div id="record-list" class="space-y-3"></div>
            </section>

            <!-- 2. 롤 멸망전 섹션 -->
            <section id="section-mwj" class="space-y-6 hidden">
                <div id="mwj-main-view">
                    <div class="mb-6 flex justify-between items-end">
                        <div>
                            <h2 class="text-xl font-bold text-white mb-1">참여 멸망전 목록</h2>
                            <p class="text-sm text-slate-400">팀 카드를 클릭하면 상세 아카이브를 확인할 수 있습니다.</p>
                        </div>
                        <button onclick="openAddTeamModal()" id="add-mwj-btn" class="hidden px-3.5 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold rounded-xl transition-all">
                            <i class="fa-solid fa-plus mr-1"></i>멸망전 팀 추가
                        </button>
                    </div>
                    <div id="mwj-teams-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </div>

                <div id="mwj-detail-view" class="space-y-6 hidden">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-2xl gap-3">
                        <div class="flex items-center space-x-4">
                            <button onclick="closeMwjDetail()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold rounded-xl transition-all">
                                <i class="fa-solid fa-arrow-left mr-1.5"></i>목록으로
                            </button>
                            <div>
                                <h2 id="detail-team-title" class="text-lg font-bold text-white">멸망전 상세 아카이브</h2>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 w-full sm:w-auto justify-between">
                            <div class="flex space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
                                <button id="mwj-subtab-scream" onclick="switchMwjSubTab('스크림')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-600 text-white transition-all">스크림</button>
                                <button id="mwj-subtab-match" onclick="switchMwjSubTab('대회')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all">대회</button>
                            </div>
                            <button onclick="openAddMwjMatchModal()" id="add-mwj-match-btn" class="hidden px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition-all whitespace-nowrap">
                                <i class="fa-solid fa-plus mr-1"></i>경기 추가
                            </button>
                        </div>
                    </div>
                    <div id="mwj-matches-container" class="space-y-6"></div>
                </div>
            </section>

            <!-- 3. 총겜동 섹션 -->
            <section id="section-chong" class="space-y-6 hidden">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="text-xl font-bold text-white mb-1">총겜동 에피소드 아카이브</h2>
                        <p class="text-sm text-slate-400">다수의 풀영상(VOD) 링크를 등록할 수 있습니다.</p>
                    </div>
                    <button onclick="openAddChongModal()" id="add-chong-btn" class="hidden px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition-all">
                        <i class="fa-solid fa-plus mr-1"></i>에피소드 추가
                    </button>
                </div>
                <div id="chong-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </section>

            <!-- 4. 마크서버 섹션 -->
            <section id="section-mc" class="space-y-6 hidden">
                <div id="mc-main-view">
                    <div class="mb-6 flex justify-between items-end">
                        <div>
                            <h2 class="text-xl font-bold text-white mb-1">마크서버 길드 아카이브</h2>
                            <p class="text-sm text-slate-400">길드를 누르면 이미지처럼 카테고리별 상세 타임라인을 볼 수 있습니다.</p>
                        </div>
                        <button onclick="openAddMcGuildModal()" id="add-mc-btn" class="hidden px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition-all">
                            <i class="fa-solid fa-plus mr-1"></i>마크 길드 추가
                        </button>
                    </div>
                    <div id="mc-guilds-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </div>

                <div id="mc-detail-view" class="space-y-6 hidden">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-2xl gap-3">
                        <div class="flex items-center space-x-4">
                            <button onclick="closeMcDetail()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold rounded-xl transition-all">
                                <i class="fa-solid fa-arrow-left mr-1.5"></i>목록으로
                            </button>
                            <div>
                                <h2 id="mc-detail-title" class="text-lg font-bold text-white">마크서버 상세 아카이브</h2>
                            </div>
                        </div>
                        <button onclick="openAddMcDayModal()" id="add-mc-day-btn" class="hidden px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition-all">
                            <i class="fa-solid fa-plus mr-1"></i>날짜(요일) 탭 추가
                        </button>
                    </div>
                    <div id="mc-days-tabs" class="flex space-x-2 overflow-x-auto pb-2 custom-scrollbar"></div>
                    <div id="mc-categories-container" class="space-y-6"></div>
                </div>
            </section>

        </main>
    </div>

    <!-- 하단 푸터 -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 px-4 sm:px-6 lg:px-8 mt-12">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center text-xs text-slate-500 gap-2">
            <div>본 사이트는 비공식 전적 정리 사이트이므로 일부 누락이나 오류가 있을 수 있습니다.</div>
            <div class="font-semibold text-slate-400">made by 윤슬ツ</div>
        </div>
    </footer>

    <!-- 총겜동 추가 모달 -->
    <div id="chong-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white">총겜동 에피소드 관리</h3>
            <input type="hidden" id="edit-chong-id">
            <div class="space-y-3 text-sm">
                <div><label class="text-slate-400 block mb-1">회차명 (예: Ep. 1)</label><input type="text" id="c-ep" placeholder="Ep. 1" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                <div><label class="text-slate-400 block mb-1">에피소드 제목</label><input type="text" id="c-title" placeholder="레전드 합방 라디오" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                <div><label class="text-slate-400 block mb-1">날짜</label><input type="text" id="c-date" placeholder="2025.11.20" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                <div>
                    <label class="text-slate-400 block mb-1">풀영상 링크들 (여러 개 입력 시 콤마(,)나 줄바꿈으로 구분)</label>
                    <textarea id="c-vods" rows="3" placeholder="https://vod1...&#10;https://vod2..." class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></textarea>
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                <button onclick="closeAddChongModal()" class="px-4 py-2 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">취소</button>
                <button onclick="saveChongEpisode()" class="px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl text-xs">저장하기</button>
            </div>
        </div>
    </div>

    <!-- 마크 길드 추가 모달 -->
    <div id="mc-guild-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white">마크서버 길드 관리</h3>
            <div class="space-y-3 text-sm">
                <div><label class="text-slate-400 block mb-1">길드 이름</label><input type="text" id="mc-gname" placeholder="도현길드" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                <div><label class="text-slate-400 block mb-1">서버 종류 (우측 상단 노란색 뱃지)</label><input type="text" id="mc-server" placeholder="스파크서버 시즌1" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                <div><label class="text-slate-400 block mb-1">텍스트 로고 (2~3글자)</label><input type="text" id="mc-glogo" placeholder="DH" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
                <div><label class="text-slate-400 block mb-1">설명</label><input type="text" id="mc-gdesc" placeholder="왕국 건설 길드" class="w-full bg-slate-950 border border-slate-800 text-slate-200 rounded-lg p-2.5"></div>
            </div>
            <div class="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                <button onclick="closeAddMcGuildModal()" class="px-4 py-2 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">취소</button>
                <button onclick="saveMcGuild()" class="px-4 py-2 bg-emerald-600 text-white font-bold rounded-xl text-xs">저장하기</button>
            </div>
        </div>
    </div>

    <!-- 스크립트 (로컬스토리지 저장 및 모든 기능 완벽 연동) -->
    <script>
        let mockData = JSON.parse(localStorage.getItem('dohyeon_mockData')) || { val: [], lol: [], pubg: [] };
        let mwjTeams = JSON.parse(localStorage.getItem('dohyeon_mwjTeams')) || [];
        let chongEpisodes = JSON.parse(localStorage.getItem('dohyeon_chong')) || [
            { id: 1, ep: "Ep. 1", title: "레전드 합방 라디오", date: "2025.11.10", vods: ["#"] }
        ];
        let mcGuilds = JSON.parse(localStorage.getItem('dohyeon_mc')) || [
            { id: 'g1', name: '도현길드', server: '스파크서버 시즌1', logo: 'DH', desc: '왕국 건설 길드', days: { '1일차': { '모험 / 광질 / 사냥': [{ text: '보스방 1', vod: '#' }, { text: '채굴장 64', vod: '' }], '개인': [{ text: '건담기', vod: '' }] } } }
        ];

        let currentGameTab = 'val';
        let isAdmin = false;
        let currentSelectedGuildId = null;
        let currentMcDay = '';

        function saveData() {
            localStorage.setItem('dohyeon_mockData', JSON.stringify(mockData));
            localStorage.setItem('dohyeon_mwjTeams', JSON.stringify(mwjTeams));
            localStorage.setItem('dohyeon_chong', JSON.stringify(chongEpisodes));
            localStorage.setItem('dohyeon_mc', JSON.stringify(mcGuilds));
        }

        function toggleAdminMode() {
            isAdmin = !isAdmin;
            const btn = document.getElementById('admin-mode-btn');
            ['add-record-btn', 'add-mwj-btn', 'add-mwj-match-btn', 'add-chong-btn', 'add-mc-btn', 'add-mc-day-btn'].forEach(id => {
                const el = document.getElementById(id);
                if(el) { if(isAdmin) el.classList.remove('hidden'); else el.classList.add('hidden'); }
            });
            btn.className = isAdmin ? "px-3 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl" : "px-3 py-2 bg-slate-800 text-slate-300 text-xs font-bold rounded-xl";
            btn.innerHTML = isAdmin ? '<i class="fa-solid fa-unlock mr-1"></i>관리자 ON' : '<i class="fa-solid fa-lock mr-1"></i>관리자 OFF';
            renderRecords(); renderChongEpisodes(); renderMcGuilds();
            if(currentSelectedGuildId) { const g = mcGuilds.find(x => x.id === currentSelectedGuildId); if(g) renderMcDetail(g); }
        }

        function switchMainTab(tab) {
            ['history', 'mwj', 'chong', 'mc'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`nav-btn-${t}`).className = "px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all text-slate-400 hover:text-white whitespace-nowrap";
            });
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-btn-${tab}`).className = "px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all bg-indigo-600 text-white shadow-lg whitespace-nowrap";

            if(tab === 'chong') renderChongEpisodes();
            if(tab === 'mc') { document.getElementById('mc-main-view').classList.remove('hidden'); document.getElementById('mc-detail-view').classList.add('hidden'); renderMcGuilds(); }
        }

        // 게임 전적 탭 전환 정상 작동
        function switchGameTab(game) {
            currentGameTab = game;
            ['val', 'lol', 'pubg'].forEach(g => {
                const btn = document.getElementById(`game-tab-${g}`);
                if(g === game) {
                    const cMap = { val: 'bg-rose-600', lol: 'bg-indigo-600', pubg: 'bg-amber-600' };
                    btn.className = `flex-1 md:flex-none px-4 py-2 rounded-lg text-xs sm:text-sm font-bold ${cMap[g]} text-white transition-all`;
                } else {
                    btn.className = "flex-1 md:flex-none px-4 py-2 rounded-lg text-xs sm:text-sm font-bold text-slate-400 hover:text-white transition-all";
                }
            });
            renderRecords();
        }

        function renderRecords() {
            const listEl = document.getElementById('record-list');
            listEl.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">등록된 전적이 없습니다. (상단 기록 추가 버튼 이용)</div>`;
        }
        function filterRecords() {}

        // 총겜동 다중 VOD 렌더링
        function renderChongEpisodes() {
            const grid = document.getElementById('chong-grid');
            grid.innerHTML = '';
            if(chongEpisodes.length === 0) { grid.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm col-span-full">등록된 에피소드가 없습니다.</div>`; return; }
            chongEpisodes.forEach(ep => {
                let vodButtons = '';
                if(ep.vods && ep.vods.length > 0) {
                    ep.vods.forEach((v, idx) => {
                        if(v && v.trim()) vodButtons += `<a href="${v.trim()}" target="_blank" class="inline-flex items-center text-xs text-rose-400 bg-rose-500/10 px-3 py-1.5 rounded-xl border border-rose-500/20 mr-2 mb-2"><i class="fa-solid fa-play-circle mr-1.5"></i>풀영상 #${idx+1}</a>`;
                    });
                }
                const adminC = isAdmin ? `<div class="absolute bottom-3 right-3"><button onclick="deleteChong(${ep.id})" class="px-2 py-1 bg-rose-600 text-white rounded text-xs font-bold">삭제</button></div>` : '';
                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 relative">
                        <div class="flex justify-between items-center"><span class="bg-indigo-900 text-white text-xs font-bold px-2.5 py-1 rounded-lg">${ep.ep}</span><span class="text-xs text-slate-400">${ep.date}</span></div>
                        <h3 class="font-bold text-white text-base">${ep.title}</h3>
                        <div class="flex flex-wrap pt-1">${vodButtons}</div>
                        ${adminC}
                    </div>
                `;
            });
        }
        function openAddChongModal() { document.getElementById('chong-modal').classList.remove('hidden'); }
        function closeAddChongModal() { document.getElementById('chong-modal').classList.add('hidden'); }
        function saveChongEpisode() {
            const rawVods = document.getElementById('c-vods').value;
            const vods = rawVods ? rawVods.split(/[\n,]+/).map(s => s.trim()).filter(Boolean) : [];
            chongEpisodes.push({ id: Date.now(), ep: document.getElementById('c-ep').value || 'Ep.X', title: document.getElementById('c-title').value || '제목', date: document.getElementById('c-date').value || '', vods });
            saveData(); renderChongEpisodes(); closeAddChongModal();
        }
        function deleteChong(id) { chongEpisodes = chongEpisodes.filter(x => x.id !== id); saveData(); renderChongEpisodes(); }

        // 마크서버 렌더링
        function renderMcGuilds() {
            const grid = document.getElementById('mc-guilds-grid');
            grid.innerHTML = '';
            if(mcGuilds.length === 0) { grid.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm col-span-full">등록된 마크서버 길드가 없습니다.</div>`; return; }
            mcGuilds.forEach(g => {
                const adminC = isAdmin ? `<div class="absolute bottom-3 right-3 z-10"><button onclick="event.stopPropagation(); deleteMcGuild('${g.id}')" class="px-2 py-1 bg-rose-600 text-white rounded text-xs font-bold">삭제</button></div>` : '';
                grid.innerHTML += `
                    <div onclick="openMcDetail('${g.id}')" class="group bg-slate-900 border border-slate-800 rounded-2xl p-6 hover:border-emerald-500/50 transition-all cursor-pointer relative overflow-hidden">
                        ${g.server ? `<div class="absolute top-0 right-0 bg-amber-500/10 text-amber-400 text-xs font-bold px-3 py-1 rounded-bl-xl border-l border-b border-amber-500/20">${g.server}</div>` : ''}
                        <div class="flex items-center space-x-4 mb-4">
                            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center font-black text-2xl text-slate-950 shadow-lg">${g.logo}</div>
                            <div><h3 class="text-lg font-bold text-white group-hover:text-emerald-400">${g.name}</h3><p class="text-xs text-slate-400">${g.desc || ''}</p></div>
                        </div>
                        <div class="border-t border-slate-800 pt-3 text-xs text-slate-400 flex justify-between"><span>타임라인 기록 보기</span><span class="text-emerald-400 font-semibold">입장 <i class="fa-solid fa-arrow-right ml-1"></i></span></div>
                        ${adminC}
                    </div>
                `;
            });
        }

        function openMcDetail(guildId) {
            currentSelectedGuildId = guildId;
            const g = mcGuilds.find(x => x.id === guildId);
            if(!g) return;
            document.getElementById('mc-detail-title').innerText = `${g.server || ''} - ${g.name} 상세 아카이브`;
            document.getElementById('mc-main-view').classList.add('hidden');
            document.getElementById('mc-detail-view').classList.remove('hidden');
            const dayKeys = Object.keys(g.days || {});
            currentMcDay = dayKeys.length > 0 ? dayKeys[0] : '';
            renderMcDetail(g);
        }

        function closeMcDetail() {
            document.getElementById('mc-detail-view').classList.add('hidden');
            document.getElementById('mc-main-view').classList.remove('hidden');
            currentSelectedGuildId = null;
        }

        function renderMcDetail(guild) {
            const tabsEl = document.getElementById('mc-days-tabs');
            tabsEl.innerHTML = '';
            const dayKeys = Object.keys(guild.days || {});

            if(dayKeys.length === 0) {
                tabsEl.innerHTML = `<span class="text-xs text-slate-500">등록된 날짜 탭이 없습니다. 상단 '날짜 탭 추가'를 눌러주세요.</span>`;
                document.getElementById('mc-categories-container').innerHTML = '';
                return;
            }

            if(!currentMcDay || !guild.days[currentMcDay]) currentMcDay = dayKeys[0];

            dayKeys.forEach(day => {
                const isActive = (currentMcDay === day);
                const activeAdminDel = isAdmin ? ` <button onclick="event.stopPropagation(); deleteMcDay('${day}')" class="text-rose-400 ml-1 hover:text-rose-300">×</button>` : '';
                tabsEl.innerHTML += `<button onclick="switchMcDay('${day}')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${isActive ? 'bg-emerald-600 text-white shadow-lg' : 'bg-slate-950 text-slate-400 hover:text-white'}">${day}${activeAdminDel}</button>`;
            });

            const container = document.getElementById('mc-categories-container');
            container.innerHTML = '';
            const categories = guild.days[currentMcDay] || {};
            const catKeys = Object.keys(categories);

            if(catKeys.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">해당 날짜에 기록된 항목이 없습니다.</div>`;
                return;
            }

            catKeys.forEach(catName => {
                const items = categories[catName] || [];
                let itemsHtml = '';
                items.forEach((item, itemIdx) => {
                    const vodIcon = item.vod ? `<a href="${item.vod}" target="_blank" class="text-rose-400 hover:text-rose-300 ml-2 text-xs" title="VOD 바로가기"><i class="fa-solid fa-link"></i></a>` : '';
                    const adminDelItem = isAdmin ? ` <button onclick="deleteMcItem('${catName}', ${itemIdx})" class="text-rose-500 text-[10px] ml-1">삭제</button>` : '';
                    itemsHtml += `<li class="py-1 text-slate-300 flex items-center justify-between border-b border-slate-800/40 last:border-0 text-xs sm:text-sm"><span>${item.text}${vodIcon}</span>${adminDelItem}</li>`;
                });

                const adminAddSubItem = isAdmin ? ` <button onclick="promptAddMcItem('${catName}')" class="text-xs text-emerald-400 font-normal hover:underline ml-2">+ 항목 추가</button>` : '';
                const adminDelCat = isAdmin ? ` <button onclick="deleteMcCategory('${catName}')" class="text-rose-400 text-xs font-normal hover:underline ml-2">카테고리 삭제</button>` : '';

                container.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                        <div class="border-b border-slate-800 pb-2.5 flex justify-between items-center">
                            <h3 class="font-bold text-white text-sm sm:text-base text-emerald-400">${catName}${adminAddSubItem}</h3>
                            <div>${adminDelCat}</div>
                        </div>
                        <ul class="pl-2 space-y-1">
                            ${itemsHtml || '<li class="text-xs text-slate-500 py-1">항목이 없습니다.</li>'}
                        </ul>
                    </div>
                `;
            });

            if(isAdmin) {
                container.innerHTML += `
                    <div class="text-center pt-2">
                        <button onclick="promptAddMcCategory()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-emerald-400 text-xs font-bold rounded-xl border border-slate-700 transition-all">
                            <i class="fa-solid fa-plus mr-1"></i>새 카테고리(모험/광질 등) 추가
                        </button>
                    </div>
                `;
            }
        }

        function switchMcDay(day) { currentMcDay = day; const g = mcGuilds.find(x => x.id === currentSelectedGuildId); if(g) renderMcDetail(g); }

        function openAddMcGuildModal() { document.getElementById('mc-guild-modal').classList.remove('hidden'); }
        function closeAddMcGuildModal() { document.getElementById('mc-guild-modal').classList.add('hidden'); }
        function saveMcGuild() {
            mcGuilds.push({ id: 'g_' + Date.now(), name: document.getElementById('mc-gname').value || '길드', server: document.getElementById('mc-server').value || '', logo: document.getElementById('mc-glogo').value || 'DH', desc: document.getElementById('mc-gdesc').value || '', days: { '1일차': { '모험 / 광질 / 사냥': [] } } });
            saveData(); renderMcGuilds(); closeAddMcGuildModal();
        }
        function deleteMcGuild(id) { mcGuilds = mcGuilds.filter(x => x.id !== id); saveData(); renderMcGuilds(); }

        // 마크서버 날짜/카테고리/항목 관리 함수들
        function openAddMcDayModal() {
            const dayName = prompt("추가할 날짜 또는 요일 이름을 입력하세요 (예: 2일차, 화요일):");
            if(!dayName) return;
            const g = mcGuilds.find(x => x.id === currentSelectedGuildId);
            if(g) {
                if(!g.days) g.days = {};
                if(!g.days[dayName]) g.days[dayName] = { '모험 / 광질 / 사냥': [] };
                currentMcDay = dayName;
                saveData(); renderMcDetail(g);
            }
        }
        function deleteMcDay(day) {
            if(confirm(`'${day}' 탭을 정말 삭제하시겠습니까?`)) {
                const g = mcGuilds.find(x => x.id === currentSelectedGuildId);
                if(g) {
                    delete g.days[day];
                    const keys = Object.keys(g.days);
                    currentMcDay = keys.length > 0 ? keys[0] : '';
                    saveData(); renderMcDetail(g);
                }
            }
        }
        function promptAddMcCategory() {
            const catName = prompt("새로운 카테고리 이름을 입력하세요 (예: 개인, 문파, 보스레이드):");
            if(!catName) return;
            const g = mcGuilds.find(x => x.id === currentSelectedGuildId);
            if(g && currentMcDay) {
                if(!g.days[currentMcDay]) g.days[currentMcDay] = {};
                if(!g.days[currentMcDay][catName]) g.days[currentMcDay][catName] = [];
                saveData(); renderMcDetail(g);
            }
        }
        function deleteMcCategory(catName) {
            if(confirm(`'${catName}' 카테고리를 삭제하시겠습니까?`)) {
                const g = mcGuilds.find(x => x.id === currentSelectedGuildId);
                if(g && currentMcDay && g.days[currentMcDay]) {
                    delete g.days[currentMcDay][catName];
                    saveData(); renderMcDetail(g);
                }
            }
        }
        function promptAddMcItem(catName) {
            const text = prompt("항목 내용을 입력하세요 (예: 채굴장 64):");
            if(!text) return;
            const vod = prompt("연결할 VOD 링크가 있다면 입력하세요 (선택 사항, 없으면 빈칸):") || '';
            const g = mcGuilds.find(x => x.id === currentSelectedGuildId);
            if(g && currentMcDay && g.days[currentMcDay][catName]) {
                g.days[currentMcDay][catName].push({ text, vod });
                saveData(); renderMcDetail(g);
            }
        }
        function deleteMcItem(catName, idx) {
            if(confirm("이 항목을 삭제하시겠습니까?")) {
                const g = mcGuilds.find(x => x.id === currentSelectedGuildId);
                if(g && currentMcDay && g.days[currentMcDay][catName]) {
                    g.days[currentMcDay][catName].splice(idx, 1);
                    saveData(); renderMcDetail(g);
                }
            }
        }

        window.onload = () => { switchMainTab('history'); };
    </script>
</body>
</html>
