<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>DOHYEON ARCHIVE</title>
<meta name="viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --page: #f1f3f6; --page-fg: #12161c; --page-muted: #566170; --bar: #ffffff; --bar-line: #d8dee6;
  --panel: #ffffff; --surface: #ffffff; --surface-2: #eef1f5; --fg: #12161c; --muted: #566170; --line: #dde2ea;
  --accent: #2a56d6; --accent-ink: #ffffff; --soft: #e4ebfc; --soft-ink: #1f3fa6;
  --win: #16794c; --win-bg: #dff2e6; --loss: #b3282d; --loss-bg: #fae3e3; --neutral-bg: #e6e9ee;
  --blue: #2f6fd0; --blue-bg: #e1ecfb; --red: #c4443a; --red-bg: #fbe6e3; --hl: #fff2b8; --hl-ink: #3d3200;
  --pink: #d65a9e; --pink-bg: #fbe3f0; --pink-ink: #7d1f55;
  --yellow: #d9a200; --yellow-bg: #fdf0b8; --yellow-ink: #5a4400;
  --sky: #4a9be8; --sky-bg: #dcecfd; --sky-ink: #0f4a86;
  --violet: #9b6fe0; --violet-bg: #eadfff; --violet-ink: #4a2a8c;
  --font-display: "Barlow Condensed", "Noto Sans KR", "Arial Narrow", sans-serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0f1318; --page-fg: #e8ecf2; --page-muted: #9aa5b4; --bar: #171c23; --bar-line: #2a323e;
    --panel: #171c23; --surface: #171c23; --surface-2: #212833; --fg: #e8ecf2; --muted: #9aa5b4; --line: #2a323e;
    --accent: #7ea3ff; --accent-ink: #0c1220; --soft: #1c2740; --soft-ink: #a9c1ff;
    --win: #5fd39a; --win-bg: #163527; --loss: #ff8a8f; --loss-bg: #3b1d20; --neutral-bg: #2a2a31;
    --blue: #7fb0ff; --blue-bg: #17283f; --red: #ff9a90; --red-bg: #3b2020; --hl: #4a3f12; --hl-ink: #fff2b8;
    --pink: #ef8fc3; --pink-bg: #3a1c2d; --pink-ink: #ffd3ea;
    --yellow: #f2c744; --yellow-bg: #3b3210; --yellow-ink: #ffe9a0;
    --sky: #7bb8f5; --sky-bg: #14293f; --sky-ink: #cfe6ff;
    --violet: #bf9cff; --violet-bg: #2a1f45; --violet-ink: #e3d4ff;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  background: var(--page); color: var(--page-fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 58px; }
a { color: inherit; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; padding-top: 4px; }
.brand { display: flex; flex-direction: column; gap: 8px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(40px, 9vw, 68px); line-height: 1; text-transform: uppercase; }
h1 em { font-style: normal; }

.sheet { display: flex; flex-direction: column; }
nav.bar { display: flex; align-items: flex-end; gap: 6px; padding: 16px 10px 0; border-bottom: 1px solid var(--line); }
nav.bar a {
  position: relative; display: inline-flex; align-items: center; text-decoration: none; padding: 8px 20px 7px;
  border-radius: 6px 6px 0 0; white-space: nowrap; color: var(--note-ink); font-weight: 700; font-size: 15px;
  background: var(--note); border: 1px solid var(--note-edge); border-bottom: 0;
  box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.08); transform-origin: 50% 100%; transform: rotate(var(--tilt, 0deg)) translateY(2px);
}
nav.bar a::before {
  content: ""; position: absolute; top: -5px; left: 50%; width: 26px; height: 9px; margin-left: -13px;
  background: rgba(255, 255, 255, 0.55); border: 1px solid rgba(0, 0, 0, 0.06); border-radius: 1px; transform: rotate(-3deg);
}
nav.bar a[data-cat="record"] { --note: var(--pink-bg); --note-ink: var(--pink-ink); --note-edge: var(--pink); --tilt: -1.2deg; }
nav.bar a[data-cat="scrim"] { --note: var(--yellow-bg); --note-ink: var(--yellow-ink); --note-edge: var(--yellow); --tilt: 0.9deg; }
nav.bar a[data-cat="mc"] { --note: var(--sky-bg); --note-ink: var(--sky-ink); --note-edge: var(--sky); --tilt: -0.8deg; }
nav.bar a[data-cat="chong"] { --note: var(--violet-bg); --note-ink: var(--violet-ink); --note-edge: var(--violet); --tilt: 1.2deg; }
nav.bar a[aria-current="page"] {
  z-index: 1; transform: none; padding-top: 11px; padding-bottom: 9px; margin-bottom: -1px;
  border-color: var(--line); border-bottom: 1px solid var(--panel); background: var(--panel); color: var(--fg);
}
.panel { background: var(--panel); color: var(--fg); border-radius: 0 0 12px 12px; padding: 22px 22px 26px; border: 1px solid var(--line); border-top: 0; }
.subnav { display: flex; gap: 8px; flex-wrap: wrap; }
.subnav a { text-decoration: none; padding: 6px 14px; border-radius: 999px; font-size: 14px; color: var(--fg); border: 1.5px solid var(--line); background: var(--surface); }
.subnav a[aria-current="page"] { background: var(--soft); border-color: var(--accent); color: var(--soft-ink); font-weight: 700; }
.subnav .n { font-family: var(--font-mono); font-size: 12px; opacity: 0.7; margin-left: 6px; }
h2 { margin: 0; font-size: 21px; font-weight: 700; }
.section-head { display: flex; flex-direction: column; gap: 4px; }
.stats { display: flex; flex-wrap: wrap; gap: 20px 40px; align-items: flex-end; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-family: var(--font-mono); font-size: 24px; font-weight: 500; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--soft-ink); font-weight: 700; }
select, input { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 600px; }
th, td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { font-size: 12px; font-weight: 500; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 999px; }
.pill.w { background: var(--win-bg); color: var(--win); }
.pill.l { background: var(--loss-bg); color: var(--loss); }
.empty { border: 1.5px dashed var(--line); border-radius: 12px; padding: 32px 18px; text-align: center; color: var(--muted); }
.month { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.month > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface-2); font-weight: bold; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
.card { display: flex; flex-direction: column; gap: 10px; min-height: 140px; padding: 14px 16px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; text-decoration: none; }
.card .k { font-family: var(--font-display); font-weight: 800; font-size: 14px; opacity: 0.75; }
.card .ttl { font-size: 18px; font-weight: 700; }
/* 관리자 모드 스타일 */
#admin-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #111; color: #fff; padding: 10px 20px; display: none; justify-content: space-between; align-items: center; z-index: 9999; font-weight: bold; }
#admin-bar button { background: #ff4d4d; border: 0; color: #fff; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
.admin-btns { margin-top: 15px; }
.admin-btns button { background: var(--accent); color: #fff; border: 0; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Dohyeon <em>Archive</em></h1></div>
  </header>
  <div class="sheet">
    <nav class="bar" id="mainNav"></nav>
    <div class="panel" id="panel"><main id="view"></main></div>
  </div>
</div>

<div id="admin-bar">
  <span>⚡ 관리자 모드 활성화됨 (데이터 추가/수정 가능)</span>
  <button onclick="logoutAdmin()">관리자 모드 종료</button>
</div>

<script>
// 기본 초기 데이터 (localStorage에 없으면 이 데이터를 사용)
const DEFAULT_DATA = {
  sets: [
    { date: "2024-11-02", game: "발로란트", mode: "내전", set: "1세트", result: "W", map: "어센트", agent: "제트", members: ["예시A", "예시B"] },
    { date: "2024-08-10", game: "롤", mode: "내전", set: "1세트", result: "W", champ: "아리", members: ["예시A", "예시C"] }
  ],
  scrims: [],
  servers: [
    { id: "korchang", name: "코창서버", days: [] },
    { id: "mending", name: "맹든링서버", days: [{ title: "1일차", date: "2025-01-01", sections: [{ title: "광질", items: ["철 캐기", "다이아 발견"] }] }] }
  ],
  chong: { eps: [{ ep: 1, title: "첫 방송", date: "2025-05-01", game: "발로란트", summary: "첫 에피소드 요약", timeline: [["00:00", "오프닝"]], points: ["포인트1"] }] }
};

// 로컬 스토리지에서 데이터 로드 또는 기본값 설정
let DB = JSON.parse(localStorage.getItem("dohyeon_db")) || DEFAULT_DATA;
function saveDB() { localStorage.setItem("dohyeon_db", JSON.stringify(DB)); }

let isAdmin = false;
const GAMES = ["발로란트", "롤", "배그"];
let S = { game: "all", mode: "all", route: "record" };

// 단축키 Alt + A 감지
window.addEventListener("keydown", e => {
  if (e.altKey && e.code === "KeyA") {
    e.preventDefault();
    const pw = prompt("관리자 비밀코드를 입력하세요:");
    if (pw === "1520711") {
      isAdmin = true;
      document.getElementById("admin-bar").style.display = "flex";
      alert("관리자 모드가 활성화되었습니다!");
      render();
    } else if (pw !== null) {
      alert("비밀코드가 틀렸습니다.");
    }
  }
});

function logoutAdmin() {
  isAdmin = false;
  document.getElementById("admin-bar").style.display = "none";
  alert("관리자 모드가 종료되었습니다.");
  render();
}

function currentRoute() {
  const h = location.hash.slice(1);
  if (["record", "scrim", "mc", "chong"].includes(h)) return h;
  return "record";
}

function renderNav() {
  const route = currentRoute();
  const items = [["record", "전적"], ["scrim", "롤 멸망전"], ["mc", "마크서버"], ["chong", "총겜동"]];
  document.getElementById("mainNav").innerHTML = items.map(([h, t]) =>
    `<a href="#${h}" ${route === h ? 'aria-current="page"' : ""}>${t}</a>`).join("");
}

function renderRecords() {
  const rows = DB.sets.filter(r => S.game === "all" || r.game === S.game);
  const totalW = rows.filter(r => r.result === "W").length;
  
  let adminHtml = isAdmin ? `
    <div class="admin-btns">
      <button onclick="addRecordPrompt()">+ 새 전적 추가하기</button>
    </div>` : "";

  return `
    <div class="block">
      <div class="subnav">
        <a href="#record" aria-current="page">전체 전적<span class="n">${rows.length}</span></a>
      </div>
      <h2>전적 아카이브</h2>
      <div class="stats">
        <div class="stat"><span class="k">총 세트</span><span class="v">${rows.length}</span></div>
        <div class="stat"><span class="k">승 / 패</span><span class="v">${totalW} / ${rows.length - totalW}</span></div>
      </div>
      <div class="toolbar">
        <div class="filters">${GAMES.map(g => `<button class="chip" onclick="setGame('${g}')" aria-pressed="${S.game === g}">${g}</button>`).join("")}</div>
      </div>
      ${adminHtml}
      <div class="table-wrap" style="margin-top:15px;">
        <table>
          <thead><tr><th>날짜</th><th>게임</th><th>종류</th><th>세트</th><th>결과</th><th>상세</th><th>멤버</th>${isAdmin ? "<th>관리</th>" : ""}</tr></thead>
          <tbody>
            ${rows.map((r, idx) => `
              <tr>
                <td>${r.date}</td><td>${r.game}</td><td>${r.mode}</td><td>${r.set}</td>
                <td><span class="pill ${r.result === 'W' ? 'w' : 'l'}">${r.result === 'W' ? '승' : '패'}</span></td>
                <td>${r.map || r.champ || r.kills || '-'}</td>
                <td>${r.members ? r.members.join(", ") : ""}</td>
                ${isAdmin ? `<td><button onclick="deleteRecord(${idx})" style="background:#ff4d4d;color:#fff;border:0;padding:3px 8px;border-radius:4px;cursor:pointer;">삭제</button></td>` : ""}
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>`;
}

function setGame(g) {
  S.game = S.game === g ? "all" : g;
  render();
}

function addRecordPrompt() {
  const date = prompt("날짜 (YYYY-MM-DD):", "2026-06-01");
  if (!date) return;
  const game = prompt("게임 (발로란트 / 롤 / 배그 중 택1):", "롤");
  const mode = prompt("종류 (내전 / 랜드 / CK):", "내전");
  const set = prompt("세트 (예: 1세트):", "1세트");
  const result = prompt("결과 (승 / 패):", "승") === "승" ? "W" : "L";
  const detail = prompt("추가 정보 (챔피언/맵/킬수):", "아리");
  const members = prompt("멤버 (쉼표로 구분):", "도현, 예시A");

  DB.sets.push({
    date, game, mode, set, result,
    champ: game === "롤" ? detail : "",
    map: game === "발로란트" ? detail : "",
    kills: game === "배그" ? detail : "",
    members: members ? members.split(",").map(s => s.trim()) : []
  });
  saveDB();
  render();
}

function deleteRecord(idx) {
  if (confirm("정말 이 전적 기록을 삭제하시겠습니까?")) {
    DB.sets.splice(idx, 1);
    saveDB();
    render();
  }
}

function renderMinecraft() {
  return `
    <div class="block">
      <h2>마크서버 기록</h2>
      <div class="cards" style="margin-top:15px;">
        ${DB.servers.map(s => `<div class="card"><span class="k">Server</span><span class="ttl">${s.name}</span><span class="meta">${s.days.length}일 기록</span></div>`).join("")}
      </div>
    </div>`;
}

function renderChong() {
  return `
    <div class="block">
      <h2>총겜동 에피소드</h2>
      <div class="cards" style="margin-top:15px;">
        ${DB.chong.eps.map(e => `<div class="card"><span class="k">Ep.${e.ep}</span><span class="ttl">${e.title}</span><span class="meta">${e.date || ''}</span></div>`).join("")}
      </div>
    </div>`;
}

function render() {
  renderNav();
  const route = currentRoute();
  const v = document.getElementById("view");
  if (route === "record") v.innerHTML = renderRecords();
  else if (route === "mc") v.innerHTML = renderMinecraft();
  else if (route === "chong") v.innerHTML = renderChong();
  else v.innerHTML = `<div class="block"><h2>준비 중</h2></div>`;
}

window.addEventListener("hashchange", render);
render();
</script>
</body></html>
