<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DOHYEON ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root {
  --page: #f1f3f6; --page-fg: #12161c; --page-muted: #566170;
  --panel: #ffffff; --surface: #ffffff; --line: #dde2ea;
  --accent: #2a56d6; --accent-ink: #ffffff; --soft: #e4ebfc; --soft-ink: #1f3fa6;
  --win: #16794c; --win-bg: #dff2e6; --loss: #b3282d; --loss-bg: #fae3e3; --neutral-bg: #e6e9ee;
  --pink: #d65a9e; --pink-bg: #fbe3f0; --pink-ink: #7d1f55;
  --yellow: #d9a200; --yellow-bg: #fdf0b8; --yellow-ink: #5a4400;
  --sky: #4a9be8; --sky-bg: #dcecfd; --sky-ink: #0f4a86;
  --violet: #9b6fe0; --violet-bg: #eadfff; --violet-ink: #4a2a8c;
  
  --font-body: "Noto Sans KR", system-ui, sans-serif;
  --font-title: "Gowun Dodum", sans-serif;
  --font-mono: "JetBrains Mono", monospace;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--page-fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; padding: 28px 16px 56px; }

.wrap { max-width: 1090px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
a { color: inherit; text-decoration: none; }

header.top { display: flex; justify-content: space-between; align-items: flex-start; }
h1 { margin: 0; font-family: var(--font-body); font-weight: 800; font-size: 48px; line-height: 1; letter-spacing: -0.01em; text-transform: uppercase; font-style: normal; }

/* 자유분방한 스티커 메모 탭 디자인 */
nav.bar { display: flex; align-items: flex-end; gap: 6px; border-bottom: 1px solid var(--line); padding-left: 10px; }
nav.bar a {
  position: relative; display: inline-flex; align-items: center; padding: 8px 22px;
  border-radius: 8px 8px 0 0; font-weight: 700; font-size: 15px;
  background: var(--note); color: var(--note-ink); border: 1px solid var(--note-edge); border-bottom: 0;
  box-shadow: 0 -2px 5px rgba(0,0,0,0.05); transform-origin: 50% 100%; transform: rotate(var(--tilt, 0deg)) translateY(2px);
}
nav.bar a::before {
  content: ""; position: absolute; top: -5px; left: 50%; width: 26px; height: 8px; margin-left: -13px;
  background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(0,0,0,0.08); border-radius: 2px; transform: rotate(-3deg);
}
nav.bar a[data-cat="record"] { --note: var(--pink-bg); --note-ink: var(--pink-ink); --note-edge: var(--pink); --tilt: -1deg; }
nav.bar a[data-cat="scrim"] { --note: var(--yellow-bg); --note-ink: var(--yellow-ink); --note-edge: var(--yellow); --tilt: 1deg; }
nav.bar a[data-cat="mc"] { --note: var(--sky-bg); --note-ink: var(--sky-ink); --note-edge: var(--sky); --tilt: -0.8deg; }
nav.bar a[data-cat="chong"] { --note: var(--violet-bg); --note-ink: var(--violet-ink); --note-edge: var(--violet); --tilt: 1.2deg; }
nav.bar a[aria-current="page"] {
  z-index: 1; transform: none; padding-top: 11px; padding-bottom: 9px; margin-bottom: -1px;
  border-color: var(--line); border-bottom: 1px solid var(--panel); background: var(--panel); color: var(--page-fg);
}

.panel { background: var(--panel); border-radius: 0 0 12px 12px; padding: 24px; border: 1px solid var(--line); border-top: 0; }
.block { display: flex; flex-direction: column; gap: 20px; }

.game-tabs { display: flex; gap: 8px; margin-bottom: 4px; }
.game-tab-btn { font: inherit; font-size: 14px; font-weight: bold; padding: 6px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; }
.game-tab-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

.subnav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.subnav a { padding: 4px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--page-fg); font-size: 13px; cursor: pointer; }
.subnav a[aria-current="page"] { background: var(--soft); border-color: var(--accent); color: var(--soft-ink); font-weight: 700; }
.subnav .n { font-family: var(--font-mono); opacity: 0.7; margin-left: 4px; }

h2 { margin: 0; font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; font-style: normal; }
h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

.stats { display: flex; gap: 32px; align-items: flex-end; }
.stat .k { font-size: 12px; color: var(--page-muted); display: block; }
.stat .v { font-family: var(--font-mono); font-size: 22px; font-weight: 700; }

.toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.month { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); margin-bottom: 16px; }
.month summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: #eef3fc; color: #1a365d; font-weight: bold; }
.month summary::-webkit-details-marker { display: none; }
.month .m-title { font-family: var(--font-mono); font-size: 16px; color: #2b6cb0; }
.month .m-meta { font-size: 13px; opacity: 0.8; font-weight: normal; }
.month .seg { margin-left: 10px; display: inline-flex; border: 1px solid #cbd5e0; border-radius: 999px; overflow: hidden; }
.month .seg button { font: inherit; font-size: 11px; padding: 2px 10px; border: 0; background: transparent; cursor: pointer; }
.month .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: bold; }
.month .rate-box { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.month .bar { width: 100px; height: 8px; border-radius: 4px; background: var(--loss-bg); overflow: hidden; }
.month .bar b { display: block; height: 100%; background: var(--win); }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 700px; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); font-style: normal; }
th { font-size: 12px; color: var(--page-muted); font-weight: 500; }
tbody tr:hover { background: rgba(0,0,0,0.02); }
td.mono { font-family: var(--font-mono); }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.pill.w { background: var(--win-bg); color: var(--win); }
.pill.l { background: var(--loss-bg); color: var(--loss); }

/* 카드 스타일 */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 15px; }
.card { display: flex; flex-direction: column; justify-content: space-between; min-height: 140px; padding: 20px; border: 2px solid #12161c; background: var(--surface); border-radius: 12px; text-decoration: none; color: var(--page-fg); transition: border-color 0.15s, transform 0.15s; position: relative; overflow: hidden; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); }

/* 마크서버 카드 */
.card-mc .server-name { font-size: 12px; font-weight: 500; color: var(--page-muted); }
.card-mc .guild-name { font-size: 21px; font-weight: 800; color: var(--sky); margin-top: 2px; }

/* 총겜동 카드 */
.card-chong .ep-no { font-weight: 800; font-size: 28px; color: var(--violet); line-height: 1; }
.card-chong .ep-title { font-size: 17px; font-weight: 700; color: #000; margin-top: 4px; }

/* 롤 멸망전 카드 */
.card-scrim .scrim-no { font-family: var(--font-title); font-weight: 800; font-size: 26px; color: #d99b00; line-height: 1; }
.card-badge { position: absolute; top: 0; right: 0; background: var(--yellow-bg); color: var(--yellow-ink); font-size: 11px; font-weight: bold; padding: 4px 10px; border-bottom-left-radius: 8px; border: 1px solid var(--yellow); border-top: 0; border-right: 0; }

.card-more { align-self: flex-end; font-size: 12px; color: var(--page-muted); font-weight: 500; margin-top: auto; padding-top: 12px; }
.card-admin-btns { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; z-index: 2; }

/* 롤 멸망전 5:5 상세 테이블 스타일 */
.scrim-detail-box { border: 1px solid #dcdcdc; border-radius: 8px; background: #fff; margin-bottom: 24px; overflow: hidden; position: relative; }
.scrim-box-header { padding: 12px 16px; font-weight: bold; font-size: 15px; background: #fafafa; border-bottom: 1px solid #dcdcdc; display: flex; justify-content: space-between; align-items: center; }
.lol-match-table { width: 100%; border-collapse: collapse; }
.lol-match-table td { border: 1px solid #dcdcdc; padding: 8px 12px; vertical-align: middle; }
.lol-match-table .pos-col { width: 70px; text-align: center; background: #f9f9f9; font-weight: bold; color: #555; }
.lol-match-table .player-row { display: flex; justify-content: space-between; align-items: baseline; font-weight: bold; font-size: 14px; }
.lol-match-table .tier-badge { font-size: 12px; color: #555; font-family: var(--font-mono); }
.lol-match-table .champ-row { font-size: 13px; color: var(--page-muted); margin-top: 2px; }

/* 배그 표 스타일 */
.kill-summary-box { border-left: 4px solid #12161c; padding-left: 12px; margin-bottom: 16px; }
.kill-summary-box .target-kill { font-size: 15px; font-weight: bold; color: var(--page-fg); }
.kill-summary-box .score-line { font-size: 20px; font-weight: 800; margin-top: 2px; }
.pubg-card-table { width: 100%; border-collapse: collapse; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 10px; }
.pubg-card-table th { background: #f2f0eb; font-weight: bold; padding: 10px; border: 1px solid #e0ddd7; color: #333; }
.pubg-card-table td { padding: 10px; border: 1px solid #e0ddd7; text-align: center; font-size: 13px; background: #fff; }
.pubg-card-table tr.team-row-2 th { background: #e8f0fe; color: #1a73e8; }

/* 모달 스타일 */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
.light-modal { background: var(--panel); color: var(--page-fg); border-radius: 12px; width: 100%; max-width: 620px; max-height: 90vh; overflow-y: auto; padding: 24px; border: 2px solid #12161c; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
.light-modal h3 { margin-top: 0; font-size: 18px; border-bottom: 1px solid var(--line); padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.light-modal .close-btn { cursor: pointer; border: 0; background: transparent; font-size: 20px; }
.light-modal label { display: block; font-size: 12px; font-weight: bold; color: var(--page-muted); margin-bottom: 4px; margin-top: 10px; }
.light-modal input, .light-modal select, .light-modal textarea { width: 100%; font: inherit; padding: 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--page-fg); }
.light-modal .btn-group { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.light-modal .btn-save { background: var(--accent); color: var(--accent-ink); border: 0; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
.light-modal .btn-cancel { background: var(--neutral-bg); color: var(--page-fg); border: 0; padding: 10px 16px; border-radius: 6px; cursor: pointer; }

/* 줄바꿈 여백 유지 클래스 */
.text-pre { white-space: pre-wrap; word-break: break-all; }

/* 타임라인 및 상세 박스 */
.ep-detail-wrap { display: flex; flex-direction: column; gap: 20px; margin-top: 15px; }
.ep-box { border: 2px solid #12161c; border-radius: 12px; padding: 20px; background: var(--surface); position: relative; }
.ep-box-title { font-size: 15px; font-weight: bold; color: var(--page-fg); margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.timeline-clean { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.timeline-clean li { font-size: 14px; display: flex; align-items: center; justify-content: space-between; color: #000; }
.timeline-clean a { color: #000; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.timeline-clean a:hover { text-decoration: underline; }
.timeline-clean .arrow { color: var(--accent); font-weight: bold; }

.back-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--page-muted); margin-bottom: 10px; cursor: pointer; text-decoration: none; }
.day-tabs { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
.day-tab-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: bold; cursor: pointer; font-size: 13px; }
.day-tab-btn[aria-selected="true"] { background: var(--sky-bg); border-color: var(--sky); color: var(--sky-ink); }

/* 하단 에피소드 연결 버튼 */
.ep-footer-nav { display: flex; justify-content: space-between; margin-top: 24px; gap: 10px; }
.ep-nav-box { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: 2px solid #12161c; border-radius: 8px; font-weight: bold; font-size: 13px; background: #fff; cursor: pointer; text-decoration: none; color: var(--violet-ink); }
.ep-nav-box:hover { background: var(--violet-bg); border-color: var(--violet); }

#admin-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #18181b; color: #fff; padding: 10px 24px; display: none; justify-content: space-between; align-items: center; z-index: 999; font-weight: bold; }
#admin-bar button { background: #ef4444; color: #fff; border: 0; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
.btn-btn { font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 6px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); }
.btn-accent { background: var(--accent); color: #fff; border: 0; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>DOHYEON ARCHIVE</h1>
  </header>

  <div class="sheet">
    <nav class="bar" id="mainNav">
      <a href="#record" data-cat="record">전적</a>
      <a href="#scrim" data-cat="scrim">롤 멸망전</a>
      <a href="#mc" data-cat="mc">마크서버</a>
      <a href="#chong" data-cat="chong">총겜동</a>
    </nav>
    <div class="panel">
      <main id="view"></main>
    </div>
  </div>
</div>

<div id="admin-bar">
  <span>⚡ 관리자 모드 활성화 (Alt+A)</span>
  <button onclick="logoutAdmin()">관리자 종료</button>
</div>

<!-- 상세 정보 모달 -->
<div class="modal-overlay" id="detailModal">
  <div class="light-modal">
    <h3><span id="mTitle">전적 상세</span><button class="close-btn" onclick="closeModal('detailModal')">✕</button></h3>
    <div id="modalContent"></div>
  </div>
</div>

<!-- 관리자 편집 폼 모달 -->
<div class="modal-overlay" id="adminFormModal">
  <div class="light-modal">
    <h3><span id="adminFormTitle">항목 편집</span><button class="close-btn" onclick="closeModal('adminFormModal')">✕</button></h3>
    <form id="adminForm" onsubmit="handleAdminFormSubmit(event)">
      <input type="hidden" id="afTarget">
      <input type="hidden" id="afIdx" value="-1">
      <div id="afFields"></div>
      <div class="btn-group">
        <button type="button" class="btn-cancel" onclick="closeModal('adminFormModal')">취소</button>
        <button type="submit" class="btn-save">저장하기</button>
      </div>
    </form>
  </div>
</div>

<!-- 상세 세부 항목 추가/수정 모달 -->
<div class="modal-overlay" id="adminSubModal">
  <div class="light-modal">
    <h3><span id="asTitle">세부 내용 작업</span><button class="close-btn" onclick="closeModal('adminSubModal')">✕</button></h3>
    <form id="adminSubForm" onsubmit="handleSubFormSubmit(event)">
      <input type="hidden" id="asParentId">
      <input type="hidden" id="asType">
      <input type="hidden" id="asExtra1">
      <input type="hidden" id="asExtra2">
      <div id="asFields"></div>
      <div class="btn-group">
        <button type="button" class="btn-cancel" onclick="closeModal('adminSubModal')">취소</button>
        <button type="submit" class="btn-save">저장하기</button>
      </div>
    </form>
  </div>
</div>

function deleteSubItem(target, id, idx1, idx2) {
  if (!confirm("해당 항목을 삭제하시겠습니까?")) return;
  if (target === "chong-timeline") {
    const epObj = CHONG_EPS.find(e => String(e.ep) === String(id));
    if (epObj && epObj.timeline) epObj.timeline.splice(idx1, 1);
  } else if (target === "scrim-match") {
    const card = SCRIM_CARDS.find(c => c.id === id);
    if (card && card.matches) card.matches.splice(idx1, 1);
  } else if (target === "mc-timeline") {
    const srv = MC_SERVERS.find(s => s.id === id);
    if (srv && srv.days[0] && srv.days[0].sections[idx1]) {
      srv.days[0].sections[idx1].timelines.splice(idx2, 1);
    }
  }
  saveData();
  render();
}

function renderRecords() {
  const games = ["발로란트", "롤", "배그"];
  const currentModes = GAME_MODES[S.game] || ["전체"];

  const yearsSet = new Set(["전체년", "2024년", "2025년", "2026년"]);
  setsData.forEach(r => {
    if (r.date && r.date.length >= 4) yearsSet.add(r.date.slice(0, 4) + "년");
  });
  const years = Array.from(yearsSet).sort((a, b) => {
    if (a === "전체년") return -1;
    if (b === "전체년") return 1;
    return a.localeCompare(b);
  });

  let rows = setsData.filter(r => r.game === S.game);
  if (S.mode !== "전체") rows = rows.filter(r => r.mode === S.mode);
  if (S.year !== "전체년") {
    const yNum = S.year.replace("년", "");
    rows = rows.filter(r => r.date && r.date.startsWith(yNum));
  }

  const total = rows.length;
  const winCount = rows.filter(r => r.result === "W").length;
  const lossCount = total - winCount;
  const winRate = total ? Math.round((winCount / total) * 100) : 0;
  const allGameRows = setsData.filter(r => r.game === S.game);

  const gameTabsHtml = games.map(g => `
    <button class="game-tab-btn" onclick="setGame('${g}')" aria-pressed="${S.game === g}">${g}</button>
  `).join("");

  const subnavHtml = currentModes.map(m => {
    const count = m === "전체" ? allGameRows.length : allGameRows.filter(r => r.mode === m).length;
    return `<a onclick="setMode('${m}')" ${S.mode === m ? 'aria-current="page"' : ''}>${m} <span class="n">${count}</span></a>`;
  }).join("");

  const yearTabsHtml = years.map(y => `
    <a onclick="setYear('${y}')" ${S.year === y ? 'aria-current="page"' : ''}>${y}</a>
  `).join("");

  const groups = new Map();
  rows.forEach(r => {
    const k = r.date ? r.date.slice(0, 7) : '기타';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  });

  const monthsHtml = [...groups.entries()].map(([k, list]) => {
    const desc = S.monthOrder[k] === "desc";
    const sorted = [...list].sort((a, b) => desc ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date));
    const mWin = sorted.filter(r => r.result === "W").length;
    const mRate = Math.round((mWin / sorted.length) * 100);

    const trs = sorted.map(r => {
      const realIdx = setsData.indexOf(r);
      if (S.game === "발로란트") {
        return `
          <tr>
            <td class="mono">${r.date ? r.date.slice(5).replace('-', '.') + ' ' + getWd(r.date) : '-'}</td>
            <td>${r.mode || '-'}</td>
            <td>${r.balance || '-'}</td>
            <td><a href="javascript:void(0)" onclick="openDetail(${realIdx})" style="font-weight:bold;color:var(--accent);">${r.set || '1세트'}</a></td>
            <td>${r.map || '-'}</td>
            <td>${r.agent || '-'}</td>
            <td>${r.acs ? r.acs : ''}</td>
            <td>${r.kda || '-'}</td>
            <td><span class="pill ${r.result === 'W' ? 'w' : 'l'}">${r.result === 'W' ? '승' : '패'}</span></td>
            ${isAdmin ? `<td><button class="btn-btn" onclick="openAdminModal('record', ${realIdx})">수정</button> <button class="btn-btn" style="color:red;" onclick="deleteItem('record', ${realIdx})">삭제</button></td>` : ''}
          </tr>`;
      } else if (S.game === "롤") {
        return `
          <tr>
            <td class="mono">${r.date ? r.date.slice(5).replace('-', '.') + ' ' + getWd(r.date) : '-'}</td>
            <td>${r.mode || '-'}</td>
            <td>${r.balance || '-'}</td>
            <td><a href="javascript:void(0)" onclick="openDetail(${realIdx})" style="font-weight:bold;color:var(--accent);">${r.set || '1세트'}</a></td>
            <td>${r.champion || '-'}</td>
            <td>${r.kda || '-'}</td>
            <td><span class="pill ${r.result === 'W' ? 'w' : 'l'}">${r.result === 'W' ? '승' : '패'}</span></td>
            ${isAdmin ? `<td><button class="btn-btn" onclick="openAdminModal('record', ${realIdx})">수정</button> <button class="btn-btn" style="color:red;" onclick="deleteItem('record', ${realIdx})">삭제</button></td>` : ''}
          </tr>`;
      } else {
        return `
          <tr>
            <td class="mono">${r.date ? r.date.slice(5).replace('-', '.') + ' ' + getWd(r.date) : '-'}</td>
            <td>${r.mode || '-'}</td>
            <td>${r.balance || '-'}</td>
            <td><a href="javascript:void(0)" onclick="openDetail(${realIdx})" style="font-weight:bold;color:var(--accent);">${r.pureKill || '-'}</a></td>
            <td><span class="pill ${r.result === 'W' ? 'w' : 'l'}">${r.result === 'W' ? '승' : '패'}</span></td>
            ${isAdmin ? `<td><button class="btn-btn" onclick="openAdminModal('record', ${realIdx})">수정</button> <button class="btn-btn" style="color:red;" onclick="deleteItem('record', ${realIdx})">삭제</button></td>` : ''}
          </tr>`;
      }
    }).join("");

    let theaders = `<th>날짜</th><th>종류</th><th>밸런스</th><th>세트</th><th>맵</th><th>요원</th>` + (sorted.some(r=>r.acs)?`<th>ACS</th>`:'') + `<th>KDA</th><th>결과</th>` + (isAdmin?'<th>관리</th>':'');
    if (S.game === "롤") theaders = `<th>날짜</th><th>종류</th><th>밸런스</th><th>세트</th><th>챔피언</th><th>KDA</th><th>결과</th>` + (isAdmin?'<th>관리</th>':'');
    if (S.game === "배그") theaders = `<th>날짜</th><th>종류</th><th>밸런스</th><th>도현 순수킬</th><th>결과</th>` + (isAdmin?'<th>관리</th>':'');

    return `
      <details class="month" open>
        <summary>
          <span class="m-title">v ${k.replace('-', '.')}</span>
          <span class="m-meta">${sorted.length}세트 · ${mWin}승 ${sorted.length - mWin}패</span>
          <span class="seg">
            <button type="button" onclick="setMonthOrd('${k}','desc')" aria-pressed="${desc}">최신순</button>
            <button type="button" onclick="setMonthOrd('${k}','asc')" aria-pressed="${!desc}">오래된순</button>
          </span>
          <div class="rate-box">
            <span class="mono">승률 <b>${mRate}%</b></span>
            <div class="bar"><b style="width:${mRate}%"></b></div>
          </div>
        </summary>
        <div class="table-wrap">
          <table>
            <thead><tr>${theaders}</tr></thead>
            <tbody>${trs}</tbody>
          </table>
        </div>
      </details>`;
  }).join("");

  return `
    <div class="block">
      <div class="game-tabs">${gameTabsHtml}</div>
      <div style="border-top: 1px dashed var(--line); margin: 4px 0;"></div>
      <div class="subnav">${subnavHtml}</div>
      <div class="subnav" style="margin-top:-6px;">${yearTabsHtml}</div>

      <div class="stats" style="margin-top:10px;">
        <div class="stat"><span class="k">세트</span><span class="v">${total}</span></div>
        <div class="stat"><span class="k">승 / 패</span><span class="v">${winCount} / ${lossCount}</span></div>
        <div class="stat"><span class="k">승률</span><span class="v">${winRate}%</span></div>
      </div>
      <div class="toolbar">
        <div></div>
        ${isAdmin ? `<button class="btn-accent" onclick="openAdminModal('record')">+ 새 전적 추가</button>` : ''}
      </div>
      ${monthsHtml || '<div style="padding:40px;text-align:center;color:#888;">전적 기록이 없습니다.</div>'}
    </div>`;
}

function renderScrims(subId) {
  if (subId) {
    const card = SCRIM_CARDS.find(c => c.id === subId) || SCRIM_CARDS[0];
    const filteredMatches = (card.matches || []).filter(m => {
      if (S.scrimTab === "스크림") return m.matchType === "스크림";
      if (S.scrimTab === "대회") return m.matchType === "대회";
      return true;
    });

    return `
      <div class="block">
        <a class="back-btn" onclick="location.hash='#scrim'">← 멸망전 목록으로</a>
        <h2>${card.no} 상세 전적</h2>
        
        <div class="subnav" style="margin-bottom: 10px;">
          <a onclick="setScrimTab('전체')" ${S.scrimTab === '전체' ? 'aria-current="page"' : ''}>전체</a>
          <a onclick="setScrimTab('스크림')" ${S.scrimTab === '스크림' ? 'aria-current="page"' : ''}>스크림</a>
          <a onclick="setScrimTab('대회')" ${S.scrimTab === '대회' ? 'aria-current="page"' : ''}>대회</a>
          ${isAdmin ? `<button class="btn-accent" onclick="openSubAdminModal('${card.id}', 'scrim-match-add')">+ 새 단판 경기 추가 (5포지션 템플릿)</button>` : ''}
        </div>

        ${filteredMatches.map((m, mIdx) => `
          <div class="scrim-detail-box">
            <div class="scrim-box-header">
              <span>#${m.timeLabel || ''} ${m.matchType || ''} 단판 (${m.side || ''}/${m.result || ''})</span>
              <div>
                <span style="font-size:12px; font-weight:normal; color:var(--page-muted); margin-right:10px;">${m.date || ''}</span>
                ${isAdmin ? `<button class="btn-btn" style="color:red;" onclick="deleteSubItem('scrim-match', '${card.id}', ${mIdx})">경기 삭제</button>` : ''}
              </div>
            </div>
            <table class="lol-match-table">
              <tbody>
                ${(m.positions || []).map(pos => `
                  <tr>
                    <td style="width: 45%;">
                      <div class="player-row">
                        <span><b>${pos.p1 || ''}</b></span>
                        <span class="tier-badge">${pos.t1 || ''}</span>
                      </div>
                      <div class="champ-row">${pos.c1 || ''}</div>
                    </td>
                    <td class="pos-col">${pos.pos || ''}</td>
                    <td style="width: 45%;">
                      <div class="player-row">
                        <span><b>${pos.p2 || ''}</b></span>
                        <span class="tier-badge">${pos.t2 || ''}</span>
                      </div>
                      <div class="champ-row">${pos.c2 || ''}</div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `).join('')}
      </div>`;
  }

  return `
    <div class="block">
      <div class="toolbar">
        <h2>롤 멸망전</h2>
        ${isAdmin ? `<button class="btn-accent" onclick="openAdminModal('scrim')">+ 새 멸망전 카드 추가</button>` : ''}
      </div>
      <div class="cards">
        ${SCRIM_CARDS.map((c, idx) => `
          <div class="card card-scrim">
            ${c.badge ? `<div class="card-badge">${c.badge}</div>` : ''}
            ${isAdmin ? `<div class="card-admin-btns"><button class="btn-btn" onclick="openAdminModal('scrim', ${idx})">수정</button><button class="btn-btn" style="color:red;" onclick="deleteItem('scrim', ${idx})">삭제</button></div>` : ''}
            <a href="#scrim-${c.id}" style="text-decoration:none; color:inherit; display:flex; flex-direction:column; height:100%;">
              <div>
                <div class="scrim-no">${c.no}</div>
              </div>
              <div class="card-more">상세보기 →</div>
            </a>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function renderMinecraft(subId, dayIndex = 0) {
  if (subId) {
    const srv = MC_SERVERS.find(s => s.id === subId) || MC_SERVERS[0];
    const curDay = srv.days[dayIndex] || srv.days[0];

    return `
      <div class="block">
        <a class="back-btn" onclick="location.hash='#mc'">← 마크서버 목록으로</a>
        <h2>${srv.serverName} (${srv.guildName})</h2>
        <div class="day-tabs">
          ${srv.days.map((d, idx) => `
            <button class="day-tab-btn" onclick="location.hash='#mc-${srv.id}-d${idx}'" ${idx === dayIndex ? 'aria-selected="true"' : ''}>
              ${d.dayTitle} <span style="font-size:11px; opacity:0.7;">(${d.dateStr})</span>
            </button>
          `).join('')}
          ${isAdmin ? `<button class="btn-btn" onclick="openSubAdminModal('${srv.id}', 'mc-day')">+ 일자 추가</button>` : ''}
        </div>
        <div class="toolbar">
          <div></div>
          ${isAdmin ? `<button class="btn-accent" onclick="openSubAdminModal('${srv.id}', 'mc-timeline-add')">+ 타임라인 내용 추가</button>` : ''}
        </div>
        <div class="ep-detail-wrap">
          ${curDay.sections.map((sec, sIdx) => `
            <div class="ep-box">
              <div class="ep-box-title">${sec.title}</div>
              <ul class="timeline-clean">
                ${sec.timelines.map((item, tIdx) => `
                  <li>
                    <div>
                      ${item.url ? `<a href="${item.url}" target="_blank"><span class="arrow">↗</span> <span class="text-pre">${item.text}</span></a>` : `<span class="text-pre">${item.text}</span>`}
                    </div>
                    ${isAdmin ? `<button class="btn-btn" style="color:red;" onclick="deleteSubItem('mc-timeline', '${srv.id}', ${sIdx}, ${tIdx})">삭제</button>` : ''}
                  </li>
                `).join('')}
              </ul>
            </div>
          `).join('')}
        </div>
      </div>`;
  }

  return `
    <div class="block">
      <div class="toolbar">
        <h2>마크서버</h2>
        ${isAdmin ? `<button class="btn-accent" onclick="openAdminModal('mc')">+ 새 마크서버 추가</button>` : ''}
      </div>
      <div class="cards">
        ${MC_SERVERS.map((s, idx) => `
          <div class="card card-mc">
            ${isAdmin ? `<div class="card-admin-btns"><button class="btn-btn" onclick="openAdminModal('mc', ${idx})">수정</button><button class="btn-btn" style="color:red;" onclick="deleteItem('mc', ${idx})">삭제</button></div>` : ''}
            <a href="#mc-${s.id}-d0" style="text-decoration:none; color:inherit; display:flex; flex-direction:column; height:100%;">
              <div>
                <div class="server-name">${s.serverName}</div>
                <div class="guild-name">${s.guildName}</div>
              </div>
              <div class="card-more">상세보기 →</div>
            </a>
          </div>
        `).join('')}
      </div>
    </div>`;
}

/* 총겜동 에피소드 네비게이션 인덱싱 및 연결 완벽 수정 */
function renderChong(subEp) {
  if (subEp !== null && subEp !== undefined && subEp !== "") {
    const curIdx = CHONG_EPS.findIndex(e => String(e.ep) === String(subEp));
    const epObj = curIdx !== -1 ? CHONG_EPS[curIdx] : CHONG_EPS[0];
    
    // 이전/다음 에피소드 자동 매칭
    const prevEp = curIdx > 0 ? CHONG_EPS[curIdx - 1] : null;
    const nextEp = curIdx !== -1 && curIdx < CHONG_EPS.length - 1 ? CHONG_EPS[curIdx + 1] : null;

    return `
      <div class="block">
        <a class="back-btn" onclick="location.hash='#chong'">← 총겜동 목록으로</a>
        <div>
          <h2>Ep.${epObj.ep} ${epObj.title}</h2>
          <p class="text-pre" style="font-size:13px; color:var(--page-muted); margin:4px 0 0 0;">${epObj.desc || ''}</p>
        </div>
        <div class="toolbar" style="margin-top:10px;">
          <div></div>
          ${isAdmin ? `<button class="btn-accent" onclick="openSubAdminModal('${epObj.ep}', 'chong-timeline-add')">+ 타임라인 내용 추가</button>` : ''}
        </div>
        <div class="ep-detail-wrap">
          <div class="ep-box">
            <div class="ep-box-title">방송 타임라인</div>
            <ul class="timeline-clean">
              ${(epObj.timeline || []).map((item, tIdx) => `
                <li>
                  <div>
                    ${item.url ? `<a href="${item.url}" target="_blank"><span class="arrow">↗</span> <span class="text-pre">${item.text}</span></a>` : `<span class="text-pre">${item.text}</span>`}
                  </div>
                  ${isAdmin ? `<button class="btn-btn" style="color:red;" onclick="deleteSubItem('chong-timeline', '${epObj.ep}', ${tIdx})">삭제</button>` : ''}
                </li>
              `).join('')}
            </ul>
          </div>
        </div>
        <div class="ep-footer-nav">
          <div>
            ${prevEp ? `<a class="ep-nav-box" href="#chong-ep${prevEp.ep}">← Ep.${prevEp.ep}</a>` : ''}
          </div>
          <div>
            ${nextEp ? `<a class="ep-nav-box" href="#chong-ep${nextEp.ep}">Ep.${nextEp.ep} →</a>` : ''}
          </div>
        </div>
      </div>`;
  }

  return `
    <div class="block">
      <div class="toolbar">
        <h2>총겜동</h2>
        ${isAdmin ? `<button class="btn-accent" onclick="openAdminModal('chong')">+ 새 에피소드 추가</button>` : ''}
      </div>
      <div class="cards">
        ${CHONG_EPS.map((e, idx) => `
          <div class="card card-chong">
            ${isAdmin ? `<div class="card-admin-btns"><button class="btn-btn" onclick="openAdminModal('chong', ${idx})">수정</button><button class="btn-btn" style="color:red;" onclick="deleteItem('chong', ${idx})">삭제</button></div>` : ''}
            <a href="#chong-ep${e.ep}" style="text-decoration:none; color:inherit; display:flex; flex-direction:column; height:100%;">
              <div>
                <div class="ep-no">Ep.${e.ep}</div>
                <div class="ep-title">${e.title}</div>
              </div>
              <div class="card-more">Ep.${e.ep} 보기 →</div>
            </a>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function getWd(d) {
  if (!d) return '';
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return days[new Date(d).getDay()] || '';
}

function setGame(g) { S.game = g; S.mode = "전체"; render(); }
function setMode(m) { S.mode = m; render(); }
function setYear(y) { S.year = y; render(); }
function setScrimTab(t) { S.scrimTab = t; render(); }
function setMonthOrd(k, ord) { S.monthOrder[k] = ord; render(); }

function render() {
  const hash = location.hash.slice(1) || "record";
  const cat = hash.split("-")[0];

  document.querySelectorAll("#mainNav a").forEach(a => {
    if (a.dataset.cat === cat) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });

  const view = document.getElementById("view");
  if (cat === "record") view.innerHTML = renderRecords();
  else if (cat === "scrim") {
    const match = hash.match(/^scrim-(.+)$/);
    view.innerHTML = renderScrims(match ? match[1] : null);
  } else if (cat === "mc") {
    const match = hash.match(/^mc-([a-z0-9-]+)-d(\d+)$/);
    if (match) view.innerHTML = renderMinecraft(match[1], parseInt(match[2]));
    else view.innerHTML = renderMinecraft(hash.startsWith("mc-") ? hash : null, 0);
  } else if (cat === "chong") {
    const epMatch = hash.match(/^chong-ep(.+)$/);
    view.innerHTML = renderChong(epMatch ? epMatch[1] : null);
  } else view.innerHTML = renderRecords();
}

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
